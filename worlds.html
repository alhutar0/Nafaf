<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<script src="lab-shell.js"></script>
<!-- i18n --><script>try{if(localStorage.getItem("lang")==="en")document.write('<script src="nafaf-i18n.js"><\/script>')}catch(e){}</script><!-- /i18n --><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05080F">
<title>نافذة العوالم</title>
<style>
/* Layout: one living sky fills the screen and changes with the chosen world; a glass panel of that world's physical laws floats on the left; the four worlds sit as cards along the bottom. */
:root{
  --bg:#05070C;--glass:rgba(8,12,22,.84);--line:rgba(226,234,243,.11);
  --fg:#EEF1F5;--muted:#9AA6B8;--brass:#E3A94B;--teal:#5CC9B0;--ok:#6FD39B;--warn:#F2B84B;--bad:#F06B5B;
  --f:system-ui,-apple-system,"Segoe UI",Tahoma,"Geeza Pro","Noto Sans Arabic",Arial,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
  --gt:max(12px,env(safe-area-inset-top,0px));--gb:max(12px,env(safe-area-inset-bottom,0px));
  --deck:96px;color-scheme:dark}
html,body{height:100%;overflow:hidden;margin:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.5;direction:rtl;padding-left:var(--gl);padding-right:var(--gr);padding-block:0}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;z-index:4;top:var(--gt);right:var(--gr);text-align:left;display:flex;flex-direction:column;align-items:flex-end;gap:2px;max-width:50%}
.top b{font-size:13px;font-weight:800}.top small{font-size:9.5px;letter-spacing:.2em;color:var(--brass);direction:ltr}
.laws{position:fixed;z-index:4;top:var(--gt);left:var(--gl);width:330px;bottom:calc(var(--gb) + var(--deck) + 12px);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.lh{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.lh h1{margin:0;font-size:19px;text-wrap:balance}
.lh p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.7}
.lb{overflow-y:auto;padding:10px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl td{padding:5px 2px;border-bottom:1px solid var(--line)}
.tbl td:nth-child(2){text-align:left;font-weight:700}
.tbl td:nth-child(3){text-align:left;color:var(--muted);font-size:11px;width:62px}
.rng{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.rng div{display:flex;justify-content:space-between}
.rng output{color:var(--brass);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--brass)}
.res{border-radius:12px;background:rgba(255,255,255,.04);padding:10px;font-size:12.5px;line-height:1.7}
.res b{color:var(--brass)}
.bars{display:flex;flex-direction:column;gap:6px;font-size:12px}
.bars div{display:grid;grid-template-columns:64px 1fr 66px;gap:8px;align-items:center}
.bars i{display:block;height:8px;border-radius:4px;background:var(--brass)}
.note{font-size:11.5px;color:var(--muted);margin:0;line-height:1.7}
.deck{position:fixed;z-index:4;left:var(--gl);right:var(--gr);bottom:var(--gb);height:var(--deck);display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.deck button{border-radius:16px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 12px;text-align:start;position:relative;overflow:hidden}
.deck button::before{content:"";position:absolute;inset:0;background:var(--sw);opacity:.35}
.deck button>*{position:relative}
.deck button b{font-size:14px}.deck button small{font-size:11px;color:var(--muted)}
.deck button[aria-pressed="true"]{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
@media (max-width:760px){
  :root{--deck:70px}
  .top{display:none}
  .laws{top:auto;right:var(--gr);width:auto;height:46%;bottom:calc(var(--gb) + var(--deck) + 8px)}
  .deck button{padding:6px 8px}.deck button small{display:none}.deck button b{font-size:12.5px}
}
</style>
</head><body>
<a href="./" style="position:fixed;z-index:20;top:max(12px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-size:12px;color:#EDF1F6;text-decoration:none;background:rgba(8,13,26,.85);border:1px solid rgba(237,241,246,.15);border-radius:999px;padding:4px 12px;opacity:.85">→ نفاف</a>


<canvas id="cv" aria-label="سماء العالم المختار وطقسه"></canvas>
<div class="top"><b>نافذة العوالم</b><small>NAFAF · PALEO &amp; EXO WEATHER</small></div>

<aside class="laws glass" aria-live="polite">
  <div class="lh"><h1 id="wName"></h1><p id="wStory"></p></div>
  <div class="lb">
    <table class="tbl" id="tbl"></table>
    <div class="rng"><div><label for="drop">قطر قطرة المطر</label><output id="dropO"></output></div><input type="range" id="drop" min="0.5" max="9" step="0.1" value="2"></div>
    <div class="bars" id="bars"></div>
    <div class="rng"><div><label for="wind">سرعة الريح على ارتفاع مترين</label><output id="windO"></output></div><input type="range" id="wind" min="0" max="40" step="0.5" value="8"></div>
    <div class="res" id="dust"></div>
    <p class="note" id="wNote"></p>
  </div>
</aside>

<nav class="deck" aria-label="العوالم">
  <button data-w="earth" style="--sw:linear-gradient(135deg,#2B6CA3,#D9A35B)"><b>جزيرة العرب اليوم</b><small>الأرض · 2026</small></button>
  <button data-w="green" style="--sw:linear-gradient(135deg,#2E6B4A,#7FB8FF)"><b>جزيرة العرب الخضراء</b><small>الأرض · قبل نحو 10 آلاف سنة</small></button>
  <button data-w="mars" style="--sw:linear-gradient(135deg,#7A3B22,#D58A55)"><b>عاصفة المريخ</b><small>عاصفة غبار تغطي الكوكب</small></button>
  <button data-w="titan" style="--sw:linear-gradient(135deg,#7A5420,#D9A95A)"><b>مطر تيتان</b><small>ميثان سائل على قمر زحل</small></button>
</nav>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>x<a?a:x>b?b:x,lerp=(a,b,t)=>a+(b-a)*t;
const FONT=getComputedStyle(document.body).fontFamily;
const Rg=8.314;
/* ================= the worlds: published physical constants ================= */
const W={
 earth:{n:'جزيرة العرب اليوم',g:9.81,P:101325,T:303,M:.02897,day:24,sol:1361,liq:'water',rhoL:1000,grain:2650,
  story:'صحراء جافة: حزام الضغط المرتفع شبه المداري يهبط فوقنا معظم السنة، فيدفئ الهواء الهابط ويجففه. المطر يأتي من منخفضات عابرة أو من سحب الحجر بعد الظهر.',
  note:'الأرقام لصيف ساحل الباطنة: 30° تقريبًا، وضغط عند مستوى البحر.'},
 green:{n:'جزيرة العرب الخضراء',g:9.81,P:101325,T:299,M:.02897,day:24,sol:1361,liq:'water',rhoL:1000,grain:2650,
  story:'قبل نحو 10 آلاف سنة كان ميل محور الأرض واتجاهه يجعلان شمس الصيف في نصف الكرة الشمالي أقوى. فتقدم نطاق الأمطار الموسمية الهندية شمالًا حتى جنوب الجزيرة، وامتلأت منخفضات في الربع الخالي ببحيرات ضحلة، وانتشرت الأعشاب والأودية الجارية.',
  note:'القوانين الفيزيائية نفسها، والذي تغيّر هو مدار الأرض. تقديرات المطر في تلك الحقبة تتفاوت بين الدراسات، لذلك المشهد توضيحي لا رقمي. الحقبة الرطبة امتدت تقريبًا بين 10 و6 آلاف سنة مضت.'},
 mars:{n:'عاصفة غبار على المريخ',g:3.71,P:610,T:210,M:.04334,day:24.62,sol:586,liq:null,rhoL:0,grain:3000,
  story:'الهواء أرق من هواء الأرض بنحو 170 مرة، وأغلبه ثاني أكسيد الكربون. ومع ذلك تثور عواصف غبار قد تغطي الكوكب كله أسابيع، كما حدث في 2018. الغبار الناعم يمتص الشمس فيدفئ الهواء في الأعلى، فيقوى الريح ويرفع غبارًا أكثر.',
  note:'لا مطر سائل على المريخ: الضغط عند السطح قريب من النقطة الثلاثية للماء (611 باسكال تقريبًا)، فالماء يتجمد أو يتبخر مباشرة.'},
 titan:{n:'أمطار الميثان على تيتان',g:1.352,P:146700,T:94,M:.0286,day:382.7,sol:14.9,liq:'methane',rhoL:450,grain:1000,
  story:'أكبر أقمار زحل، والوحيد في المجموعة الشمسية الذي له جو كثيف. الضغط عند سطحه أعلى من الأرض بنحو 1.5 مرة، والحرارة 179 تحت الصفر. هناك يقوم الميثان بدور الماء: يتبخر من بحيرات قطبية، ويتكثف سحبًا، وينزل مطرًا يحفر أودية.',
  note:'قطرات الميثان قد تكبر حتى نحو 9.5 ملم لأن الجاذبية ضعيفة والهواء كثيف، وتنزل ببطء بنحو 1.6 م/ث، كأنها رقائق ثلج على الأرض (Lorenz 1993). يومه يساوي 16 يومًا أرضيًا تقريبًا.'}};
let cur='earth',drop=2,wind=8;
const rho=w=>w.P*w.M/(Rg*w.T),H=w=>Rg*w.T/(w.M*w.g)/1000;
function vt(w,dmm){if(!w.liq)return null;const d=dmm/1000,ra=rho(w);return Math.sqrt(4/3*w.g*d*(w.rhoL-ra)/(.5*ra))}
// threshold to start dust moving (Bagnold form, 100 µm grains, cohesion ignored), and the 2 m wind that gives it
function ustar(w){return .13*Math.sqrt(w.grain*w.g*1e-4/rho(w))}
const Z0=.001,toWind=u=>u/.4*Math.log(2/Z0);   // roughness length 1 mm
function boilWater(w){const L=40650;return 1/(1/373.15-Rg*Math.log(w.P/101325)/L)}

/* ================= panel ================= */
function render(){const w=W[cur],E=W.earth,f=(a,b)=>{const r=a/b;return r>=10||r<=.1?'×'+r.toPrecision(2):'×'+r.toFixed(2)};
  $('wName').textContent=w.n;$('wStory').textContent=w.story;$('wNote').textContent=w.note;
  const rows=[['الجاذبية',w.g.toFixed(2)+' م/ث²',f(w.g,E.g)],['الضغط عند السطح',w.P>=1e4?(w.P/1000).toFixed(1)+' ك.باسكال':w.P+' باسكال',f(w.P,E.P)],['الحرارة',Math.round(w.T-273.15)+'°م',''],
    ['كثافة الهواء',rho(w).toPrecision(3)+' كغ/م³',f(rho(w),rho(E))],['سُمك الغلاف (ارتفاع المقياس)',H(w).toFixed(1)+' كم',f(H(w),H(E))],['أشعة الشمس',w.sol+' واط/م²',f(w.sol,E.sol)],['طول اليوم',w.day<48?w.day.toFixed(1)+' ساعة':(w.day/24).toFixed(1)+' يومًا',''],
    ['وزن شخص كتلته 70 كغ',Math.round(70*w.g/E.g)+' كغ وزنًا',''],['يغلي الماء عند',w===W.titan?'—':Math.round(boilWater(w)-273.15)+'°م','']];
  $('tbl').innerHTML=rows.map(r=>'<tr><td>'+r[0]+'</td><td class="num">'+r[1]+'</td><td class="num">'+r[2]+'</td></tr>').join('');
  $('dropO').textContent=drop.toFixed(1)+' ملم';$('windO').textContent=wind+' م/ث';
  const vs=Object.entries(W).filter(([k,x])=>x.liq&&k!=='green').map(([k,x])=>[x===W.titan?'تيتان (ميثان)':'الأرض (ماء)',vt(x,drop),k]);const mx=Math.max(...vs.map(v=>v[1]));
  $('bars').innerHTML='<div style="grid-template-columns:1fr"><span>سرعة سقوط القطرة</span></div>'+vs.map(v=>'<div><span>'+v[0]+'</span><i style="width:'+(v[1]/mx*100)+'%;'+(v[2]===cur||(cur==='green'&&v[2]==='earth')?'':'opacity:.45')+'"></i><span class="num">'+v[1].toFixed(2)+' م/ث</span></div>').join('')+(cur==='mars'?'<div style="grid-template-columns:1fr"><span style="color:var(--muted)">المريخ: لا يوجد سائل يمطر.</span></div>':'');
  const ut=ustar(w),wt=toWind(ut),u=wind*.4/Math.log(2/Z0),lift=u>=ut;
  $('dust').innerHTML='يبدأ الغبار (حبيبات 0.1 ملم) بالتحرك هنا عند ريح نحو <b class="num">'+wt.toFixed(1)+' م/ث</b> على ارتفاع مترين. '+(lift?'الريح الآن <b>كافية لرفعه</b>.':'الريح الآن أضعف من ذلك.')+(cur==='mars'?' الهواء الرقيق يحتاج سرعة أعلى بكثير، لكن ما يرتفع يبقى معلقًا أسابيع لأن الجاذبية والهواء كليهما ضعيفان.':cur==='titan'?' الهواء الكثيف يحرك الحبيبات بريح خفيفة جدًا، ولهذا توجد كثبان على تيتان رغم ضعف رياحه. التجارب المخبرية تشير إلى عتبة أعلى قليلًا بسبب التصاق الحبيبات، وهذه الصيغة البسيطة تتجاهله.':'');
  document.querySelectorAll('.deck button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.w===cur?'true':'false'));
  try{location.hash=cur}catch(e){}}
document.querySelectorAll('.deck button').forEach(b=>b.addEventListener('click',()=>{cur=b.dataset.w;particles.length=0;render()}));
$('drop').addEventListener('input',e=>{drop=+e.target.value;render()});
$('wind').addEventListener('input',e=>{wind=+e.target.value;render()});

/* ================= the living sky ================= */
const cv=$('cv'),cx=cv.getContext('2d');let Wd=0,Hd=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);Wd=innerWidth;Hd=innerHeight;cv.width=Wd*DPR;cv.height=Hd*DPR}
addEventListener('resize',resize);
const particles=[];let last=performance.now();
const SKY={earth:['#2E6EA8','#9CC4E0','#E2B677','#C98A4A'],green:['#3E6E9C','#A9C4D4','#6E9A58','#3E6A3A'],mars:['#7A4A30','#C48A5E','#9A5A36','#6E3A22'],titan:['#5E4522','#B8893F','#6B5530','#3E3020']};
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const c=cx,w=W[cur],S=SKY[cur],gy=Hd*.66;c.setTransform(DPR,0,0,DPR,0,0);
  const g=c.createLinearGradient(0,0,0,gy);g.addColorStop(0,S[0]);g.addColorStop(1,S[1]);c.fillStyle=g;c.fillRect(0,0,Wd,gy);
  // the sun: smaller and dimmer the farther the world
  const sr=cur==='mars'?18:cur==='titan'?6:28,sa=cur==='titan'?.25:cur==='mars'?.55:1,sx=Wd*.7,sy=Hd*.16;
  const sg=c.createRadialGradient(sx,sy,0,sx,sy,sr*6);sg.addColorStop(0,'rgba(255,240,210,'+(.6*sa)+')');sg.addColorStop(1,'rgba(255,240,210,0)');c.fillStyle=sg;c.fillRect(0,0,Wd,gy);c.fillStyle='rgba(255,248,230,'+sa+')';c.beginPath();c.arc(sx,sy,sr,0,7);c.fill();
  if(cur==='titan'){c.fillStyle='rgba(210,150,60,.35)';c.fillRect(0,0,Wd,gy)}
  // ground
  const gg=c.createLinearGradient(0,gy,0,Hd);gg.addColorStop(0,S[2]);gg.addColorStop(1,S[3]);c.fillStyle=gg;c.beginPath();c.moveTo(0,gy);
  for(let x=0;x<=Wd;x+=20)c.lineTo(x,gy+Math.sin(x*.008+(cur==='earth'?1:0))*14+Math.sin(x*.02)*6);c.lineTo(Wd,Hd);c.lineTo(0,Hd);c.closePath();c.fill();
  // lakes: Green Arabia's shallow lakes, Titan's methane seas
  if(cur==='green'||cur==='titan'){c.fillStyle=cur==='green'?'rgba(90,150,190,.85)':'rgba(40,30,20,.85)';c.beginPath();c.ellipse(Wd*.55,gy+Hd*.12,Wd*.22,Hd*.04,0,0,7);c.fill();
    c.strokeStyle='rgba(255,255,255,.15)';for(let k=0;k<5;k++){c.beginPath();c.ellipse(Wd*.55,gy+Hd*.12,Wd*.22*(.3+k*.15)*(1+.03*Math.sin(now/600+k)),Hd*.04*(.3+k*.15),0,0,7);c.stroke()}}
  if(cur==='green')for(let k=0;k<40;k++){const x=(k*97)%Wd,y=gy+18+((k*53)%(Hd*.25));c.strokeStyle='rgba(70,120,60,.9)';c.lineWidth=2;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+4+Math.sin(now/700+k)*3,y-12,x+2,y-22);c.stroke()}
  // weather particles, moving by this world's own physics
  const v=vt(w,drop),pxPerM=Hd/40;   // the frame shows about 40 m of air
  if(cur==='earth'||cur==='mars'){const n=cur==='mars'?260:Math.round(wind*6);while(particles.length<n)particles.push({x:Math.random()*Wd,y:Math.random()*Hd*.9,s:Math.random()});
    const lift=wind*.4/Math.log(2/Z0)>=ustar(w);
    c.fillStyle=cur==='mars'?'rgba(220,150,100,.55)':'rgba(230,200,150,.5)';for(const p of particles){p.x-=(wind*(cur==='mars'?2.2:1)+4)*pxPerM*.12*dt*(1+p.s);p.y+=Math.sin(now/500+p.s*9)*.3;if(p.x<0){p.x=Wd;p.y=lift||cur==='mars'?Math.random()*Hd*.9:gy-Math.random()*30}c.fillRect(p.x,p.y,2+p.s*2,1.5)}
    if(cur==='mars'){c.fillStyle='rgba(180,100,60,.32)';c.fillRect(0,0,Wd,Hd)}}
  else{const n=cur==='green'?220:160;while(particles.length<n)particles.push({x:Math.random()*Wd,y:Math.random()*gy,s:.6+Math.random()*.8});
    const len=cur==='titan'?drop*2.2:Math.max(6,v*3),wdt=cur==='titan'?drop*.9:1.2;c.strokeStyle=cur==='titan'?'rgba(255,220,160,.7)':'rgba(200,225,255,.6)';c.lineWidth=wdt;c.lineCap='round';
    for(const p of particles){p.y+=v*pxPerM*dt*p.s;p.x-=wind*.15*pxPerM*dt*.3;if(p.y>gy+10){p.y=-10;p.x=Math.random()*Wd}c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+wind*.2,p.y+len);c.stroke()}
    if(cur==='green'){c.fillStyle='rgba(80,90,110,.55)';for(let k=0;k<4;k++){c.beginPath();c.ellipse(Wd*(.2+k*.22),Hd*.08,Wd*.16,Hd*.06,0,0,7);c.fill()}}}
  c.font='600 12px '+FONT;c.fillStyle='rgba(255,255,255,.65)';c.textAlign='center';c.direction='rtl';
  c.fillText(v?'القطرة تسقط هنا بسرعة '+v.toFixed(2)+' م/ث':'لا مطر سائل: الغبار وحده يتحرك',Wd*(Wd<760?.5:.62),gy-14);
  requestAnimationFrame(frame)}
const h=(location.hash||'').slice(1);if(W[h])cur=h;
resize();render();requestAnimationFrame(frame);
})();
</script>

<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})</script>
</body></html>
