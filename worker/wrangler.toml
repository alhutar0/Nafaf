# خادم إشعارات نفاف — يُنشر تلقائيًا من GitHub Actions عند أي تعديل في مجلد worker/
name = "nafa-push"
main = "push.js"
account_id = "5dfcb01ccd73bc287c8d658cb9e118e8"
compatibility_date = "2025-01-01"

# لا تمسح المتغيرات المحفوظة في لوحة Cloudflare (مثل GOOGLE_CLIENT_ID).
# الأسرار (VAPID_PRIVATE_KEY, VAPID_PUBLIC_KEY, ADMIN_PASS) لا تُكتب هنا أبدًا وتبقى كما هي في Cloudflare.
keep_vars = true

# الدومين الافتراضي nafa-push.alhutar0.workers.dev يبقى شغالًا
workers_dev = true

[[kv_namespaces]]
binding = "NAFAF_KV"
id = "0070863de928403bbf9ef36d46550ac6"   # nafaf-subscribers

# فحص المطر الدوري — كل ١٠ دقائق
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

# ★ مسار المستخدم: عدّاد ذرّي واحد (Durable Object، تخزين SQLite)
[[durable_objects.bindings]]
name = "FUNNEL"
class_name = "Funnel"

[[migrations]]
tag = "v1-funnel"
new_sqlite_classes = ["Funnel"]

# ★ الزوار مباشرة: كائن واحد بتخزين SQLite (presence.js)
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

[[migrations]]
tag = "v2-presence"
new_sqlite_classes = ["Presence"]
