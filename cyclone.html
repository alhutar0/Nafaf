<style>
/* Layout: the globe fills the screen. Everything else is small and collapsible so the planet stays the picture:
   a top strip (back · three modes), a one-line HUD that appears only when a storm exists, and a bottom drawer
   that folds to a slim bar while a storm plays. */
:root{--ink:#EEF3FA;--mute:rgba(238,243,250,.62);--glass:rgba(6,12,26,.74);--edge:rgba(255,255,255,.10);--gold:#E3A94B;--cyan:#6FE3E1;
  --f:system-ui,-apple-system,"Segoe UI",Tahoma,"Geeza Pro","Noto Sans Arabic",Arial,sans-serif;
  --gl:max(14px,env(safe-area-inset-left,0px));--gr:max(14px,env(safe-area-inset-right,0px));--gt:max(10px,env(safe-area-inset-top,0px));--gb:max(10px,env(safe-area-inset-bottom,0px));color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02050d;color:var(--ink);font-family:var(--f);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);border:1px solid var(--edge);box-shadow:0 14px 40px -18px rgba(0,0,0,.9)}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate}
/* top strip */
#top{position:fixed;z-index:5;top:var(--gt);left:var(--gl);right:var(--gr);display:flex;align-items:center;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
#back{height:36px;padding:0 12px;border-radius:999px;display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:13px;font-weight:700}
#modes{margin-inline-start:auto;display:flex;gap:3px;padding:3px;border-radius:999px}
#modes button{white-space:nowrap;border:0;background:transparent;border-radius:999px;height:30px;padding:0 11px;font-size:12.5px;font-weight:700;color:var(--mute);transition:background .25s,color .25s}
#modes button[aria-pressed=true]{background:var(--gold);color:#1a1205}
#lng{height:36px;min-width:36px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:800}
/* HUD: one line, only while a storm exists */
#hud{position:fixed;z-index:4;top:calc(var(--gt) + 46px);left:50%;transform:translate(-50%,-8px);opacity:0;pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.34,1.56,.64,1);
  display:flex;align-items:center;gap:10px;padding:7px 14px;border-radius:999px;font-size:12.5px;white-space:nowrap;max-width:calc(100% - 28px)}
#hud.on{opacity:1;transform:translate(-50%,0)}
#hud .cat{display:flex;align-items:center;gap:6px;font-weight:800}
#hud .cat i{width:10px;height:10px;border-radius:50%;background:var(--c,#93A3B7);box-shadow:0 0 10px var(--c,#93A3B7)}
#hud b{font-size:14px}#hud small{color:var(--mute)}
/* toast */
#toast{position:fixed;z-index:6;left:50%;top:calc(var(--gt) + 88px);transform:translate(-50%,-6px);opacity:0;transition:opacity .3s,transform .3s;padding:8px 14px;border-radius:14px;font-size:13px;max-width:calc(100% - 40px);text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* bottom drawer */
#drawer{position:fixed;z-index:5;left:var(--gl);right:var(--gr);bottom:var(--gb);max-width:560px;margin-inline:auto;border-radius:24px;overflow:hidden;transition:transform .45s cubic-bezier(.32,1.2,.5,1)}
#grab{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:10px 14px;text-align:start}
#grab .bar{position:absolute;top:5px;left:50%;width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);transform:translateX(-50%)}
#grab .t{flex:1;min-width:0;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#grab .chev{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);transition:transform .35s}
#drawer.open #grab .chev{transform:rotate(180deg)}
#pane{max-height:0;overflow:auto;transition:max-height .45s cubic-bezier(.32,1.2,.5,1);overscroll-behavior:contain}
#drawer.open #pane{max-height:min(40vh,420px)}
.sec{padding:0 14px 14px}
.sec h3{margin:8px 2px 8px;font-size:11.5px;font-weight:800;color:var(--mute);letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{display:flex;flex-direction:column;gap:3px;text-align:start;padding:10px 12px;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.04);transition:background .2s,border-color .2s,scale .35s cubic-bezier(.34,1.56,.64,1)}
.card:active{scale:.97}.card:hover{background:rgba(255,255,255,.07)}
.card[aria-pressed=true]{border-color:var(--gold);background:rgba(227,169,75,.10)}
.card b{font-size:13.5px}.card small{font-size:11.5px;color:var(--mute);line-height:1.45}
.card .pk{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute)}
.card .pk i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--edge);background:rgba(255,255,255,.06);font-size:13px;font-weight:700}
.btn.pri{background:var(--gold);color:#1a1205;border-color:transparent}
.btn[disabled]{opacity:.4;cursor:default}
.env{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.env div{padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--edge)}
.env small{display:block;font-size:10.5px;color:var(--mute)}.env b{font-size:15px}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin-top:10px;font-size:12.5px}
.sl input{grid-column:1 / -1;width:100%;accent-color:var(--gold)}
.sl output{font-weight:800}
.note{font-size:11.5px;color:var(--mute);line-height:1.6;margin:10px 2px 0}
/* replay timeline */
#tl{display:none;align-items:center;gap:8px;padding:0 14px 12px}
#tl.on{display:flex}
#tl input{flex:1;accent-color:var(--gold)}
#tl .ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--edge);background:rgba(255,255,255,.06);display:grid;place-items:center;padding:0}
#tl svg,#grab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* result card for the forecaster */
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.res div{padding:10px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--edge);text-align:center}
.res b{display:block;font-size:20px}.res small{font-size:10.5px;color:var(--mute)}
#credit{position:fixed;z-index:3;bottom:2px;left:50%;transform:translateX(-50%);font-size:9.5px;color:rgba(238,243,250,.38);white-space:nowrap;pointer-events:none}
#boot{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#02050d;color:var(--mute);font-size:14px;transition:opacity .6s}
#boot.done{opacity:0;pointer-events:none}
/* v23: layers, impacts pill, achievements, history filters */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#lay{height:36px;width:36px;border-radius:50%;display:grid;place-items:center;padding:0}
#lay svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
#layP{position:fixed;z-index:7;top:calc(var(--gt) + 44px);inset-inline-end:var(--gr);width:248px;padding:6px;border-radius:18px;opacity:0;transform:translateY(-6px) scale(.96);transform-origin:top;pointer-events:none;transition:opacity .2s,transform .35s cubic-bezier(.34,1.56,.64,1)}
html[dir=rtl] #layP{inset-inline-end:auto;left:var(--gl)}
#layP.on{opacity:1;transform:none;pointer-events:auto}
.tg{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer}
.tg:hover{background:rgba(255,255,255,.05)}
.tg span{flex:1;min-width:0}.tg b{display:block;font-size:13px}.tg small{display:block;font-size:11px;color:var(--mute)}
.tg input{position:absolute;opacity:0;pointer-events:none}
.tg i{flex:none;width:36px;height:22px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;transition:background .25s}
.tg i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.tg input:checked+i{background:var(--gold)}
.tg input:checked+i::after{transform:translateX(14px)}
html[dir=rtl] .tg input:checked+i::after{transform:translateX(-14px)}
#imp{position:fixed;z-index:4;top:calc(var(--gt) + 84px);left:50%;transform:translate(-50%,-6px);opacity:0;pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.34,1.56,.64,1);
  display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;font-size:12px;white-space:nowrap;max-width:calc(100% - 28px)}
#imp.on{opacity:1;transform:translate(-50%,0)}
#imp i{width:8px;height:8px;border-radius:50%;flex:none}
#imp small{color:var(--mute)}#imp .more{opacity:.8}
#toast{top:calc(var(--gt) + 122px)}
#badge{position:fixed;z-index:8;left:50%;top:calc(var(--gt) + 50px);transform:translate(-50%,-20px) scale(.8);opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;padding:10px 18px 10px 12px;border-radius:999px;border-color:rgba(227,169,75,.55);
  box-shadow:0 0 0 1px rgba(227,169,75,.25),0 14px 40px -10px rgba(227,169,75,.6);transition:opacity .3s,transform .5s cubic-bezier(.34,1.56,.64,1)}
#badge.on{opacity:1;transform:translate(-50%,0)}
#badge .bi{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:radial-gradient(circle at 35% 30%,#F6CF85,#E3A94B 60%,#9A6A22)}
#badge small{display:block;font-size:10.5px;color:#F6CF85;font-weight:800}#badge b{font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 14px 10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.05);font-size:12.5px;font-weight:700;color:var(--mute)}
.chip[aria-pressed=true]{background:var(--gold);color:#1a1205;border-color:transparent}
.card.seen{opacity:.72}
.card.seen b::after{content:" ✓";color:var(--gold)}
.prog{display:flex;align-items:center;gap:12px;margin:6px 2px 12px}
.prog b{font-size:26px}.prog b small{font-size:13px;color:var(--mute)}
.prog span{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.prog span i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#E3A94B,#F08A4B)}
.ach{display:flex;flex-direction:column;gap:6px}
.am{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.035);text-align:start}
.am .bi{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.06);filter:grayscale(1);opacity:.6}
.am.got .bi{filter:none;opacity:1;background:radial-gradient(circle at 35% 30%,#F6CF85,#E3A94B 60%,#9A6A22);box-shadow:0 0 16px rgba(227,169,75,.45)}
.am .tx{flex:1;min-width:0}.am b{display:block;font-size:13.5px}.am small{display:block;font-size:11.5px;color:var(--mute);line-height:1.45}
.am .ok{flex:none;font-size:12px;font-weight:800;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.07)}
.am.got .ok{background:rgba(227,169,75,.18);color:var(--gold)}
#modes button{padding:0 9px}
@media (max-width:420px){#backT{display:none}#back{width:36px;padding:0;justify-content:center}#modes button{padding:0 8px;font-size:12px}}
@media (max-width:350px){#modes button{padding:0 6px;font-size:11px}}
@media (min-width:900px){#drawer{left:auto;right:var(--gr);width:420px;bottom:var(--gb)}html[dir=ltr] #drawer{right:auto;left:var(--gl)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  grab(T('خطأك: ', 'Your error: ') + Math.round(err) + T(' كم', ' km'));
}

/* ═════════ panes ═════════ */
function pane(html, keep) { $('pane').innerHTML = html; if (!keep) $('pane').scrollTop = 0; }
function basinCards(sel) {
  return `<div class="grid">${BASINS.map(b => `<button class="card" data-basin="${b.id}" aria-pressed="${b === sel}"><b>${EN ? b.en : b.ar}</b><small>${EN ? b.sen : b.sar}</small></button>`).join('')}</div>`;
}
function simControls() {
  return `<div class="sec"><h3>${T('ماذا لو؟', 'What if?')}</h3>
    <label class="sl"><span>${T('احترار البحر', 'Ocean warming')}</span><output class="num" id="oW">+${fmt(P.warm, 1)}°</output><input type="range" id="iW" min="0" max="3" step="0.1" value="${P.warm}"></label>
    <label class="sl"><span>${T('قصّ الرياح', 'Wind shear')}</span><output class="num" id="oS">×${fmt(P.shearX, 1)}</output><input type="range" id="iS" min="0.2" max="2" step="0.1" value="${P.shearX}"></label>
    <label class="sl"><span>${T('رطوبة الجو الأوسط', 'Mid-level humidity')}</span><output class="num" id="oR">${P.rh >= 0 ? '+' : ''}${P.rh}%</output><input type="range" id="iR" min="-30" max="20" step="1" value="${P.rh}"></label>
    <p class="note">${T('الشدة القصوى الممكنة من معادلة DeMaria–Kaplan، والتهوية من القص والجفاف، والضعف فوق اليابسة من Kaplan–DeMaria، والتوجيه من رياح ٨٥٠ و٥٠٠ و٢٠٠ مليبار مع انجراف بيتا. نموذج تعليمي مبسّط، وليس تنبؤًا.', 'Potential intensity from DeMaria–Kaplan, ventilation from shear and dryness, inland decay from Kaplan–DeMaria, steering from 850/500/200 hPa winds plus beta drift. A simplified teaching model, not a forecast.')}</p></div>`;
}
async function simPane() {
  setTimeout(buildLayers, 0);
  pane(`<div class="sec"><h3>${T('اختر المحيط', 'Choose an ocean')}</h3>${basinCards(BASIN)}</div><div class="sec"><h3>${T('بيئة اليوم الحقيقية', "Today's real environment")}</h3><div id="envBox" class="note" style="margin:0">${T('جارٍ قراءة حرارة البحر والرياح…', 'Reading sea temperature and winds…')}</div></div>` + simControls());
  grab(T('اضغط على البحر لتطلق اضطرابًا', 'Tap the sea to launch a disturbance'));
  try {
    const E = await loadEnv(BASIN); const ok = E.pts.filter(p => p.sst != null);
    const sst = ok.reduce((a, p) => a + p.sst, 0) / ok.length, mx = Math.max(...ok.map(p => p.sst)), sh = E.pts.reduce((a, p) => a + p.sh, 0) / E.pts.length, rh = E.pts.reduce((a, p) => a + p.rh, 0) / E.pts.length;
    $('envBox') && ($('envBox').outerHTML = `<div class="env"><div><small>${T('حرارة البحر (المتوسط · الأعلى)', 'Sea temp (mean · max)')}</small><b class="num">${fmt(sst, 1)}° · ${fmt(mx, 1)}°</b></div><div><small>${T('القص ٨٥٠–٢٠٠', 'Shear 850–200')}</small><b class="num">${fmt(sh, 0)} ${T('م/ث', 'm/s')}</b></div><div><small>${T('رطوبة ٧٠٠ مليبار', 'RH 700 hPa')}</small><b class="num">${fmt(rh, 0)}%</b></div></div><p class="note">${T('بيانات حية من Open-Meteo لشبكة كل ٥ درجات فوق المحيط. حين تكون حرارة البحر فوق ٢٦٫٥° والقص ضعيفًا تزيد فرصة التكوّن.', 'Live Open-Meteo data on a 5° grid over the ocean. Sea above 26.5° with weak shear favours genesis.')}</p>`);
    buildLayers();
  } catch (e) {
    $('envBox') && ($('envBox').textContent = T('تعذّرت قراءة البيانات الحية (تحتاج اتصالًا). ستعمل المحاكاة ببيئة افتراضية تعليمية: بحر ٢٩٫٥°، قص ٨ م/ث، رطوبة ٦٥٪.', 'Live data unavailable (needs a connection). The sandbox will use a typical teaching environment: sea 29.5°, shear 8 m/s, humidity 65%.'));
  }
}
let HF = CYC.histFilter || 'om';
function histPane() {
  H = null; $('tl').classList.remove('on'); $('hud').classList.remove('on'); $('imp').classList.remove('on'); vortex.visible = false; hideRings(); clearTracks();
  const chips = [['om', ME && !(ME[0] >= 16.4 && ME[0] <= 26.6 && ME[1] >= 51.8 && ME[1] <= 60) ? T('قربك', 'Near you') : T('قرب عُمان', 'Near Oman')], ['all', T('الكل', 'All')], ['strong', T('الأقوى', 'Strongest')], ...BASINS.filter(b => STORMS.some(s => s.basin === b.id)).map(b => [b.id, EN ? b.en : b.ar])];
  let list = STORMS.slice();
  if (HF === 'om') list = list.filter(s => s.om); else if (HF === 'strong') list.sort((a, b) => b.peak - a.peak); else if (HF !== 'all') list = list.filter(s => s.basin === HF);
  if (HF !== 'strong') list.sort((a, b) => b.start.localeCompare(a.start));
  if (HF === 'strong') list = list.slice(0, 12);
  pane(`<div class="chips">${chips.map(([k, t]) => `<button class="chip" data-hf="${k}" aria-pressed="${HF === k}">${t}</button>`).join('')}</div>
    <div class="sec"><div class="grid">${list.map(s => { const [n, c] = catOf(s.peak, s.basin); return `<button class="card${SEEN.includes(s.id) ? ' seen' : ''}" data-storm="${s.id}"><b>${EN ? s.en : s.ar} <span class="num" style="font-weight:600;color:var(--mute)">${s.start.slice(0, 4)}</span></b><span class="pk" style="--c:${c}"><i></i>${n} · <span class="num">${kmh(s.peak)}</span> ${T('كم/س', 'km/h')}</span><small>${EN ? s.lf[1] : s.lf[0]}</small></button>`; }).join('')}</div>
    <p class="note">${T(STORMS.length + ' إعصارًا حقيقيًا من أرشيف IBTrACS الدولي (NOAA)، منها ' + STORMS.filter(s => s.om).length + ' مرّت على بعد ٢٥٠ كم أو أقل من ساحل عُمان. الشمس على الكرة في موضعها الحقيقي لحظة الإعصار. اضغط على الكرة أثناء العرض لتعرف قوة الرياح في أي نقطة.', STORMS.length + ' real storms from the IBTrACS archive (NOAA); ' + STORMS.filter(s => s.om).length + ' passed within 250 km of Oman’s coast. The sun is where it really was. Tap the globe during a replay to read the wind at any point.')}</p></div>`);
  grab(T('اختر إعصارًا من التاريخ', 'Pick a storm from history'));
  drawerOpen(true);
}
function achPane() {
  H = null; $('tl').classList.remove('on'); $('hud').classList.remove('on'); $('imp').classList.remove('on'); vortex.visible = false; hideRings(); clearTracks();
  const got = ACH.filter(a => ACHS[a.id]).length;
  pane(`<div class="sec"><div class="prog"><b class="num">${got}<small>/${ACH.length}</small></b><span><i style="width:${got / ACH.length * 100}%"></i></span></div>
    <div class="ach">${ACH.map(a => `<button class="am${ACHS[a.id] ? ' got' : ''}" data-go="${a.go}"><span class="bi">${a.i}</span><span class="tx"><b>${EN ? a.en : a.ar}</b><small>${EN ? a.den : a.dar}</small></span><span class="ok">${ACHS[a.id] ? '✓' : T('ابدأ', 'Go')}</span></button>`).join('')}</div>
    <p class="note">${T('الإنجازات تُحفظ على جهازك فقط. الفئات بمقياس سافير–سمبسون لرياح الدقيقة الواحدة.', 'Achievements are saved on this device only. Categories use Saffir–Simpson 1-minute winds.')}</p></div>`);
  grab(T('التحديات · ', 'Challenges · ') + got + '/' + ACH.length); drawerOpen(true); flyTo(18, 62, 2.9);
}
function setMode(m) {
  MODE = m; try { sessionStorage.setItem('nx.cy.mode', m); } catch (e) {} playing = false; S = null; FC = null; H = null; vortex.visible = false; $('hud').classList.remove('on'); $('tl').classList.remove('on'); clearTracks();
  document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
  sunV.copy(sunDir(Date.now())); hideRings(); $('imp').classList.remove('on'); buildLayers();
  if (m === 'ach') { achPane(); return; }
  if (m === 'sim') { flyTo(BASIN.c[0], BASIN.c[1], 2.6); simPane(); drawerOpen(true); }
  if (m === 'history') histPane();
  if (m === 'forecast') fcNew();
}
function setPlayIcon() { $('play').innerHTML = playing ? '<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'; }

/* ═════════ events ═════════ */
$('pane').addEventListener('click', e => {
  const b = e.target.closest('[data-basin]'); if (b) { BASIN = basinOf(b.dataset.basin); flyTo(BASIN.c[0], BASIN.c[1], 2.6); simPane().then(buildLayers); drawerOpen(false); return; }
  const hf = e.target.closest('[data-hf]'); if (hf) { HF = hf.dataset.hf; histPane(); return; }
  const go = e.target.closest('[data-go]'); if (go) { const [m, x] = go.dataset.go.split(':'); if (m === 'sim' && x) BASIN = basinOf(x); if (m === 'history' && x) HF = x; setMode(m); return; }
  const s = e.target.closest('[data-storm]'); if (s) { histOpen(STORMS.find(x => x.id === s.dataset.storm)); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'replay') histOpen(H); if (a.dataset.act === 'list') histPane(); if (a.dataset.act === 'fcNew') fcNew(); if (a.dataset.act === 'fcReveal') fcReveal();
});
$('pane').addEventListener('input', e => {
  if (e.target.id === 'iW') { P.warm = +e.target.value; $('oW').textContent = '+' + fmt(P.warm, 1) + '°'; }
  if (e.target.id === 'iS') { P.shearX = +e.target.value; $('oS').textContent = '×' + fmt(P.shearX, 1); }
  if (e.target.id === 'iR') { P.rh = +e.target.value; $('oR').textContent = (P.rh >= 0 ? '+' : '') + P.rh + '%'; }
});
$('grab').addEventListener('click', () => drawerOpen(!$('drawer').classList.contains('open')));
document.querySelectorAll('#modes button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.m)));
$('play').addEventListener('click', () => { if (!H) return; if (hT >= H.p[H.p.length - 1][0]) hT = 0; playing = !playing; setPlayIcon(); });
$('spd').addEventListener('click', () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; $('spd').firstChild.textContent = '×' + speed; });
$('scrub').addEventListener('input', e => { if (!H) return; hT = +e.target.value / 1000 * H.p[H.p.length - 1][0]; histTick.k = -1; histTick(0); });
$('lng').addEventListener('click', () => { try { localStorage.setItem('lang', EN ? 'dial' : 'en'); } catch (e) {} location.reload(); });
/* tap on the globe (ignore drags) */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
canvas.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY, performance.now()]; });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 8 || performance.now() - down[2] > 450) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(ptr, cam);
  const hit = ray.intersectObject(globe)[0]; if (!hit) return; const [lat, lon] = v2ll(hit.point);
  if (MODE === 'sim') simStart(lat, lon); else if (MODE === 'forecast' && FC && !FC.done) fcGuess(lat, lon);
  else if (curV && curC && (MODE === 'history' || MODE === 'forecast')) { const d = hav(curC, [lat, lon]), w = curV(d) * 3.6;
    toast(d < 1600 ? T('على بعد ', '') + Math.round(d) + T(' كم من المركز: رياح نحو ', ' km from the centre: winds near ') + Math.round(w) + T(' كم/س', ' km/h') + (w >= 35 ? ' · ' + windWord(w) : '') : T('بعيد عن الإعصار', 'Far from the storm')); }
});

function layPane() {
  const L = [['rings', T('دوائر الرياح', 'Wind radii'), T('٦٣ · ٩٣ · ١١٩ كم/س', '63 · 93 · 119 km/h')], ['cities', T('تأثير المدن', 'City impacts'), T('أقوى رياح متوقعة في أقرب مدينة', 'Strongest wind at the nearest city')], ['sst', T('حرارة البحر اليوم', "Today's sea temp"), T('في المحاكي فقط', 'Sandbox only')], ['steer', T('رياح التوجيه', 'Steering flow'), T('في المحاكي فقط', 'Sandbox only')]];
  $('layP').innerHTML = L.map(([k, t, d]) => `<label class="tg"><span><b>${t}</b><small>${d}</small></span><input type="checkbox" data-lay="${k}" ${LAY[k] ? 'checked' : ''}><i></i></label>`).join('');
}
$('lay').addEventListener('click', e => { e.stopPropagation(); $('layP').classList.toggle('on'); });
addEventListener('click', e => { if (!e.target.closest('#layP') && !e.target.closest('#lay')) $('layP').classList.remove('on'); });
$('layP').addEventListener('change', async e => { const k = e.target.dataset.lay; if (!k) return; LAY[k] = e.target.checked; try { localStorage.setItem('nx.cy.lay', JSON.stringify(LAY)); } catch (er) {}
  if ((k === 'sst' || k === 'steer') && LAY[k]) { if (MODE !== 'sim') toast(T('هذه الطبقة تعرض محيط اليوم، فتظهر في المحاكي', "This layer shows today's ocean, so it appears in the Sandbox")); else { try { await loadEnv(BASIN); } catch (er) { toast(T('تحتاج اتصالًا بالإنترنت', 'Needs a connection')); } } }
  buildLayers(); if (curC && curV) { if (k === 'rings' && !LAY.rings) hideRings(); } });

/* ═════════ loop ═════════ */
function resize() { const w = innerWidth, h = innerHeight; R.setSize(w, h, false); cam.aspect = w / h; cam.fov = w / h < 0.8 ? 52 : 38; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now(), tt = 0, lastTouch = 0;
canvas.addEventListener('pointerdown', () => { lastTouch = performance.now(); }); canvas.addEventListener('wheel', () => { lastTouch = performance.now(); }, { passive: true });
ctl.addEventListener('change', () => { if (ctl._nxUser) lastTouch = performance.now(); });
ctl.addEventListener('start', () => { ctl._nxUser = true; lastTouch = performance.now(); }); ctl.addEventListener('end', () => { ctl._nxUser = false; lastTouch = performance.now(); });
function loop(now) {
  requestAnimationFrame(loop); const dt = Math.min(0.05, (now - last) / 1000); last = now; tt += dt;
  if (fly) { const k = clamp((now - fly.t0) / fly.ms, 0, 1), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    const a = fly.a.clone().normalize(), b = fly.b.clone().normalize(), r = fly.a.length() + (fly.b.length() - fly.a.length()) * e;
    cam.position.copy(a.lerp(b, e).normalize().multiplyScalar(r)); if (k >= 1) fly = null; }
  if (playing) {
    simAcc += dt * speed;
    if (MODE === 'sim' && S) { while (simAcc > 0.12) { simAcc -= 0.12; simHour(); if (!S || !playing) break; }
      if (S) { placeVortex(S.lat, S.lon, S.v * 1.944); hud(S.v * 1.944, BASIN.id, pFromV(S.v), T('الساعة ', 'Hour ') + S.age); if (S.age !== field.a) { field.a = S.age; field(S.lat, S.lon, S.v, pFromV(S.v)); } } }
    if (MODE === 'history' && H) { histTick(dt * speed * 9); }
  }
  vortex.material.uniforms.uT.value = tt * (1 + (vortex.material.uniforms.uI.value || 0) * 1.5);
  /* follow the storm gently unless the user is steering the camera */
  const focus = S ? [S.lat, S.lon] : (H && playing ? (() => { const s = interp(H, hT); return [s.lat, s.lon]; })() : null);
  if (focus && !fly && now - lastTouch > 3500) { const d = cam.position.length(), tgt = ll2v(focus[0], focus[1], 1).normalize(); const cur = cam.position.clone().normalize(); cam.position.copy(cur.lerp(tgt, Math.min(1, dt * 0.9)).normalize().multiplyScalar(d)); }
  ctl.update(); R.render(scene, cam);
}

/* ═════════ boot ═════════ */
(async () => {
  $('backT').textContent = T('نفاف', 'Nafaf'); $('lng').textContent = EN ? 'ع' : 'EN';
  const mb = document.querySelectorAll('#modes button'); mb[0].textContent = T('المحاكي', 'Sandbox'); mb[1].textContent = T('التاريخ', 'History'); mb[2].textContent = T('المتنبئ', 'Forecast'); mb[3].textContent = T('التحديات', 'Goals');
  $('layT').textContent = T('الطبقات', 'Layers'); $('lay').setAttribute('aria-label', T('طبقات الخريطة', 'Map layers'));
  layPane();
  $('modes').setAttribute('aria-label', T('الأوضاع', 'Modes')); $('drawer').setAttribute('aria-label', T('لوحة التحكم', 'Controls'));
  canvas.setAttribute('aria-label', T('الكرة الأرضية والإعصار', 'The globe and the cyclone'));
  $('credit').textContent = T('صور الأرض: NASA · المسارات: IBTrACS (NOAA NCEI) · البيئة الحية: Open-Meteo', 'Earth imagery: NASA · Tracks: IBTrACS (NOAA NCEI) · Live environment: Open-Meteo');
  $('boot').textContent = T('يجهّز الكوكب…', 'Preparing the planet…'); document.title = T('إعصار نفاف', 'Nafaf Cyclone');
  const q = HI ? '4k' : '2k';
  const [d, n] = await Promise.all([tex(`earth-day-${q}.jpg`), tex(`earth-night-${q}.jpg`)]);
  const mt = await new Promise(r => loader.load('earth-land-mask.png', t => r(t), undefined, () => r(null)));
  globeMat.uniforms.uDay.value = d; globeMat.uniforms.uNight.value = n; globeMat.uniforms.uMask.value = mt;
  try { const im = mt.image, c = document.createElement('canvas'); c.width = MW; c.height = MH; const x = c.getContext('2d'); x.drawImage(im, 0, 0, MW, MH); MASK = x.getImageData(0, 0, MW, MH).data; } catch (e) {}
  sunV.copy(sunDir(Date.now()));
  requestAnimationFrame(loop); $('boot').classList.add('done');
  /* "near you": storms that passed within 250 km of Oman's coast for players in Oman, within 400 km of the player elsewhere */
  const OM = [[17.02, 54.09], [19.66, 57.70], [20.67, 58.87], [22.53, 59.80], [23.59, 58.41], [24.36, 56.75], [26.18, 56.25], [16.7, 53.2]];
  const inOm = !ME || (ME[0] >= 16.4 && ME[0] <= 26.6 && ME[1] >= 51.8 && ME[1] <= 60);
  STORMS.forEach(s => { s.om = inOm ? s.p.some(q => OM.some(o => hav([q[1], q[2]], o) < 250)) : s.p.some(q => hav([q[1], q[2]], ME) < 400); });
  if (!inOm && !STORMS.some(s => s.om) && HF === 'om') HF = 'all';
  document.querySelectorAll('#modes button').forEach(b => { if (CYC.modes && CYC.modes[b.dataset.m] === false) b.hidden = true; });
  const okMode = m => m && !(CYC.modes && CYC.modes[m] === false) && $('modes').querySelector(`[data-m="${m}"]`);
  let m0 = CYC.mode; try { m0 = sessionStorage.getItem('nx.cy.mode') || CYC.mode; } catch (e) {} if (!okMode(m0)) m0 = ['sim', 'history', 'forecast', 'ach'].find(okMode) || 'sim'; setMode(m0);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(() => {});
})();

</script>
