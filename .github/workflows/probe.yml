name: Probe live endpoints (manual)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          cat > c.py <<'PY'
          import json,urllib.request,time
          UA={'User-Agent':'Nafaf/1.0 (+https://nafaf.online)'}
          def g(u):
              t=time.time();d=json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=180));return d,time.time()-t
          M=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC']
          out={}
          for nm,lat,lon in [('moscow',55.75,37.62),('muscat',23.59,58.41),('delhi',28.65,77.23),('london',51.51,-0.13),('riyadh',24.69,46.72)]:
              r={}
              try:
                  d,t=g(f'https://power.larc.nasa.gov/api/temporal/climatology/point?parameters=T2M,T2M_RANGE,T2M_MAX,T2M_MIN&community=RE&longitude={lon}&latitude={lat}&start=1991&end=2020&format=JSON')
                  p=d['properties']['parameter'];r['clim']={k:[p[k][m] for m in M] for k in p};r['clim_t']=t
              except Exception as e: r['clim_err']=str(e)
              try:
                  d,t=g(f'https://power.larc.nasa.gov/api/temporal/daily/point?parameters=T2M_MAX,T2M_MIN,PRECTOTCORR&community=RE&longitude={lon}&latitude={lat}&start=19910101&end=20201231&format=JSON')
                  p=d['properties']['parameter'];r['daily_t']=t
                  agg={}
                  for k,v in p.items():
                      s=[0]*12;n=[0]*12
                      for day,val in v.items():
                          if val is None or val<-900: continue
                          mi=int(day[4:6])-1;s[mi]+=val;n[mi]+=1
                      agg[k]=[round(s[i]/n[i],2) if n[i] else None for i in range(12)]
                  r['daily']=agg
              except Exception as e: r['daily_err']=str(e)[:300]
              out[nm]=r
          json.dump(out,open('check.json','w'),indent=0)
          PY
          python3 c.py
          git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@nafaf.online commit -qm probe
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-out
