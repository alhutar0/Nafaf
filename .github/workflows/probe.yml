name: Probe live endpoints (manual)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          for u in / /robots.txt /sitemap.xml /cities/ /ar/cities/ /city/muscat-om/ /ar/city/sohar-om/ /fr/city/paris-fr/ /ur/city/lahore-pk/ "/?lat=24.36&lon=56.73&n=x&utm_source=seo"; do
            curl -sS -o /dev/null -w "%{http_code} %{size_download} %{time_total}s $u\n" "https://nafaf.online$u" >> pages.txt
          done
          git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@nafaf.online commit -qm probe
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-out
