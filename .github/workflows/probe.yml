name: Probe live endpoints (manual)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          date -u > now.txt
          E="https://view.eumetsat.int/geoserver/ows?service=WMS&version=1.3.0"
          curl -sS -m 60 "$E&request=GetMap&layers=msg_iodc:h63&styles=&crs=EPSG:4326&bbox=21,54,27,60&width=600&height=600&format=image/png&transparent=true" -o h63.png
          curl -sS -m 60 "$E&request=GetMap&layers=msg_iodc:rgb_convection&styles=&crs=EPSG:4326&bbox=21,54,27,60&width=600&height=600&format=image/png" -o conv.png
          for p in "24.35,56.55" "24.35,56.70" "24.25,56.45" "24.50,56.40"; do
            la=${p%,*}; lo=${p#*,}
            curl -sS -m 60 "$E&request=GetFeatureInfo&layers=msg_iodc:h63&query_layers=msg_iodc:h63&styles=&crs=EPSG:4326&bbox=$(python3 -c "print(f'{$la-0.05},{$lo-0.05},{$la+0.05},{$lo+0.05}')")&width=11&height=11&i=5&j=5&info_format=application/json&format=image/png" -o "fi_$p.json"
          done
          curl -sS -m 60 "$E&request=GetCapabilities" | python3 -c "
          import sys,re;s=sys.stdin.read();i=s.find('<Name>msg_iodc:h63</Name>');print(s[i-200:i+2500])" > h63_caps.txt
          curl -sS -m 30 https://api.rainviewer.com/public/weather-maps.json -o rv.json
          python3 - <<'PY'
          import json,urllib.request,math
          rv=json.load(open('rv.json'));last=rv['radar']['past'][-1]['path'];h=rv['host']
          lat,lon=24.347,56.6
          for z in (7,8,9):
            n=2**z;x=int((lon+180)/360*n);y=int((1-math.log(math.tan(math.radians(lat))+1/math.cos(math.radians(lat)))/math.pi)/2*n)
            for cs in (0,1,2):
              u=f"{h}{last}/256/{z}/{x}/{y}/{cs}/0_0.png"
              try: d=urllib.request.urlopen(u,timeout=20).read();open(f'rv_z{z}_c{cs}.png','wb').write(d);print(z,cs,len(d))
              except Exception as e: print(z,cs,'ERR',e)
          PY
          git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@nafaf.online commit -qm probe
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-out
