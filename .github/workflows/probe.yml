name: Probe live endpoints (manual)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          W=https://nafa-push.alhutar0.workers.dev
          date -u > now.txt
          curl -sS -m 30 -X POST -H 'content-type: text/plain' -d '{"vid":"probe-test-1","tab":"now","lang":"en","dev":"d","st":0,"src":"probe","page":"app"}' $W/live/beat > beat1.json
          sleep 2
          curl -sS -m 30 -X POST -H 'content-type: text/plain' -d '{"vid":"probe-test-1","tab":"live"}' $W/live/beat > beat2.json
          curl -sS -m 30 -X POST -H 'content-type: text/plain' -d '{"vid":"probe-test-1"}' $W/live/bye > bye.txt
          curl -sS -m 30 -X POST -H 'content-type: text/plain' -d '{"vid":"probe-test-2","tab":"now"}' $W/live/beat > beat3.json
          curl -sS -m 30 -X POST -H 'content-type: text/plain' -d '{"vid":"probe-test-2"}' $W/live/bye >> bye.txt
          curl -sS -m 30 -X POST -H 'content-type: application/json' -d '{"pass":"wrong"}' $W/admin/live > admin_noauth.json
          git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@nafaf.online commit -qm probe
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-out
