name: Probe alert feeds (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          UA="Nafaf/1.0 (https://nafaf.online)"
          curl -sSL -A "$UA" -m 60 https://alert-hub-sources.s3.amazonaws.com/json -o registry.json || true
          curl -sSL -A "$UA" -m 30 "https://api.weather.gov/alerts/active?point=39.74,-104.99" -o nws_point.json || true
          curl -sSL -A "$UA" -m 30 "https://api.weather.gov/alerts/active?status=actual&limit=3" -o nws_any.json || true
          curl -sSL -A "$UA" -m 30 https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-germany -o ma_de.xml || true
          curl -sSL -A "$UA" -m 30 https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-france -o ma_fr.xml || true
          curl -sSL -A "$UA" -m 30 -I https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-france > ma_fr_headers.txt || true
          python3 - <<'PY'
          import json,urllib.request,re,os
          try: R=json.load(open('registry.json'))
          except Exception as e: print('no registry',e); R=None
          print(type(R), (list(R.keys())[:10] if isinstance(R,dict) else len(R)))
          srcs=R.get('sources',R) if isinstance(R,dict) else R
          json.dump(srcs[:3] if isinstance(srcs,list) else srcs,open('sample_records.json','w'),indent=1,ensure_ascii=False)
          def g(s,*k):
              for x in k:
                  if isinstance(s,dict) and x in s: s=s[x]
                  else: return None
              return s
          want=['om','ae','sa','qa','bh','kw','pk','in','bd','eg','jo','ma','de','fr','gb','ca','au','jp','br','id','ph','tr','ir','iq','ye','us','kr','th','my']
          os.makedirs('feeds',exist_ok=True)
          if isinstance(srcs,list):
            for s in srcs:
              sid=json.dumps(s)[:4000]
              src=s.get('source',s)
              iid=src.get('id') or src.get('sourceId') or ''
              if iid[:2] in want:
                url=src.get('capAlertFeed') or src.get('url') or ''
                open('feeds/index.txt','a').write(iid+' | '+str(src.get('name'))+' | '+str(url)+' | '+str(src.get('authorityCountry'))+' | '+str(src.get('license') or src.get('terms') or '')+'\n')
                if url:
                  try:
                    req=urllib.request.Request(url,headers={'User-Agent':'Nafaf/1.0 (https://nafaf.online)'})
                    d=urllib.request.urlopen(req,timeout=20).read()[:300000]
                    open('feeds/'+re.sub(r'[^a-z0-9-]','_',iid)+'.xml','wb').write(d)
                    m=re.search(rb'<link>([^<]+)</link>',d[d.find(b'<item'):] if b'<item' in d else d[d.find(b'<entry'):])
                    if m:
                      u=m.group(1).decode().strip()
                      d2=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Nafaf/1.0'}),timeout=20).read()[:200000]
                      open('feeds/'+re.sub(r'[^a-z0-9-]','_',iid)+'_cap1.xml','wb').write(d2)
                  except Exception as e:
                    open('feeds/index.txt','a').write('   ERR '+str(e)[:200]+'\n')
          PY
          ls -la . feeds | head -100
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: out
