name: Probe live endpoints (manual)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          curl -sS -m 30 https://www.rainviewer.com/files/rainviewer_api_colors_table.csv -o colors.csv
          curl -sS -m 30 https://api.rainviewer.com/public/weather-maps.json -o rv.json
          python3 - <<'PY'
          import json,urllib.request
          rv=json.load(open('rv.json'));h=rv['host']
          for i,f in enumerate(rv['radar']['past']):
              u=f"{h}{f['path']}/256/7/84/55/2/0_0.png"
              try: open(f"f{i:02d}_{f['time']}.png",'wb').write(urllib.request.urlopen(u,timeout=20).read())
              except Exception as e: print(e)
          PY
          git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@nafaf.online commit -qm probe
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-out
