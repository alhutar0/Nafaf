<style>
 *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
 html,body{width:100%;min-height:100%}
 body{font-family:"Segoe UI","Helvetica Neue",Tahoma,Arial,sans-serif;color:#fff;
 background:#12203c;background:linear-gradient(180deg,#0d1a33 0%,#16294a 45%,#26406b 100%);
 background-attachment:fixed;padding:12px 12px 26px;transition:background 2.2s cubic-bezier(.4,0,.2,1)}
 #skyScene{position:fixed;top:0;left:0;right:0;height:60%;z-index:0;pointer-events:none;overflow:hidden}
.wrap{position:relative;z-index:1;width:100%;max-width:430px;margin:0 auto}
 button{font-family:inherit;cursor:pointer}

.top{width:100%;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.brandbox{padding-top:2px;order:1;margin-inline-end:auto}
.gearbtn{order:3}
.authBadge{order:2}
.wm-en{font-size:21px;font-weight:800;letter-spacing:2px;vertical-align:middle}
.wm-sep{font-size:19px;color:rgba(255,255,255,.68);margin:0 7px;vertical-align:middle}
.wm-ar{font-size:23px;font-weight:800;vertical-align:middle}
.gearbtn{flex:0 0 auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
 border-radius:12px;width:38px;height:38px;color:#fff;font-size:17px;cursor:pointer}

.locbar{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
 border-radius:16px;padding:10px 12px;margin-bottom:11px}
.locbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.locname{font-size:16px;font-weight:800;min-width:0;flex:1 1 auto}
.locname small{display:block;font-weight:600;color:rgba(255,255,255,.78);font-size:11px}
.locbtns{flex:0 0 auto;white-space:nowrap}
.lbtn{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
 color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:7px 12px;margin-inline-start:6px}
.lbtn.gold{background:#e6b45e;color:#3a2405;border-color:#e6b45e}

.tabs{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px;font-size:0}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-block;font-size:13px;font-weight:700;color:rgba(255,255,255,.75);
 background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
 border-radius:99px;padding:8px 16px;margin-inline-end:6px}
.tab.on{background:#fff;color:#12203c;border-color:#fff}

 /* البطل */
.hero{text-align:center;padding:20px 12px 18px;border-radius:22px;
 min-height:290px;display:flex;flex-direction:column;justify-content:center;
 box-shadow:0 10px 32px rgba(0,0,0,.28)}
.hero .city{font-size:15px;font-weight:700;color:rgba(255,255,255,.82)}
.hero .city small{font-weight:600;color:rgba(255,255,255,.7);font-size:11px}
.hero .heroIcon svg{width:64px;height:64px;display:block;margin:4px auto 0}
 .hero .heroIconSmall{margin-top:2px}
 .hero .heroIconSmall svg{width:38px!important;height:38px!important;margin:2px auto 0!important}
.hero .big{font-size:96px;font-weight:200;line-height:1;letter-spacing:-5px;
 text-shadow:0 6px 26px rgba(0,0,0,.35)}
.hero .big sup{font-size:34px;font-weight:300;letter-spacing:0}
.hero .desc{font-size:15px;font-weight:700;color:rgba(255,255,255,.9);margin-top:2px}
.hero .hl{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.8);margin-top:3px}
.next{display:inline-block;margin-top:11px;background:rgba(255,255,255,.12);
 border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:8px 16px;
 font-size:12.5px;font-weight:700}
.next b{color:#ffd88a}

.strip6{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;font-size:0;padding:8px 0 10px}
.strip6::-webkit-scrollbar{display:none}
.h6{display:inline-block;text-align:center;width:60px;margin-inline-end:5px;
 background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:15px;padding:9px 0}
.h6 .hh{font-size:11px;font-weight:700;color:rgba(255,255,255,.78)}
.h6 svg{width:24px;height:24px;margin:4px auto;display:block}
.h6 .tt{font-size:14px;font-weight:800}
.h6 .pp{font-size:9.5px;font-weight:700;color:#9fd4f5}

.card{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);
 border-radius:20px;padding:13px 15px;margin-bottom:12px}
.stats{width:100%;font-size:0}
.stat{display:inline-block;width:19.2%;margin-inline-end:1%;text-align:center;
 background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 0}
.stat:last-child{margin-inline-end:0}
.stat .k{font-size:10.5px;color:rgba(255,255,255,.85);font-weight:700}
.stat .v{font-size:14px;font-weight:800;margin-top:3px}
.uvG{color:#7fe39a}.uvY{color:#ffdf6b}.uvO{color:#ffb45e}.uvR{color:#ff8a80}

.nlabel{display:inline-block;background:#e6b45e;color:#3a2405;font-size:13px;font-weight:800;
 padding:3px 16px;border-radius:99px;margin:0 6px -10px;position:relative;z-index:2}
.nafaf{background:#fff;color:#1b2c47;border-radius:18px;padding:18px 16px 15px;margin-bottom:11px}
.nafaf p{font-size:15px;line-height:1.85;font-weight:600}
.srcnote{font-size:10px;color:#8fa3b8;font-weight:700;margin-top:8px}

.askbox{width:100%;margin-bottom:11px}.askbox:after{content:"";display:table;clear:both}
.qin{float:right;width:73%;background:rgba(255,255,255,.95);border:0;border-radius:14px;color:#1b2c47;
 font-family:inherit;font-size:14px;font-weight:600;padding:13px 14px;outline:none}
.qin::placeholder{color:#93a6bb;font-weight:500}
.sendb{float:left;width:24%;border:0;background:#e6b45e;color:#3a2405;font-weight:800;font-size:14px;
 padding:13px 0;border-radius:14px}
.chips{font-size:0;margin-bottom:10px}
.chip{display:inline-block;font-size:12.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.1);
 border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:8px 13px;margin:0 0 7px 7px}
.ask-t{font-size:12px;font-weight:700;color:rgba(255,255,255,.7);margin:0 4px 8px}

.panel{display:none}.panel.on{display:block}
.sec-t{font-size:16px;font-weight:800;margin:4px 4px 2px}
.sec-s{font-size:11px;color:rgba(255,255,255,.78);font-weight:600;margin:0 4px 11px}

.row{position:relative;width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
 border-radius:18px;padding:14px 15px;margin-bottom:9px;overflow:hidden}
.row{display:flex;align-items:flex-start;gap:12px}
.row .ic{flex:0 0 44px;width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.1)}
.row .ic svg{width:24px;height:24px;display:block;margin:10px auto}
.row .tx{flex:1 1 auto;min-width:0}
.row .nm{font-size:14.5px;font-weight:800;line-height:1.4}
.row .sub{font-size:12px;font-weight:600;color:rgba(255,255,255,.8);line-height:1.55;margin-top:3px}
.row .bg{flex:0 0 auto;align-self:center;font-size:11px;font-weight:800;border-radius:99px;padding:5px 13px;border:1px solid;white-space:nowrap}
.bG{color:#7fe39a;background:rgba(127,227,154,.14);border-color:rgba(127,227,154,.45)}
.bO{color:#ffd166;background:rgba(255,209,102,.14);border-color:rgba(255,209,102,.45)}
.bB{color:#ff8f8f;background:rgba(255,143,143,.14);border-color:rgba(255,143,143,.45)}
.row .strip{position:absolute;top:0;bottom:0;inset-inline-start:0;width:4px}
.sG{background:#7fe39a}.sO{background:#ffd166}.sB{background:#ff8f8f}

.smart{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:18px;
 padding:14px 16px;margin-bottom:9px}
.smart .h{font-size:11.5px;font-weight:800;color:#e6b45e;margin-bottom:6px}
.smart .b{font-size:14px;line-height:1.75;font-weight:600}
.sk{background:rgba(255,255,255,.05);border-radius:18px;padding:16px;margin-bottom:9px;
 font-size:12px;color:rgba(255,255,255,.68);text-align:center}

 /* السلسلة */
.streak{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:18px;
 padding:13px 15px;margin-bottom:10px}
.streak{display:flex;align-items:flex-start;gap:12px}
.streak .num{flex:0 0 46px;width:46px;height:46px;border-radius:14px;background:rgba(230,180,94,.18);
 text-align:center;line-height:46px;font-size:19px;font-weight:800;color:#e6b45e}
.streak .tx{flex:1 1 auto;min-width:0}
.streak .t1{font-size:14px;font-weight:800}
.streak .t2{font-size:11.5px;color:rgba(255,255,255,.8);font-weight:500;line-height:1.5;margin-top:2px}

 /* القصة */
.story{border-radius:18px;padding:15px 16px;margin-bottom:9px;
 background:linear-gradient(135deg,rgba(230,180,94,.16),rgba(255,255,255,.05));
 border:1px solid rgba(230,180,94,.3)}
.story .h{font-size:11.5px;font-weight:800;color:#e6b45e;margin-bottom:7px}
.story .t{font-size:15px;font-weight:800;margin-bottom:5px}
.story .b{font-size:13.5px;line-height:1.8;font-weight:500;color:rgba(255,255,255,.85)}

 /* الأرقام القياسية */
.recs{font-size:0}
.rec{display:inline-block;width:49%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
 border-radius:14px;padding:11px 10px;margin:0 0 7px 2%;vertical-align:top}
.rec:nth-child(2n){margin-inline-start:0}
.rec .k{font-size:10.5px;color:rgba(255,255,255,.78);font-weight:700}
.rec .v{font-size:19px;font-weight:800;margin-top:2px}
.rec .d{font-size:9.5px;color:rgba(255,255,255,.68);font-weight:600;margin-top:1px}

.mrow{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
 border-radius:14px;padding:11px 14px;margin-bottom:7px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mrow .mn{font-size:13px;font-weight:800;min-width:0}
.mrow .mn small{display:block;font-size:10px;font-weight:600;color:rgba(255,255,255,.74)}
.mrow .mv{font-size:17px;font-weight:800;direction:ltr;white-space:nowrap}
.mrow .mv small{font-size:11px;color:rgba(255,255,255,.78);font-weight:700}

.hlist{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;font-size:0;padding-bottom:4px}
.hlist::-webkit-scrollbar{display:none}
.hitem{display:inline-block;text-align:center;background:rgba(255,255,255,.07);
 border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 0;width:66px;margin-inline-end:6px}
.hitem .h{font-size:11px;font-weight:700;color:rgba(255,255,255,.78)}
.hitem svg{width:26px;height:26px;margin:5px auto;display:block}
.hitem .t{font-size:14px;font-weight:800}
.hitem .p{font-size:10px;font-weight:700;color:#9fd4f5;margin-top:1px}
.drow{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
 border-radius:14px;padding:10px 13px;margin-bottom:7px}
.drow:after{content:"";display:table;clear:both}
.drow .d{float:right;font-size:13px;font-weight:800;width:34%}
.drow .dc{float:right;width:30%;text-align:center}
.drow .dc svg{width:24px;height:24px;vertical-align:middle}
.drow .dt{float:left;font-size:13px;font-weight:800;direction:ltr}
.drow .dt small{color:rgba(255,255,255,.74)}
.big2{width:100%;font-size:0}
.b2{display:inline-block;width:49%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
 border-radius:16px;padding:14px 8px;text-align:center;vertical-align:top}
.b2:first-child{margin-inline-end:2%}
.b2 .k{font-size:11px;font-weight:700;color:rgba(255,255,255,.78)}
.b2 .v{font-size:25px;font-weight:800;margin-top:4px}
.b2 .u{font-size:11px;font-weight:700;color:rgba(255,255,255,.7)}
.note{font-size:11.5px;color:rgba(255,255,255,.8);font-weight:600;margin-top:8px;line-height:1.6}

.foot{text-align:center;font-size:10.5px;color:rgba(255,255,255,.66);line-height:1.9;margin-top:16px;font-weight:600}
.loading{text-align:center;padding:34px 10px;color:rgba(255,255,255,.74);font-size:13px;font-weight:600}

.ov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(8,14,26,.75);z-index:50}
.ov.on{display:block}
.modal{position:absolute;left:5%;right:5%;top:7%;background:#fff;color:#1b2c47;border-radius:20px;
 padding:18px 16px;max-height:84%;overflow-y:auto}
.m-t{font-size:16px;font-weight:800;margin-bottom:12px}
.m-x{position:absolute;top:12px;left:14px;background:none;border:0;font-size:20px;color:#93a6bb}
.m-sec{font-size:12.5px;font-weight:800;color:#1b2c47;margin:16px 0 4px}
.m-hint{font-size:11px;color:#93a6bb;font-weight:600;margin-bottom:8px;line-height:1.5}
.opt{display:inline-block;font-size:13px;font-weight:700;color:#1b2c47;background:#eef3f8;
 border:1px solid #d8e2ec;border-radius:99px;padding:8px 15px;margin:0 0 7px 7px}
.opt.on{background:#e6b45e;border-color:#e6b45e;color:#3a2405}
.min{width:100%;background:#eef3f8;border:1px solid #d8e2ec;border-radius:12px;color:#1b2c47;
 font-family:inherit;font-size:14px;font-weight:600;padding:12px 13px;outline:none;margin-bottom:9px}
.sres{display:block;width:100%;text-align:start;background:#fff;border:0;border-bottom:1px solid #eaf0f6;
 font-size:14px;font-weight:700;color:#1b2c47;padding:11px 6px}
.sres small{display:block;font-size:11px;font-weight:600;color:#93a6bb}
.cityopt{display:inline-block;width:48%;font-size:13px;font-weight:700;text-align:center;color:#1b2c47;
 background:#eef3f8;border:1px solid #d8e2ec;border-radius:12px;padding:11px 0;margin:0 0 7px 2%}
.cityopt:nth-child(2n){margin-inline-start:0}
.ordrow{background:#eef3f8;border:1px solid #d8e2ec;border-radius:12px;padding:10px 12px;margin-bottom:6px}
.ordrow:after{content:"";display:table;clear:both}
.ordrow .on2{float:right;font-size:13px;font-weight:700;padding-top:4px}
.ordbtn{float:left;background:#fff;border:1px solid #d8e2ec;border-radius:8px;width:30px;height:28px;
 margin-inline-start:5px;font-size:14px;color:#1b2c47}
.danger{width:100%;background:#fff;border:1px solid #f3c9c9;color:#c94040;border-radius:12px;
 padding:12px;font-weight:700;font-size:13px;margin-top:14px}

 /* مشاهد */
.s-sun{position:absolute;top:-24px;left:-24px;width:104px;height:104px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,215,120,.55) 0%,rgba(255,196,74,.22) 48%,rgba(255,210,74,0) 72%)}
.anim .s-sun{animation:sunp 5s ease-in-out infinite}
 @keyframes sunp{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.1);opacity:1}}
.s-moon{position:absolute;top:-14px;left:-10px;width:76px;height:76px;border-radius:50%;
 background:radial-gradient(circle,rgba(200,220,255,.4) 0%,rgba(160,190,255,.14) 55%,rgba(0,0,0,0) 75%)}
.s-star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.6}
.anim .s-star{animation:tw 3s infinite}
 @keyframes tw{0%,100%{opacity:.25}50%{opacity:.95}}
.s-cl{position:absolute;background:rgba(255,255,255,.5);border-radius:99px}
.anim .s-cl{animation:cdr linear infinite}
.s-cl:before,.s-cl:after{content:"";position:absolute;background:inherit;border-radius:50%}
.c1{top:14px;width:72px;height:21px;animation-duration:30s}
.c1:before{width:29px;height:29px;top:-14px;left:12px}.c1:after{width:23px;height:23px;top:-10px;left:35px}
.c2{top:58px;width:54px;height:16px;animation-duration:42s;animation-delay:-18s;opacity:.6}
.c2:before{width:23px;height:23px;top:-11px;left:9px}.c2:after{width:18px;height:18px;top:-8px;left:27px}
.c3{top:34px;width:88px;height:25px;opacity:.42;filter:blur(1px)}
.c3:before{width:36px;height:36px;top:-17px;left:16px}.c3:after{width:28px;height:28px;top:-12px;left:46px}
 @keyframes cdr{from{transform:translateX(-160px)}to{transform:translateX(520px)}}
 @keyframes cdrRev{from{transform:translateX(520px)}to{transform:translateX(-160px)}}
.anim .s-cl.reverse{animation-name:cdrRev}
.s-drop{position:absolute;top:-25%;width:2px;height:20px;border-radius:99px;opacity:0;
 background:linear-gradient(to bottom,rgba(190,225,255,0),rgba(200,232,255,.95) 45%,rgba(190,225,255,.35))}
 .anim .s-drop{opacity:1;animation:rf linear infinite}
 @keyframes rf{0%{transform:translateY(0)}100%{transform:translateY(125vh)}}
 /* وقع القطرة على الأرض */
 .s-splash{position:absolute;bottom:0;width:14px;height:5px;border-radius:50%;
 border:1.4px solid rgba(200,232,255,.75);border-top-color:transparent;opacity:0;
 transform-origin:center bottom}
 .anim .s-splash{animation:splash ease-out infinite}
 @keyframes splash{
 0%{opacity:0;width:2px;height:1px;transform:translateY(2px)}
 22%{opacity:.9;width:9px;height:4px;transform:translateY(0)}
 100%{opacity:0;width:26px;height:9px;transform:translateY(-3px)}}
 /* ضباب رذاذي عند الغزارة */
 .s-mist{position:absolute;left:0;right:0;bottom:0;height:30%;pointer-events:none;
 background:linear-gradient(to top,rgba(190,225,255,.16),rgba(190,225,255,0))}

 /* سماء الليلة */
.astro{background:linear-gradient(140deg,rgba(124,140,220,.18),rgba(255,255,255,.04));
 border:1px solid rgba(150,165,235,.34);border-radius:18px;padding:15px 16px;margin-bottom:10px}
.as-h{font-size:11px;font-weight:800;color:#b9c4f5;margin-bottom:8px;letter-spacing:.02em}
.as-r{float:left;font-size:9.5px;font-weight:700;color:#e6b45e;background:rgba(230,180,94,.14);
 border:1px solid rgba(230,180,94,.35);border-radius:99px;padding:2px 9px}
.as-t{font-size:16px;font-weight:800;margin-bottom:6px;line-height:1.4;clear:both}
.as-b{font-size:13.5px;line-height:1.85;font-weight:600;color:rgba(255,255,255,.9)}
 /* السماء الآن — البثّ المباشر */
.feed{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
 border-radius:18px;padding:12px 14px 8px;margin-bottom:11px}
.fd-h{font-size:11px;font-weight:800;color:#9fd4f5;margin-bottom:9px;letter-spacing:.03em}
.fd-loc{margin-inline-start:auto;font-size:9.5px;font-weight:700;color:rgba(255,255,255,.5);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.fd-h{display:flex;align-items:center}
.fd-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7fe39a;
 margin-inline-end:7px;vertical-align:middle}
.anim .fd-dot{animation:fdPulse 2s ease-in-out infinite}
 @keyframes fdPulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(127,227,154,.55)}
 70%{opacity:.75;box-shadow:0 0 0 7px rgba(127,227,154,0)}}
.fd-row{display:flex;align-items:flex-start;gap:9px;padding:6px 0;
 border-top:1px solid rgba(255,255,255,.07)}
.fd-row:first-of-type{border-top:0;padding-top:0}
.fd-row.fresh.fd-tx{color:#fff}
.anim .fd-row.fresh{animation:fdIn .5s cubic-bezier(.2,.9,.3,1)}
 @keyframes fdIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.fd-ic{flex:0 0 18px;font-size:13px;color:#e6b45e;text-align:center;line-height:1.5}
.fd-tx{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:600;line-height:1.65;
 color:rgba(255,255,255,.88)}
.fd-ago{flex:0 0 auto;font-size:9.5px;font-weight:700;color:rgba(255,255,255,.45);
 padding-top:2px;white-space:nowrap}
 /* مرصد الأمطار */
.watch{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
 border-radius:16px;padding:9px 12px 8px;margin-bottom:9px}
.watch.on{background:linear-gradient(140deg,rgba(90,168,224,.18),rgba(255,255,255,.04));
 border-color:rgba(90,168,224,.4)}
.watch.quiet{background:rgba(255,255,255,.05)}
.watch.quiet.wt-h{color:rgba(255,255,255,.72)}
.watch.quiet.wt-cnt{background:rgba(255,255,255,.18);color:rgba(255,255,255,.9)}
.wt-clear{font-size:12.5px;font-weight:600;line-height:1.7;color:rgba(255,255,255,.82);
 padding-bottom:4px}
.wt-h{font-size:10.5px;font-weight:800;color:#9fd4f5;margin-bottom:6px;
 display:flex;align-items:center;gap:6px}
.wt-live{width:7px;height:7px;border-radius:50%;background:#5aa8e0;flex:0 0 auto}
.anim .wt-live{animation:fdPulse 2s ease-in-out infinite}
.wt-cnt{margin-inline-start:auto;font-size:10px;font-weight:800;color:#12203c;
 background:#9fd4f5;border-radius:99px;padding:1px 8px}
.wt-row{display:flex;align-items:center;justify-content:space-between;gap:8px;
 padding:4px 0;border-top:1px solid rgba(255,255,255,.06)}
.wt-row:first-of-type{border-top:0}
.wt-nm{font-size:12px;font-weight:800;min-width:0;line-height:1.3}
.wt-nm small{display:block;font-size:9px;font-weight:600;color:rgba(255,255,255,.55)}
.wt-v{font-size:13.5px;font-weight:800;color:#bfe0f8;white-space:nowrap}
.wt-v small{font-size:9.5px;font-weight:700;opacity:.7}
.wt-agree{display:inline-block;font-size:9px;font-weight:800;color:#ffd166;
 background:rgba(255,209,102,.16);border-radius:99px;padding:1px 6px;margin-inline-start:5px;opacity:1}
.wt-more{text-align:center;font-size:10px;font-weight:700;color:rgba(255,255,255,.55);
 padding:5px 0 1px;cursor:pointer;border-top:1px solid rgba(255,255,255,.06);margin-top:3px}
.wt-empty{font-size:11px;font-weight:600;color:rgba(255,255,255,.72);line-height:1.6;padding:1px 0 3px}
.wt-sub{font-size:9.5px;font-weight:800;color:rgba(255,255,255,.55);margin:6px 0 1px;
 padding-top:6px;border-top:1px solid rgba(255,255,255,.07)}
.wt-src{font-size:8.5px;color:rgba(255,255,255,.42);font-weight:600;line-height:1.5;
 margin-top:6px;padding-top:5px;border-top:1px solid rgba(255,255,255,.07)}
 /* مؤشر الشذوذ الرسمي */
.anom{background:linear-gradient(140deg,rgba(255,255,255,.1),rgba(255,255,255,.04));
 border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px 16px;margin-bottom:11px}
.an-h{font-size:11px;font-weight:800;color:rgba(255,255,255,.7);margin-bottom:8px;
 display:flex;align-items:center;gap:8px}
.an-badge{margin-inline-start:auto;font-size:14px;font-weight:800;border:1px solid;
 border-radius:99px;padding:3px 12px;white-space:nowrap}
.an-t{font-size:15.5px;font-weight:800;margin-bottom:6px;line-height:1.4}
.an-b{font-size:13px;line-height:1.8;font-weight:600;color:rgba(255,255,255,.88)}
.an-s{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.5);line-height:1.6;
 margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1)}
.nafToast{position:fixed;left:14px;right:14px;bottom:88px;z-index:70;
 background:rgba(18,32,60,.97);color:#fff;border:1px solid rgba(255,255,255,.2);
 border-radius:16px;padding:13px 16px;font-size:13px;font-weight:700;line-height:1.7;
 text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.45);
 opacity:0;transform:translateY(14px);pointer-events:none;
 transition:opacity .28s,transform .28s}
.nafToast.on{opacity:1;transform:translateY(0)}
.nafToast.err{border-color:rgba(255,143,143,.5);background:rgba(60,22,28,.97)}
 /* ===== الأخبار العاجلة — بطاقة بهوية نفاف ===== */
 .newsCard{position:relative;border-radius:20px;padding:15px 17px 14px;margin-bottom:12px;
 border:1px solid;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.22)}
 .newsCard:before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:0;width:4px}
 .nk-urgent{background:linear-gradient(135deg,rgba(220,90,90,.26),rgba(255,255,255,.05));
 border-color:rgba(255,143,143,.5)}
 .nk-urgent:before{background:#ff6b6b}
 .nk-alert{background:linear-gradient(135deg,rgba(255,209,102,.24),rgba(255,255,255,.05));
 border-color:rgba(255,209,102,.5)}
 .nk-alert:before{background:#ffd166}
 .nk-info{background:linear-gradient(135deg,rgba(159,212,245,.24),rgba(255,255,255,.05));
 border-color:rgba(159,212,245,.5)}
 .nk-info:before{background:#9fd4f5}
 .nk-good{background:linear-gradient(135deg,rgba(127,227,154,.24),rgba(255,255,255,.05));
 border-color:rgba(127,227,154,.5)}
 .nk-good:before{background:#7fe39a}
 .nc-t{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;
 letter-spacing:.05em;padding:4px 11px;border-radius:99px;margin-bottom:9px;
 background:rgba(0,0,0,.28)}
 .nk-urgent .nc-t{color:#ffb3b3}
 .nk-alert .nc-t{color:#ffd166}
 .nk-info .nc-t{color:#bfe0f8}
 .nk-good .nc-t{color:#9fe9b8}
 .nc-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
 .anim .nk-urgent .nc-dot{animation:ncPulse 1.3s ease-in-out infinite}
 @keyframes ncPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
 .nc-h{font-size:16px;font-weight:800;line-height:1.55;color:#fff}
 .nc-b{font-size:13px;font-weight:600;line-height:1.85;color:rgba(255,255,255,.88);
 margin-top:7px;padding-top:9px;border-top:1px solid rgba(255,255,255,.14)}
 /* ===== البطاقة الدوّارة ===== */
 .rotator{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
 border-radius:20px;padding:15px 17px 12px;margin-bottom:12px;cursor:pointer;
 transition:opacity .26s ease;min-height:118px;position:relative}
 .rt-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
 .rt-t{font-size:11.5px;font-weight:800;letter-spacing:.02em}
 .rt-badge{margin-inline-start:auto;font-size:12px;font-weight:800;
 border:1px solid;border-radius:99px;padding:3px 11px;white-space:nowrap}
 .rt-lead{font-size:15px;font-weight:800;margin-bottom:7px;line-height:1.5;color:#fff}
 .rt-b{font-size:13.5px;font-weight:600;line-height:1.85;color:rgba(255,255,255,.92)}
 .rt-b b{color:#fff;font-weight:800}
 .rt-s{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.5);line-height:1.6;
 margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1)}
 .rt-dots{display:flex;justify-content:center;gap:5px;margin-top:11px}
 .rt-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.22);
 transition:background .3s,width .3s}
 .rt-dot.on{background:#e6b45e;width:16px;border-radius:99px}
 /* أرشيف الزلازل */
 .qk{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
 border-radius:16px;padding:12px 14px;margin-bottom:9px}
 .qk-row{display:flex;align-items:flex-start;gap:12px}
 .qk-mag{flex:0 0 46px;width:46px;height:46px;border-radius:14px;border:1.5px solid;
 display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
 .qk-tx{flex:1 1 auto;min-width:0}
 .qk-p{font-size:13px;font-weight:700;line-height:1.5;color:#fff}
 .qk-m{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.6);margin-top:3px;line-height:1.6}
 .qk-felt{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.7);
 margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08);line-height:1.65}
 .qk-empty{font-size:13px;font-weight:600;color:rgba(255,255,255,.75);line-height:1.8;text-align:center;padding:8px 0}
 .qk-foot{background:rgba(255,209,102,.09);border:1px solid rgba(255,209,102,.28);
 border-radius:14px;padding:12px 14px;margin-top:12px;font-size:11px;font-weight:600;
 color:rgba(255,255,255,.75);line-height:1.85}
 .qk-foot b{color:#ffd166}
 .qk-foot a{color:#9fd4f5}
 /* ===== البطاقات الحيّة في «يومك» ===== */
 .smartV{display:flex;align-items:flex-start;gap:13px;
 background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
 border-radius:18px;padding:14px 15px;margin-bottom:9px}
 .sv-ic{flex:0 0 auto;display:flex;align-items:center;justify-content:center}
 .sv-tx{flex:1 1 auto;min-width:0}
 .sv-h{font-size:11.5px;font-weight:800;color:#e6b45e;margin-bottom:5px}
 .sv-b{font-size:13.5px;line-height:1.8;font-weight:600;color:rgba(255,255,255,.92)}
 .sv-b b{color:#fff;font-weight:800}
 .sv-s{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.5);margin-top:7px;
 padding-top:7px;border-top:1px solid rgba(255,255,255,.1);line-height:1.6}
 .mv{display:block}
 .anim .mv .tw{animation:svTwinkle 2.6s ease-in-out infinite}
 @keyframes svTwinkle{0%,100%{opacity:.3}50%{opacity:1}}
 /* ظهور متدرّج عند التمرير */
 .smartV,.yearmap,.story,.astro,.onday,.anom{transition:transform .3s,opacity .3s}
 .astro.hasMoon{display:flex;align-items:flex-start;gap:14px}
 .as-moon{flex:0 0 auto;padding-top:2px}
 .as-body{flex:1 1 auto;min-width:0}
 /* ===== يومك: دوائر مدمجة ===== */
 .actGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;margin:6px 0 4px}
 .actBtn{position:relative;text-align:center;cursor:pointer;
 -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
 .actRing{position:relative;width:56px;height:56px;margin:0 auto;border-radius:50%;
 border:2.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);
 display:flex;align-items:center;justify-content:center;overflow:hidden;
 transition:transform .3s cubic-bezier(.34,1.5,.5,1),box-shadow .3s,background .3s}
 .actRing svg{width:24px;height:24px;position:relative;z-index:2}
 .actBtn:active .actRing{transform:scale(.9)}
 .actBtn.sel .actRing{transform:scale(1.12)}
 .actLbl{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.72);margin-top:5px;
 line-height:1.3;min-height:24px;padding:0 1px}
 .actBtn.sel .actLbl{color:#fff;font-weight:800}
 .rG{border-color:rgba(127,227,154,.75)}
 .rO{border-color:rgba(255,209,102,.75)}
 .rB{border-color:rgba(255,143,143,.7)}
 .actBtn.sel .rG{background:rgba(127,227,154,.22);box-shadow:0 0 0 4px rgba(127,227,154,.14)}
 .actBtn.sel .rO{background:rgba(255,209,102,.22);box-shadow:0 0 0 4px rgba(255,209,102,.14)}
 .actBtn.sel .rB{background:rgba(255,143,143,.2);box-shadow:0 0 0 4px rgba(255,143,143,.13)}
 .actDot{position:absolute;top:-1px;inset-inline-end:-1px;width:12px;height:12px;border-radius:50%;
 border:2px solid #12203c;z-index:3}
 .dG{background:#7fe39a}.dO{background:#ffd166}.dB{background:#ff8f8f}
 .actSeen{position:absolute;bottom:-2px;inset-inline-start:2px;width:5px;height:5px;
 border-radius:50%;background:rgba(255,255,255,.45);z-index:3}
 .actRip{position:absolute;top:50%;left:50%;width:8px;height:8px;margin:-4px 0 0 -4px;
 border-radius:50%;background:rgba(255,255,255,.5);pointer-events:none;z-index:1;
 animation:actRipple .55s ease-out forwards}
 @keyframes actRipple{to{width:72px;height:72px;margin:-36px 0 0 -36px;opacity:0}}
 .noanim .actRip{display:none}
 .actPanel{background:#fff;color:#1b2c47;border-radius:18px;padding:14px 16px;margin:6px 0 12px;
 min-height:70px;position:relative;overflow:hidden}
 .actPanel:before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:0;width:5px}
 .apG:before{background:#3fb968}.apO:before{background:#e0a52c}.apB:before{background:#dc5a5a}
 .ap-top{display:flex;align-items:center;gap:9px;margin-bottom:6px}
 .ap-ic{width:30px;height:30px;flex:0 0 30px;border-radius:10px;background:#eef3f8;
 display:flex;align-items:center;justify-content:center}
 .ap-ic svg{width:17px;height:17px;stroke:#1b2c47}
 .ap-nm{font-size:14.5px;font-weight:800;flex:1 1 auto;min-width:0}
 .ap-vd{font-size:10.5px;font-weight:800;border-radius:99px;padding:3px 11px;flex:0 0 auto}
 .vG{background:rgba(63,185,104,.16);color:#2b8f4c}
 .vO{background:rgba(224,165,44,.18);color:#9c7112}
 .vB{background:rgba(220,90,90,.16);color:#b03e3e}
 .ap-tx{font-size:13.5px;font-weight:600;line-height:1.75;color:#33445c}
 .ap-hint{font-size:11.5px;font-weight:600;color:#8fa3b8;line-height:1.7}
 .anim .actPanel{animation:apIn .34s cubic-bezier(.2,.9,.3,1)}
 @keyframes apIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
 .actProg{display:flex;align-items:center;gap:8px;margin:2px 4px 10px}
 .apBar{flex:1 1 auto;height:3px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
 .apFill{height:100%;background:linear-gradient(90deg,#e6b45e,#7fe39a);border-radius:99px;
 transition:width .5s cubic-bezier(.2,.9,.3,1)}
 .apTxt{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.55);white-space:nowrap}
 /* ═══════ شاشة الافتتاح ═══════ */
 .splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 background:linear-gradient(180deg,#0a1526 0%,#101f3a 45%,#16294a 100%);
 transition:opacity .55s ease,visibility .55s}
 .splash.gone{opacity:0;visibility:hidden;pointer-events:none}

 .sp-stage{position:relative;width:190px;height:150px;margin-bottom:6px}

 /* القطرة تسقط من الأعلى */
 .sp-drop{position:absolute;left:50%;top:-14px;width:11px;height:15px;margin-left:-5.5px;
 border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
 background:linear-gradient(to bottom,rgba(210,238,255,.98),rgba(150,205,245,.92));
 box-shadow:0 0 14px rgba(170,215,255,.7);
 transform:scaleY(1.5);opacity:0}
 .anim .sp-drop{animation:spFall 1.05s cubic-bezier(.55,.06,.68,.19) forwards}
 @keyframes spFall{
 0%{opacity:0;top:-14px;transform:scaleY(1.1)}
 12%{opacity:1}
 78%{opacity:1;top:104px;transform:scaleY(2.1)}
 92%{opacity:1;top:118px;transform:scaleY(.55) scaleX(1.5)}
 100%{opacity:0;top:120px;transform:scaleY(.25) scaleX(1.9)}}

 /* سطح الماء */
 .sp-surface{position:absolute;left:50%;top:120px;width:150px;height:3px;margin-left:-75px;
 border-radius:99px;opacity:0;
 background:linear-gradient(90deg,rgba(150,205,245,0),rgba(180,220,255,.55),rgba(150,205,245,0))}
 .anim .sp-surface{animation:spSurf 2.4s ease-out .95s forwards}
 @keyframes spSurf{0%{opacity:0;width:20px;margin-left:-10px}
 30%{opacity:1;width:170px;margin-left:-85px}
 100%{opacity:.35;width:190px;margin-left:-95px}}

 /* التموجات المائية */
 .sp-ring{position:absolute;left:50%;top:120px;width:14px;height:5px;margin:-2.5px 0 0 -7px;
 border:1.6px solid rgba(185,225,255,.85);border-radius:50%;opacity:0}
 .anim .r1{animation:spRing 1.9s cubic-bezier(.15,.7,.35,1) 1.0s forwards}
 .anim .r2{animation:spRing 2.1s cubic-bezier(.15,.7,.35,1) 1.16s forwards}
 .anim .r3{animation:spRing 2.3s cubic-bezier(.15,.7,.35,1) 1.34s forwards}
 @keyframes spRing{
 0%{opacity:0;width:14px;height:5px;margin:-2.5px 0 0 -7px;border-width:2px}
 14%{opacity:.95}
 100%{opacity:0;width:196px;height:62px;margin:-31px 0 0 -98px;border-width:.6px}}

 /* الاسم */
 .sp-word{text-align:center;opacity:0}
 .anim .sp-word{animation:spWord .85s cubic-bezier(.2,.9,.3,1) 1.42s forwards}
 @keyframes spWord{from{opacity:0;transform:translateY(14px) scale(.94)}
 to{opacity:1;transform:none}}
 .sp-en{display:block;font-size:40px;font-weight:800;letter-spacing:9px;
 color:#fff;text-shadow:0 4px 26px rgba(150,205,245,.45)}
 .sp-ar{display:block;font-size:25px;font-weight:800;color:#e6b45e;
 margin-top:2px;letter-spacing:2px}

 .sp-tag{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.5);
 margin-top:14px;opacity:0;letter-spacing:.5px}
 .anim .sp-tag{animation:spTag .8s ease 2.0s forwards}
 @keyframes spTag{to{opacity:1}}

 /* بلا حركة: يظهر كل شيء فورًا */
 .noanim .sp-drop,.noanim .sp-ring,.noanim .sp-surface{display:none}
 .noanim .sp-word,.noanim .sp-tag{opacity:1;animation:none}
 /* رصدات المجتمع */
 .cfeed{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12)}
 .cf-sec{font-size:10.5px;font-weight:800;color:#e6b45e;margin:10px 0 6px;letter-spacing:.02em}
 .cf-sec:first-child{margin-top:0}
 .cf-row{display:flex;align-items:center;gap:9px;padding:7px 10px;margin-bottom:5px;
 background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px}
 .cf-row.corr{border-color:rgba(230,180,94,.35);background:rgba(230,180,94,.08)}
 .cf-k{flex:0 0 auto;font-size:11.5px;font-weight:800;color:#9fd4f5;
 background:rgba(159,212,245,.14);border-radius:99px;padding:3px 10px}
 .cf-row.corr .cf-k{color:#e6b45e;background:rgba(230,180,94,.16)}
 .cf-w{flex:1 1 auto;min-width:0;font-size:12px;font-weight:700;color:rgba(255,255,255,.88)}
 .cf-t{flex:0 0 auto;font-size:9.5px;font-weight:600;color:rgba(255,255,255,.5)}
 /* ★ أيقونة الدخول/الخروج وختم المراسل */
 .authBadgeOLD{display:none}

  /* ★ القرية التفاعلية */
  .vlgWrap{position:absolute;left:0;right:0;bottom:0;height:46vh;max-height:340px;
    pointer-events:none;opacity:.92}
  .vlg{width:100%;height:100%;display:block}
  .anim .vpalm{animation:vpSway ease-in-out infinite alternate;transform-box:fill-box}
  @keyframes vpSway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.6deg)}}
  .anim .vwin{animation:vwFlicker 5s ease-in-out infinite}
  @keyframes vwFlicker{0%,100%{opacity:1}45%{opacity:.82}70%{opacity:.95}}
  .anim .vsmoke{animation:vsRise 4.5s ease-out infinite;opacity:0}
  @keyframes vsRise{0%{opacity:0;transform:translateY(0) scale(.6)}
    25%{opacity:.55}100%{opacity:0;transform:translateY(-26px) scale(1.8)}}
  .anim .vflow{animation:vfFlow 2.2s linear infinite}
  @keyframes vfFlow{to{stroke-dashoffset:-36}}
  .anim .vperson{animation:vpWalk 9s ease-in-out infinite alternate}
  @keyframes vpWalk{from{transform:translateX(-26px)}to{transform:translateX(30px)}}
  .anim .vlantern{animation:vlSwing ease-in-out infinite alternate;transform-origin:88px 120px}
  @keyframes vlSwing{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
  .noanim .vpalm,.noanim .vwin,.noanim .vsmoke,.noanim .vflow,
  .noanim .vperson,.noanim .vlantern{animation:none}
  /* ★ نافذة القرية — تصميم مستقبلي بإطار زجاجي */
  .hero{position:relative;padding:0!important;background:transparent!important;
    border:0!important;overflow:visible}
  .vlgBox{position:relative;width:100%;border-radius:24px;overflow:hidden;
    aspect-ratio:16/13;
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 14px 44px rgba(0,0,0,.42),
      inset 0 1px 0 rgba(255,255,255,.14),
      0 0 0 1px rgba(255,255,255,.05)}
  .vlgImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .anim .vlgImg{animation:vlgIn 1s ease,vlgDrift 40s ease-in-out infinite alternate 1s}
  @keyframes vlgIn{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:scale(1.04)}}
  @keyframes vlgDrift{from{transform:scale(1.04) translate(0,0)}
    to{transform:scale(1.1) translate(-1.6%,-1.2%)}}
  /* تدرّج يضمن قراءة النص */
  .vlgFade{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(8,14,28,.52) 0%,rgba(8,14,28,.12) 38%,
      rgba(8,14,28,.34) 62%,rgba(8,14,28,.86) 100%)}
  /* ★ لمعة زجاجية علوية — إحساس النافذة */
  .vlgBox:after{content:"";position:absolute;left:0;right:0;top:0;height:38%;
    pointer-events:none;z-index:3;
    background:linear-gradient(180deg,rgba(255,255,255,.09),transparent)}

/* ============ السلسلة والأرقام ============ */
function dayKey(d){var x=d||new Date();return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();}

/* ============================================================
 خريطة السنة — سجل الأيام التي فُتح فيها التطبيق
 يُخزَّن كسلسلة أرقام أيام السنة (1-366) مفصولة بفاصلة
 مثال: "2026:5,6,7,12" أي أيام السنة الخامس والسادس...
 ============================================================ */
function dayOfYear(d){
 var x=d||new Date();
 var start=new Date(x.getFullYear(),0,0);
 return Math.floor((x-start)/86400000);
}
function yearMapLoad(){
 var raw=stGet('yearmap')||'';
 var yr=new Date().getFullYear();
 if(raw.indexOf(yr+':')!==0)return {year:yr,days:{}};
 var out={year:yr,days:{}};
 var list=raw.slice(String(yr).length+1).split(',');
 for(var i=0;i<list.length;i++){
 var n=parseInt(list[i],10);
 if(n>0)out.days[n]=1;
 }
 return out;
}
function yearMapMark(){
 var m=yearMapLoad();
 var d=dayOfYear();
 if(m.days[d])return m; /* مسجّل اليوم بالفعل */
 m.days[d]=1;
 var keys=Object.keys(m.days).map(Number).sort(function(a,b){return a-b;});
 stSet('yearmap',m.year+':'+keys.join(','));
 return m;
}
/* أطول سلسلة متصلة داخل الخريطة — لإبرازها بصريًا */
function yearMapStreaks(days){
 var keys=Object.keys(days).map(Number).sort(function(a,b){return a-b;});
 var runs=[],cur=[];
 for(var i=0;i<keys.length;i++){
 if(cur.length&&keys[i]===cur[cur.length-1]+1)cur.push(keys[i]);
 else {if(cur.length)runs.push(cur);cur=[keys[i]];}
 }
 if(cur.length)runs.push(cur);
 /* علّم الأيام التي تنتمي لسلسلة ٧ أيام فأكثر */
 var hot={};
 for(var j=0;j<runs.length;j++){
 if(runs[j].length>=7){for(var k=0;k<runs[j].length;k++)hot[runs[j][k]]=1;}
 }
 return hot;
}

var STREAK={cur:0,longest:0,total:0,msg:null};
function touchStreak(){
 yearMapMark();
 var today=dayKey(),last=stGet('st_last');
 var cur=parseInt(stGet('st_cur')||'0',10),longest=parseInt(stGet('st_long')||'0',10),total=parseInt(stGet('st_total')||'0',10);
 var restarted=false,newRec=false;
 if(last!==today){
 var y=dayKey(new Date(Date.now()-86400000));
 if(last===y)cur+=1;else if(!last)cur=1;else{cur=1;restarted=true;}
 total+=1;
 if(cur>longest){longest=cur;newRec=cur>=3;}
 stSet('st_last',today);stSet('st_cur',String(cur));stSet('st_long',String(longest));stSet('st_total',String(total));}
 STREAK={cur:cur,longest:longest,total:total,msg:null};
 var ms=[3,7,14,30,60,100,200,365];
 if(ms.indexOf(cur)>=0){
 if(cur===3)STREAK.msg=pick('ثلاثة أيام وأنت تطالع جوّك مع نفاف. صارت عادة.','ثلاثة أيام متتالية.','Three days in a row — a habit is forming.');
 else if(cur===7)STREAK.msg=pick('أسبوع كامل! نفاف صار من روتينك اليومي.','أسبوع كامل من المتابعة.','A full week with Nafaf.');
 else if(cur===30)STREAK.msg=pick('شهر كامل مع نفاف. تعرف جوّك أحسن من أغلب الناس.','شهر كامل من المتابعة.','A full month with Nafaf.');
 else if(cur===100)STREAK.msg=pick('مئة يوم! هذا مو متابعة طقس هذي علاقة.','مئة يوم من المتابعة.','100 days — that\'s a relationship.');
 else if(cur===365)STREAK.msg=pick('سنة كاملة مع نفاف. شفت كل المواسم بعينك.','سنة كاملة.','A full year — every season seen.');
 else STREAK.msg=pick(cur+' يومًا متتالية مع نفاف.',cur+' يومًا متتالية.',cur+' days in a row.');}
 else if(restarted&&longest>=5)STREAK.msg=pick('رجعت! نبدأ سلسلة جديدة — أطول واحدة عندك كانت '+longest+' يوم.','أهلًا بعودتك. أطول سلسلة: '+longest+' يومًا.','Welcome back — your longest run was '+longest+' days.');
 else if(newRec)STREAK.msg=pick('رقم جديد لك: '+cur+' يومًا متتالية.','رقم قياسي جديد: '+cur+' يومًا.','New personal best: '+cur+' days.');
}
var RECBROKEN=[];
function logRecords(){
 if(!W)return;RECBROKEN=[];
 function chk(key,val,higher,label){
 var raw=stGet(key),old=raw?JSON.parse(raw):null;
 var better=!old||(higher?val>old.v:val<old.v);
 if(better){stSet(key,JSON.stringify({v:val,d:dayKey(),c:CUR.n}));if(old)RECBROKEN.push(label);}}
 chk('rec_hot',W.temperature_2m,true,'hot');
 chk('rec_cold',W.temperature_2m,false,'cold');
 chk('rec_wind',W.wind_speed_10m,true,'wind');
 if(MARINE&&MARINE.wave_height!=null)chk('rec_wave',MARINE.wave_height,true,'wave');
 var st=stateOf(W),raining=(st.indexOf('rain')===0||st==='storm'),today=dayKey();
 if(raining&&stGet('rec_lastrain')!==today){
 var lr=stGet('rec_lastrain');
 if(lr){var gap=Math.round((Date.now()-new Date(lr).getTime())/86400000);
 var lg=parseInt(stGet('rec_longdry')||'0',10);if(gap>lg)stSet('rec_longdry',String(gap));}
 stSet('rec_lastrain',new Date().toISOString());
 var yr=new Date().getFullYear();
 if(parseInt(stGet('rec_year')||'0',10)!==yr){stSet('rec_year',String(yr));stSet('rec_raindays','0');}
 stSet('rec_raindays',String(parseInt(stGet('rec_raindays')||'0',10)+1));}}

 if(RECBROKEN.indexOf('wind')>=0)return pick('أقوى رياح شفتها معك: '+wconv(W.wind_speed_10m)+' '+wlabel()+'.','أعلى سرعة رياح: '+wconv(W.wind_speed_10m)+' '+wlabel()+'.','Strongest wind logged: '+wconv(W.wind_speed_10m)+' '+wlabel()+'.');

 return null;}
function droughtLine(){

:pick('نزل المطر اليوم! يوم يستاهل يتسجّل.','هطل المطر اليوم.','It rained today.');

  var g='<g class="vpalm" style="transform-origin:'+x+'px '+(y)+'px;'+
   'animation-duration:'+palmSway.toFixed(1)+'s;animation-delay:'+delay+'s">';

  for(var a=0;a<6;a++){
   var ang=-90+(a-2.5)*32;

   var ex=x+Math.cos(rad)*15*sc, ey=(y-26*sc)+Math.sin(rad)*11*sc;
   g+='<path d="M'+x+' '+(y-26*sc)+' Q'+((x+ex)/2)+' '+(ey-6)+' '+ex+' '+ey+'" stroke="'+fr+'" stroke-width="'+(2.6*sc)+'" fill="none" stroke-linecap="round"/>';
  }
  return g+'</g>';
 }

  }

 }

/* ============================================================
   ★ خلفية قرية نفاف — صور واقعية تتبدّل مع الطقس الحقيقي
   ⚠️ نفس القرية بنفس الزاوية في ست حالات، فالانتقال يبدو
      تغيّر جو لا تبديل مكان.
   ⚠️ تُعرض خلف بطاقة الحرارة فقط لا خلف التطبيق كله.
   ============================================================ */
function villagePick(st){
 var now=new Date();
 var nf=(typeof nightFactor==='function')?nightFactor(now):0;
 var gf=(typeof goldenFactor==='function')?goldenFactor(now):0;
 /* الأولوية: الحالة الجوية الشديدة أولًا ثم وقت اليوم */
 if(st==='storm')return 'storm';
 if(st==='rain'||st==='rain_heavy')return nf>0.5?'storm':'rain';
 if(st==='rain_light')return nf>0.5?'night':'rain';
 if(st==='dust')return 'dust';
 if(nf>0.55)return 'night';
 if(gf>0.35)return 'golden';
 return 'clear';
}

function villageCard(st){
 var mo=(typeof applyMotion==='function')?applyMotion():{scenery:true};
 var key=villagePick(st);
 var wet=(key==='rain'||key==='storm');
 var temp=W?W.temperature_2m:28;
 var wind=W?W.wind_speed_10m:12;
 var i,h='<div class="vlgBox">';
 h+='<img class="vlgImg" src="'+VLG_IMG[key]+'" alt="" />';
 /* ★ شارة الحالة الحيّة داخل النافذة */
 var L=LI();
 var tagTxt={clear:['نهار صافي','نهار صافٍ','Clear day'],
  night:['ليل هادئ','ليل هادئ','Calm night'],
  golden:['ساعة ذهبية','الساعة الذهبية','Golden hour'],
  rain:['مطر نازل','هطول مطري','Raining'],
  storm:['نشاط رعدي','نشاط رعدي','Thunderstorm'],
  dust:['غبار بالجو','غبار عالق','Dusty']}[key]||['','',''];
 var tagCol={clear:'#9fd4f5',night:'#b9c4f5',golden:'#ffd166',
  rain:'#7fc9e8',storm:'#ff9b9b',dust:'#e6b45e'}[key]||'#fff';
 h+='<span class="vlgTag" style="color:'+tagCol+'"><i></i>'+tagTxt[L]+'</span>';

 if(mo.scenery){
  /* ★ سحب تنساب بسرعة الرياح الحقيقية */
  var cloudDur=Math.max(16,Math.min(90,900/Math.max(5,wind)));
  h+='<span class="vlgCloud" style="top:6%;animation-duration:'+cloudDur.toFixed(0)+'s"></span>'+
     '<span class="vlgCloud" style="top:20%;width:40%;opacity:.7;'+
     'animation-duration:'+(cloudDur*1.6).toFixed(0)+'s;animation-delay:-'+(cloudDur*0.5).toFixed(0)+'s"></span>';

  /* ★ المطر — كثافة تتبع الحالة مع ثلاث طبقات عمق */
  if(wet){
   var n=(key==='storm')?68:44;
   var layers=[{w:1.0,o:.35,sp:1.05,hh:9},{w:1.5,o:.62,sp:.82,hh:14},{w:2.1,o:.88,sp:.58,hh:19}];
   for(var Lz=0;Lz<3;Lz++){
    var ly=layers[Lz],cnt=Math.round(n*(Lz===0?.42:(Lz===1?.34:.24)));
    for(i=0;i<cnt;i++){
     h+='<span class="vd" style="left:'+(Math.random()*100).toFixed(1)+'%;'+
      'width:'+ly.w+'px;opacity:'+ly.o+';height:'+(ly.hh+Math.random()*6).toFixed(0)+'px;'+
      'animation-duration:'+(ly.sp*(0.85+Math.random()*0.3)).toFixed(2)+'s;'+
      'animation-delay:'+(Math.random()*1.1).toFixed(2)+'s"></span>';
    }
   }
   /* رذاذ يرتد من الأرض */
   var sp=(key==='storm')?16:10;
   for(i=0;i<sp;i++)
    h+='<span class="vsp" style="left:'+(Math.random()*100).toFixed(1)+'%;'+
     'bottom:'+(2+Math.random()*22).toFixed(0)+'%;'+
     'animation-duration:'+(0.7+Math.random()*0.5).toFixed(2)+'s;'+
     'animation-delay:'+(Math.random()*1.4).toFixed(2)+'s"></span>';
   h+='<div class="vlgMist"></div>';
  }

  /* ★ البرق */
  if(key==='storm')h+='<div class="vlgFlash"></div>';

  /* ★ الغبار بطبقتين */
  if(key==='dust')h+='<div class="vlgDust"></div><div class="vlgDust2"></div>';

  /* ★ ليل: توهج النوافذ ونجوم متلألئة */
  if(key==='night'){
   h+='<div class="vlgGlow"></div>';
   for(i=0;i<22;i++)
    h+='<span class="vst" style="top:'+(3+Math.random()*26).toFixed(1)+'%;'+
     'left:'+(Math.random()*100).toFixed(1)+'%;'+
     'animation-duration:'+(1.8+Math.random()*2.6).toFixed(1)+'s;'+
     'animation-delay:'+(Math.random()*3).toFixed(1)+'s"></span>';
  }

  /* ★ ارتعاش الحرارة عند الحر الشديد */
  if(temp>=40&&!wet&&key!=='night')h+='<div class="vlgHeat"></div>';
 }

 h+='<div class="vlgFade"></div></div>';
 return h;
}

function buildScene(st){
 var mo=applyMotion();if(!mo.scenery)return'';
 var h="",i;
 var df=1-nightFactor(new Date());
 if(df>0.15&&(st==="clear"||st==="mild"||st==="heat"))
 h+='<div class="s-sun" style="opacity:'+(df*0.9).toFixed(2)+'"></div>';
 var nf=nightFactor(new Date());
 if(nf>0.25&&(st==="clear"||st==="mild"||st==="cool")){
 h+='<div class="s-moon" style="opacity:'+(nf*0.9).toFixed(2)+'"></div>';
 var starCount=Math.round(nf*18);
 for(i=0;i<starCount;i++)h+='<div class="s-star" style="top:'+(6+Math.random()*70)+'%;left:'+(4+Math.random()*92)+'%;opacity:'+(nf*0.7).toFixed(2)+';animation-delay:'+(Math.random()*3)+'s"></div>';}
 if(["clear","mild","cloudy","rain","rain_light","rain_heavy","storm"].indexOf(st)>=0){
 /* السحب تتحرك بسرعة الرياح الحقيقية:
 ٥ كم/س ← زحف بطيء (~٦٥ث) · ٤٠ كم/س ← انسياق سريع (~٩ث) */
 var wsp=W?W.wind_speed_10m:12;
 var dur1=Math.max(8,Math.min(70,600/Math.max(4,wsp)));
 var dur2=dur1*1.45;
 var rev=(W&&W.wind_direction_10m!=null&&W.wind_direction_10m>180&&W.wind_direction_10m<360)?' reverse':'';
 h+='<div class="s-cl c1'+rev+'" style="animation-duration:'+dur1.toFixed(1)+'s"></div>'+
 '<div class="s-cl c2'+rev+'" style="animation-duration:'+dur2.toFixed(1)+'s;animation-delay:-'+(dur2*0.45).toFixed(1)+'s"></div>';
 /* سحابة ثالثة عند الغيوم الكثيفة */
 if(st==='cloudy'||st==='rain'||st==='rain_heavy'||st==='storm')
 h+='<div class="s-cl c3'+rev+'" style="animation-duration:'+(dur1*0.8).toFixed(1)+'s;animation-delay:-'+(dur1*0.3).toFixed(1)+'s"></div>';
 }
 /* ★ المطر الحقيقي — الكثافة والسرعة والوقع تتبع الملّيمتر الفعلي */
 if(st==="rain_light"||st==="rain"||st==="rain_heavy"||st==="storm"){
 var mmNow=0;
 if(HOURLY&&HOURLY.precipitation){
 var nowH2=new Date().getHours();
 mmNow=HOURLY.precipitation[Math.min(nowH2,HOURLY.precipitation.length-1)]||0;
 }
 if(!mmNow&&DAILY&&DAILY.precipitation_sum)mmNow=(DAILY.precipitation_sum[0]||0)/12;
 /* الشدّة ٠–١ من الملّيمتر الحقيقي مع أرضية حسب الحالة */

 if(a>=3){score-=32;why.push({d:-32,t:pick('الضغط يتغيّر بسرعة ('+PTREND.toFixed(1)+' hPa/3س)','تغيّر سريع في الضغط','Pressure changing fast')});}
 else if(a>=1.5){score-=18;why.push({d:-18,t:pick('الضغط يتحرّك','تحرّك في الضغط','Pressure moving')});}
 else why.push({d:0,t:pick('الضغط ثابت','الضغط مستقر','Pressure steady')});
 }
 /* ب) اتفاق النماذج العالمية */
 if(MODELS&&MODELS.length>=2){
 var ts=MODELS.map(function(m){return m.t;});
 var sp=Math.max.apply(null,ts)-Math.min.apply(null,ts);
 if(sp>=3){score-=22;why.push({d:-22,t:pick('النماذج مختلفة '+Math.round(sp)+'°','تباين بين النماذج '+Math.round(sp)+'°','Models differ '+Math.round(sp)+'°')});}
 else if(sp>=1.5){score-=10;why.push({d:-10,t:pick('النماذج متقاربة','تقارب بين النماذج','Models close')});}
 else why.push({d:0,t:pick('النماذج متفقة تمامًا','اتفاق تام بين النماذج','Models fully agree')});
 }
 /* ج) تقلّب الحالة خلال ١٢ ساعة */
 if(HOURLY&&HOURLY.weather_code){
 var now=new Date(),si=-1,i;
 for(i=0;i<HOURLY.time.length;i++){if(new Date(HOURLY.time[i])>now){si=i;break;}}
 if(si>=0){var codes={},n=0;
 for(i=si;i<Math.min(si+12,HOURLY.time.length);i++){codes[HOURLY.weather_code[i]]=1;n++;}
 var uniq=Object.keys(codes).length;
 if(uniq>=4){score-=18;why.push({d:-18,t:pick('الحالة تتقلّب بالساعات الجاية','تقلّب متوقع في الحالة','Conditions shifting ahead')});}
 else if(uniq<=2)why.push({d:0,t:pick('الحالة ثابتة بالساعات الجاية','ثبات متوقع','Steady hours ahead')});}
 }
 /* د) تذبذب الرياح */
 if(HOURLY&&HOURLY.wind_speed_10m){
 var now2=new Date(),s2=-1,j;
 for(j=0;j<HOURLY.time.length;j++){if(new Date(HOURLY.time[j])>now2){s2=j;break;}}
 if(s2>=0){var mn=999,mx=0;
 for(j=s2;j<Math.min(s2+8,HOURLY.time.length);j++){var v=HOURLY.wind_speed_10m[j];if(v<mn)mn=v;if(v>mx)mx=v;}
 if(mx-mn>=20){score-=14;why.push({d:-14,t:pick('الرياح متذبذبة','تذبذب في الرياح','Wind fluctuating')});}}
 }
 /* هـ) حالة جوية نشطة الآن */
 var st=stateOf(W);
 if(st==='storm'){score-=20;why.push({d:-20,t:pick('سحب رعدية نشطة','نشاط رعدي','Active thunderclouds')});}
 else if(st==='dust'){score-=12;why.push({d:-12,t:pick('غبار عالق','غبار','Dust aloft')});}
 score=Math.max(5,Math.min(100,Math.round(score)));
 var verdict;
 if(score>=80)verdict=pick('السما مستقرة','الأجواء مستقرة','Sky is settled');
 else if(score>=55)verdict=pick('السما هادية بس فيها حركة','استقرار نسبي','Mostly settled');
 else if(score>=35)verdict=pick('السما متردّدة — ترقّب تغيّر','أجواء غير مستقرة','Unsettled — expect change');
 else verdict=pick('السما تستعد لتغيّر سريع','تغيّر سريع متوقع','Rapid change building');

}

/* المواسم الإعصارية في عُمان — مصدر: توثيق صحفي عُماني ينقل عن الأرصاد */
function cycloneSeason(){
 var m=new Date().getMonth()+1;
 if(m===5||m===6)return {k:'s1',
 t:['موسم الأعاصير الأول','الموسم الإعصاري الأول','First cyclone season'],
 b:['إحنا بموسم الأعاصير الأول (مايو–يونيو). يبدأ تأثيره على ظفار ثم يمتد للمنطقة بين الوسطى ورأس الحد وقد يصل بحر عُمان في نهاية يونيو. منه جاء جونو ٢٠٠٧ ومكونو ٢٠١٨.',

 'We\u2019re in the first cyclone season (May–June) — it starts over Dhofar and moves north. Gonu and Mekunu came from it.']};
 if(m>=9&&m<=11)return {k:'s2',
 t:['موسم الأعاصير الثاني','الموسم الإعصاري الثاني','Second cyclone season'],
 b:['إحنا بموسم الأعاصير الثاني (من سبتمبر). يؤثر على المنطقة بين رأس الحد ومحافظة الوسطى ثم يمتد. منه جاء شاهين ٢٠٢١ وهيكا ٢٠١٩.',

 'The second cyclone season (from September) affects the coast between Ras Al-Hadd and Al-Wusta. Shaheen came from it.']};
 return null;
}

/* هل التاريخ اليوم يوافق حدثًا؟ */
function todayEvents(){
 var now=new Date(),m=now.getMonth()+1,d=now.getDate(),i,exact=[],near=[];
 for(i=0;i<ARCHIVE.length;i++){
 var e=ARCHIVE[i];
 if(e.m!==m)continue;
 var end=e.d2||e.d;
 if(d>=e.d&&d<=end)exact.push(e);
 else if(Math.abs(d-e.d)<=3||Math.abs(d-end)<=3)near.push(e);
 }
 return {exact:exact,near:near};
}

 ============================================================ */
var TL_OFFSET=0; /* ساعات من الآن */

/* بيانات الساعة المختارة */
function tlData(off){
 if(!HOURLY||!W)return null;
 if(off<=0)return {temp:W.temperature_2m,code:W.weather_code,wind:W.wind_speed_10m,
 hum:W.relative_humidity_2m,feels:W.apparent_temperature,pr:0,time:new Date(),live:true};
 var now=new Date(),si=-1,i;
 for(i=0;i<HOURLY.time.length;i++){if(new Date(HOURLY.time[i])>now){si=i;break;}}
 if(si<0)return null;
 var idx=Math.min(si+off-1,HOURLY.time.length-1);
 return {temp:HOURLY.temperature_2m[idx],code:HOURLY.weather_code[idx],
 wind:HOURLY.wind_speed_10m?HOURLY.wind_speed_10m[idx]:W.wind_speed_10m,
 hum:W.relative_humidity_2m,
 feels:HOURLY.apparent_temperature?HOURLY.apparent_temperature[idx]:HOURLY.temperature_2m[idx],
 pr:HOURLY.precipitation_probability?(HOURLY.precipitation_probability[idx]||0):0,
 time:new Date(HOURLY.time[idx]),live:false};
}

/* اشتقاق الحالة من كود الساعة (لا من الحالة الحالية) */
function tlState(d){
 if(!d)return 'mild';
 var c=d.code,t=d.temp,f=d.feels,rh=d.hum,wd=d.wind;
 if(c===95||c===96||c===99)return"storm";
 if(c===65||c===82||c===67)return"rain_heavy";
 if(c===63||c===81||c===80)return"rain";
 if(c===51||c===53||c===55||c===56||c===57||c===61||c===66)return"rain_light";
 if(c===45||c===48)return"fog";
 if(c===3)return"cloudy";
 if(wd>=28&&rh<45&&c<=2)return"dust";
 if(f>=42||t>=43)return"heat";
 if(t>=32&&rh>=55)return"humid";
 if(t<=20)return"cool";
 if(c<=2&&t>=17&&t<=33)return"clear";
 return"mild";
}

/* هل الساعة المختارة ليلًا؟ */
function tlIsNight(dt){
 if(!SUNRISE||!SUNSET)return dt.getHours()>=19||dt.getHours()<5;
 var sr=new Date(SUNRISE),ss=new Date(SUNSET);
 var m=dt.getHours()*60+dt.getMinutes();
 return m<(sr.getHours()*60+sr.getMinutes())||m>(ss.getHours()*60+ss.getMinutes());
}
/* هل الساعة المختارة ساعة ذهبية؟ */
function tlIsGolden(dt){
 if(!SUNRISE||!SUNSET)return false;
 var sr=new Date(SUNRISE),ss=new Date(SUNSET),W1=45*60000;
 function sameDayMs(base){var x=new Date(dt);x.setHours(base.getHours(),base.getMinutes(),0,0);return x;}
 return Math.abs(dt-sameDayMs(sr))<=W1||Math.abs(dt-sameDayMs(ss))<=W1;
}

/* مزج لوني ناعم بين تدرّجين */
function mixHex(a,b,t){
 function h2r(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
 var A=h2r(a),B=h2r(b),i,o='#';
 for(i=0;i<3;i++){var v=Math.round(A[i]+(B[i]-A[i])*t).toString(16);o+=v.length<2?'0'+v:v;}
 return o;
}

 return {i:'rain',t:[

 }
 /* مطر قادم */
 if(rain6>=45){
 return {i:'soon',t:[
 'قبل المطر بشوي بتشمّ هوا نظيف حاد — سببه الأوزون اللي تنزّله التيارات الهابطة من طبقات الجو العليا. جسمك يعرف إن المطر جاي قبل ما تشوفه.',

 }

 if(st==='humid'&&hum>=70){

 }

 if(st==='dust'){

 'يحمل الغبار رائحة معدنية جافة مصدرها ذرّات التربة الدقيقة العالقة.',
 'Dust brings a dry mineral note — the fine soil particles themselves.']};
 }
 /* حر شديد */
 if(st==='heat'&&W.temperature_2m>=40){
 return {i:'hot',t:[

/* ============================================================
 محرّك الأحداث الفلكية — «شيء لن يتكرر قريبًا»
 كل حساب هنا رياضي دقيق بلا واجهة برمجية يعمل أوفلاين.
 ⚠️ لا نخترع ندرة: كل ادعاء «نادر» مبني على دورة فلكية حقيقية.
 ============================================================ */

/* اليوم اليولياني — أساس كل الحسابات الفلكية */
function julianDay(d){
 var y=d.getUTCFullYear(),m=d.getUTCMonth()+1,day=d.getUTCDate();
 var h=d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600;
 if(m<=2){y-=1;m+=12;}
 var A=Math.floor(y/100),B=2-A+Math.floor(A/4);
 return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+day+B-1524.5+h/24;
}

/* طور القمر ونسبة إضاءته — دقة ~١٪ */
var SYNODIC=29.530588853; /* الشهر الاقتراني */
var ANOMALISTIC=27.554549878; /* الشهر الأنومالي (دورة القرب والبعد) */
var NEW_MOON_REF=2451550.09766; /* محاق مرجعي: 6 يناير 2000 */
var PERIGEE_REF=2451534.6698; /* حضيض مرجعي */

function moonInfo(d){
 var jd=julianDay(d||new Date());
 var age=((jd-NEW_MOON_REF)%SYNODIC+SYNODIC)%SYNODIC; /* عمر القمر بالأيام */
 var phase=age/SYNODIC; /* ٠=محاق ٠.٥=بدر */
 var illum=(1-Math.cos(2*Math.PI*phase))/2; /* نسبة الإضاءة */
 /* المسافة التقريبية: تتذبذب بين ٣٥٦٥٠٠ و٤٠٦٧٠٠ كم */
 var anom=((jd-PERIGEE_REF)%ANOMALISTIC+ANOMALISTIC)%ANOMALISTIC;
 var anomAngle=2*Math.PI*anom/ANOMALISTIC;
 var dist=381600-25100*Math.cos(anomAngle); /* كم — النطاق الفلكي ٣٥٦٥٠٠–٤٠٦٧٠٠ */
 return {age:age,phase:phase,illum:illum,dist:dist,jd:jd};
}
function moonPhaseName(ph){
 var L=LI();
 if(ph<0.02||ph>0.98)return ['محاق','محاق','New moon'][L];
 if(ph<0.23)return ['هلال متزايد','هلال متزايد','Waxing crescent'][L];
 if(ph<0.27)return ['تربيع أول','تربيع أول','First quarter'][L];
 if(ph<0.48)return ['أحدب متزايد','أحدب متزايد','Waxing gibbous'][L];
 if(ph<0.52)return ['بدر','بدر','Full moon'][L];
 if(ph<0.73)return ['أحدب متناقص','أحدب متناقص','Waning gibbous'][L];
 if(ph<0.77)return ['تربيع أخير','تربيع أخير','Last quarter'][L];
 return ['هلال متناقص','هلال متناقص','Waning crescent'][L];
}

/* زخّات الشهب الكبرى — تواريخ الذروة حقيقية وثابتة سنويًا */
var METEOR_SHOWERS=[

/* بناء حدث اليوم الفلكي — يختار الأندر */
function astroToday(){
 var now=new Date(),L=LI(),m=now.getMonth()+1,day=now.getDate();
 var mi=moonInfo(now),out=[];

 /* ١) قمر عملاق: بدر + حضيض */
 if(mi.illum>=0.97&&mi.dist<=361000){
 out.push({p:100,icon:'moon',
 t:['قمر عملاق الليلة','قمر عملاق','Supermoon tonight'],

 'بدر في الحضيض على بعد '+Math.round(mi.dist).toLocaleString('en')+' كم — أكبر وأسطع من المعتاد.',
 'A full moon at perigee — '+Math.round(mi.dist).toLocaleString('en')+' km away. Up to 14% bigger and 30% brighter.'][L],
 r:['يحدث ٣–٤ مرات بالسنة فقط','٣–٤ مرات سنويًا','Only 3–4 times a year'][L]});
 }
 /* ٢) بدر عادي */
 else if(mi.illum>=0.98){
 out.push({p:70,icon:'moon',
 t:['بدر الليلة','بدر','Full moon tonight'],
 b:['القمر مكتمل الليلة — ليلة بيضاء بس ما تصلح لمراقبة الشهب ضوؤه يطمس الخافت منها.',
 'اكتمال القمر الليلة؛ ضوؤه يحجب الشهب الخافتة.',
 'The moon is full — beautiful, but its light washes out faint meteors.'][L],
 r:['كل ٢٩ يوم ونصف','كل ٢٩.٥ يومًا','Every 29.5 days'][L]});
 }
 /* ٣) محاق — أفضل ليالي رصد النجوم */
 else if(mi.illum<=0.04){
 out.push({p:75,icon:'star',
 t:['محاق — أحلك ليالي الشهر','محاق','New moon — the darkest nights'],
 b:['ما في قمر الليلة وهذي أفضل ليلة بالشهر لرؤية النجوم ودرب التبانة. لو طلعت بعيد عن أضواء المدينة بتشوف ما ما شفته قبل.',
 'انعدام ضوء القمر يجعلها أفضل ليالي الشهر لرصد النجوم ودرب التبانة.',
 'No moonlight — the best night this month for stars and the Milky Way.'][L],
 r:['ليلتان أو ثلاث في الشهر','ليلتان أو ثلاث شهريًا','Two or three nights a month'][L]});
 }

 /* ٤) زخّات الشهب */
 var i;
 for(i=0;i<METEOR_SHOWERS.length;i++){
 var ms=METEOR_SHOWERS[i];
 if(ms.m!==m)continue;
 var diff=Math.abs(day-ms.d);
 if(diff<=ms.w){
 var atPeak=diff<=1;
 var moonWarn=mi.illum>0.6?['لكن ضوء القمر قوي الليلة ويطمس الخافت منها.','لكن ضوء القمر سيحجب الشهب الخافتة.',' But bright moonlight will wash out the faint ones.'][L]:
 (mi.illum<0.2?['وحظّك حلو: القمر خافت فالسما مظلمة والرؤية ممتازة.','والقمر خافت ما يجعل الرؤية ممتازة.',' And luckily the moon is dim — excellent viewing.'][L]:'');
 out.push({p:atPeak?95:60,icon:'meteor',
 t:[(atPeak?'ذروة زخّة ':'قرب ذروة زخّة ')+ms.n[0],(atPeak?'ذروة ':'قرب ذروة ')+ms.n[1],(atPeak?'Peak of the ':'Near peak of the ')+ms.n[2]][L],
 b:[(atPeak?'الليلة ذروتها — ':'ذروتها بعد '+Math.max(1,ms.d-day)+' أيام — ')+'حتى '+ms.rate+' شهاب بالساعة بأحسن الظروف. '+ms.b[0]+' '+moonWarn,
 (atPeak?'الذروة الليلة: ':'قرب الذروة: ')+'حتى '+ms.rate+' شهاب/ساعة. '+ms.b[1]+' '+moonWarn,
 (atPeak?'Peak tonight — ':'Peak in '+Math.max(1,ms.d-day)+' days — ')+'up to '+ms.rate+'/hour. '+ms.b[2]+' '+moonWarn][L],
 r:['مرة واحدة في السنة','سنويًا','Once a year'][L]});
 }
 }

 /* ٥) الانقلابات والاعتدالات */
 for(i=0;i<SUN_EVENTS.length;i++){
 var se=SUN_EVENTS[i];
 if(se.m===m&&Math.abs(day-se.d)<=1){
 out.push({p:85,icon:'sun',t:se.n[L],b:se.b[L],
 r:['مرة واحدة في السنة','سنويًا','Once a year'][L]});
 }
 }

 /* ٦) سهيل */
 var su=suhailEvent(now);
 if(su)out.push({p:90,icon:'star',t:su.n[L],b:su.b[L],r:su.rare[L]});

 /* ٧) الاحتياطي: طور القمر دائمًا متاح */
 if(!out.length){
 out.push({p:10,icon:'moon',
 t:[moonPhaseName(mi.phase),moonPhaseName(mi.phase),moonPhaseName(mi.phase)][L],
 b:['القمر مضيء '+Math.round(mi.illum*100)+'٪ الليلة وعمره '+Math.round(mi.age)+' يوم من المحاق. المسافة '+Math.round(mi.dist).toLocaleString('en')+' كم.',
 'إضاءة القمر '+Math.round(mi.illum*100)+'٪ وعمره '+Math.round(mi.age)+' يومًا.',
 'The moon is '+Math.round(mi.illum*100)+'% lit, '+Math.round(mi.age)+' days old.'][L],
 r:''});
 }
 out.sort(function(a,b){return b.p-a.p;});
 return out[0];
}

/* ============================================================
 السماء الآن — بثّ مباشر لأحداث سمائك
 ⚠️ كل حدث هنا مرصود فعليًا بمقارنة قراءتين متتاليتين 
 أو محسوب فلكيًا بدقة. لا اختلاق ولا تخمين.
 ⚠️ ممنوع: أي حدث يُقدَّم كتحذير سلامة.
 ============================================================ */
var LIVE_FEED=[]; /* الأحداث المرصودة */
var LIVE_PREV=null; /* آخر قراءة للمقارنة */
var LIVE_MAX=8; /* أقصى ما يُعرض */
var LIVE_SEEN={}; /* لمنع تكرار الأحداث الفلكية */

function feedKey(){return 'feed_'+CUR.n;}

/* حمّل البثّ المحفوظ لهذه المدينة */
function feedLoad(){
 LIVE_FEED=[];LIVE_PREV=null;
 try{
 var raw=stGet(feedKey());
 if(raw){var o=JSON.parse(raw);
 if(o&&o.f){
 /* احذف ما مضى عليه أكثر من ٦ ساعات */
 var cut=Date.now()-6*3600000;
 LIVE_FEED=o.f.filter(function(e){return e.t>cut;}).slice(0,LIVE_MAX);
 }
 if(o&&o.p)LIVE_PREV=o.p;
 if(o&&o.s)LIVE_SEEN=o.s;
 }
 }catch(e){}
}
function feedSave(){
 try{stSet(feedKey(),JSON.stringify({f:LIVE_FEED.slice(0,LIVE_MAX),p:LIVE_PREV,s:LIVE_SEEN}));}catch(e){}
}
function feedPush(icon,txt,weight){
 /* لا تكرّر نفس النص خلال ساعة */
 var i;for(i=0;i<LIVE_FEED.length;i++)
 if(LIVE_FEED[i].x===txt&&Date.now()-LIVE_FEED[i].t<3600000)return;
 LIVE_FEED.unshift({i:icon,x:txt,t:Date.now(),w:weight||1});
 if(LIVE_FEED.length>LIVE_MAX)LIVE_FEED.length=LIVE_MAX;
}

/* ---------- رصد الأحداث بمقارنة قراءتين ---------- */
function feedScan(){

 var cur={t:W.temperature_2m,h:W.relative_humidity_2m,w:W.wind_speed_10m,

 }
 if(LIVE_PREV){

 if(mins>=4&&mins<=240){ /* فجوة معقولة للمقارنة */
 /* الضغط — أثمن مؤشر */
 if(LIVE_PREV.p!=null&&cur.p!=null){

 if(Math.abs(dp)>=0.8){

:pick('بآخر '+Math.round(mins/60)+' ساعات','خلال '+Math.round(mins/60)+' ساعات','over '+Math.round(mins/60)+'h');

:pick('الضغط طلع '+dp.toFixed(1)+' hPa '+per+' — يميل للاستقرار.',
 'ارتفع الضغط '+dp.toFixed(1)+' hPa '+per+'.',
 'Pressure rose '+dp.toFixed(1)+' hPa '+per+' — settling.'),3);
 }
 }
 /* الحرارة */
 var dt=cur.t-LIVE_PREV.t;
 if(Math.abs(dt)>=1.5){
 feedPush('temp',
 dt<0?pick('الحرارة نزلت '+Math.abs(Math.round(dt))+'° بآخر '+mins+' دقيقة.',
 'انخفضت الحرارة '+Math.abs(Math.round(dt))+'° خلال '+mins+' دقيقة.',

:pick('الحرارة طلعت '+Math.round(dt)+'° بآخر '+mins+' دقيقة.',
 'ارتفعت الحرارة '+Math.round(dt)+'° خلال '+mins+' دقيقة.',
 'Temperature rose '+Math.round(dt)+'° in '+mins+' min.'),2);
 }
 /* الرياح — الاتجاه أهم من السرعة */
 if(LIVE_PREV.d!=null&&cur.d!=null){
 var dd=Math.abs(((cur.d-LIVE_PREV.d)+540)%360-180);
 if(dd>=55)feedPush('wind',
 pick('الرياح غيّرت اتجاهها — صارت '+dirName(cur.d)+'.',

 }
 var dw=cur.w-LIVE_PREV.w;
 if(Math.abs(dw)>=7)feedPush('wind',

:pick('الرياح هدت إلى '+wconv(cur.w)+' '+wlabel()+'.',
 'خفّت الرياح إلى '+wconv(cur.w)+' '+wlabel()+'.',
 'Wind eased to '+wconv(cur.w)+' '+wlabel()+'.'),2);
 /* الرطوبة */
 var dh=cur.h-LIVE_PREV.h;
 if(Math.abs(dh)>=9)feedPush('hum',
 dh>0?pick('الرطوبة زادت إلى '+Math.round(cur.h)+'٪.','ارتفعت الرطوبة إلى '+Math.round(cur.h)+'٪.','Humidity up to '+Math.round(cur.h)+'%.')
:pick('الرطوبة نزلت إلى '+Math.round(cur.h)+'٪.','انخفضت الرطوبة إلى '+Math.round(cur.h)+'٪.','Humidity down to '+Math.round(cur.h)+'%.'),1);
 /* تبدّل الحالة — أوضح حدث */
 if(LIVE_PREV.c!==cur.c){
 var oldN=META[LIVE_PREV.c].t[L],newN=META[cur.c].t[L];
 var rainStart=(cur.c.indexOf('rain')===0||cur.c==='storm')&&LIVE_PREV.c.indexOf('rain')!==0&&LIVE_PREV.c!=='storm';
 feedPush(rainStart?'rain':'sky',
 rainStart?pick('بدأ المطر عندك.','بدأ الهطول في منطقتك.','Rain has started here.')
:pick('السما تغيّرت: من '+oldN+' إلى '+newN+'.',
 'تغيّرت الحالة من '+oldN+' إلى '+newN+'.',
 'Changed from '+oldN+' to '+newN+'.'),rainStart?4:3);
 }
 }
 }
 LIVE_PREV=cur;
 feedAstro();
 feedSave();
}

/* ---------- أحداث فلكية: البثّ لا يصمت أبدًا ---------- */
function feedAstro(){
 if(!SUNRISE||!SUNSET)return;
 var now=new Date(),L=LI(),today=now.toDateString();
 function once(key,fn){
 var k=key+'_'+today;
 if(LIVE_SEEN[k])return;
 if(fn()){LIVE_SEEN[k]=1;}
 }
 var sr=new Date(SUNRISE),ss=new Date(SUNSET);
 function at(base){var x=new Date(now);x.setHours(base.getHours(),base.getMinutes(),0,0);return x;}
 var srT=at(sr),ssT=at(ss);
 var toSet=Math.round((ssT-now)/60000);
 var sinceRise=Math.round((now-srT)/60000);
 var noon=new Date((srT.getTime()+ssT.getTime())/2);
 var sinceNoon=Math.round((now-noon)/60000);

 /* ★ ضمان الامتلاء: حدث دائم يصف موضع الشمس أو القمر الآن */
 (function alwaysOne(){
 if(LIVE_FEED.length>=2)return; /* فيه أحداث كافية */
 var L2=LI();
 if(now>=srT&&now<=ssT){
 /* نهار: كم قطعنا منه */
 var prog=(now-srT)/Math.max(1,(ssT-srT));
 var pct=Math.round(prog*100);
 var hrsLeft=Math.floor(toSet/60),minLeft=toSet%60;
 var left=hrsLeft>0?(hrsLeft+pick(' ساعة و',' ساعة و','h ')+minLeft+pick(' دقيقة',' دقيقة','m')):(minLeft+pick(' دقيقة',' دقيقة','m'));
 var where=prog<0.2?['الشمس لسا بأول السما','الشمس في بداية مسارها','The sun is early in its arc'][L2]
:prog<0.42?['الشمس صاعدة نحو الذروة','الشمس ترتفع نحو الذروة','The sun is climbing'][L2]
:prog<0.58?['الشمس بأعلى نقطة اليوم','الشمس قرب ذروتها','The sun is at its peak'][L2]
:prog<0.82?['الشمس نازلة غرب','الشمس تتجه غربًا','The sun is heading west'][L2]
:['الشمس قربت تغرب','الشمس تقترب من الغروب','The sun is nearing the horizon'][L2];
 feedPush('sun',where+' — '+['قطعنا '+pct+'٪ من النهار وباقي '+left+' على الغروب.',
 'انقضى '+pct+'٪ من النهار ويتبقى '+left+' على الغروب.',
 pct+'% of daylight is gone; '+left+' to sunset.'][L2],1);
 } else {
 /* ليل: القمر */
 var mi3=moonInfo(now);
 var toRise=now<srT?Math.round((srT-now)/60000):Math.round((srT.getTime()+86400000-now)/60000);
 var hR=Math.floor(toRise/60);
 feedPush('moon',['الليل عندك — القمر مضيء '+Math.round(mi3.illum*100)+'٪ وباقي '+hR+' ساعات على الشروق.',
 'الليل الآن؛ إضاءة القمر '+Math.round(mi3.illum*100)+'٪ ويتبقى '+hR+' ساعات على الشروق.',
 'Night here — moon '+Math.round(mi3.illum*100)+'% lit, '+hR+'h to sunrise.'][L2],1);
 }
 })();

 /* الشروق */
 once('rise',function(){
 if(sinceRise>=0&&sinceRise<=25){
 feedPush('sun',pick('طلعت الشمس قبل '+sinceRise+' دقيقة.','أشرقت الشمس قبل '+sinceRise+' دقيقة.','Sun rose '+sinceRise+' min ago.'),2);
 return true;}
 return false;});
 /* الزوال */
 once('noon',function(){
 if(sinceNoon>=0&&sinceNoon<=25){

var WATCH=null, WATCH_LOADING=false, WATCH_TS=0, WATCH_OPEN=false, WATCH_ACTIVE=null;

function watchLoad(force){
 if(WATCH_LOADING)return;
 if(!force&&WATCH&&(Date.now()-WATCH_TS)<10*60000)return;
 var SPOTS=activeSpots();
 if(!SPOTS){WATCH={wet:[],soon:[],none:true};if(TAB==='now')renderNow();return;}
 WATCH_LOADING=true;
 WATCH_ACTIVE=SPOTS;
 var lats=SPOTS.map(function(c){return c.lat;}).join(',');
 var lons=SPOTS.map(function(c){return c.lon;}).join(',');
 /* ثلاثة نماذج مستقلة — الاختلاف بينها معلومة لا عيب */
 var MODELS3=['ecmwf_ifs025','gfs_seamless','icon_seamless'];
 fetch('https://api.open-meteo.com/v1/forecast?latitude='+lats+'&longitude='+lons+
 '&current=precipitation,weather_code&hourly=precipitation_probability,precipitation'+
 '&forecast_days=1&models='+MODELS3.join(',')+'&timezone=auto')
.then(function(r){if(!r.ok)throw 0;return r.json();})
.then(function(d){
 var arr=Array.isArray(d)?d:[d],i,wet=[],soon=[];
 for(i=0;i<arr.length&&i<SPOTS.length;i++){
 var it=arr[i];if(!it||!it.current)continue;
 var cu=it.current, hits=0, maxMM=0, byModel=[], k;
 for(k=0;k<MODELS3.length;k++){
 var mm=cu['precipitation_'+MODELS3[k]];
 var wc=cu['weather_code_'+MODELS3[k]];
 /* ★ الحساسية المحسّنة: كود الطقس يكشف مطرًا حتى لو الكمية صفر */
 var codeRain=(wc!=null)&&((wc>=51&&wc<=67)||(wc>=80&&wc<=82)||(wc>=95&&wc<=99));
 var amtRain=(mm!=null&&mm>=0.05);
 if(codeRain||amtRain){hits++;byModel.push({m:MODELS3[k],mm:mm||0,wc:wc});}
 if(mm!=null&&mm>maxMM)maxMM=mm;
 }
 /* لو النموذج الواحد لا يعطي قيم منفصلة (استجابة موحّدة) */
 if(!MODELS3.length||cu.precipitation!=null){
 var wc0=cu.weather_code;
 var cr0=(wc0!=null)&&((wc0>=51&&wc0<=67)||(wc0>=80&&wc0<=82)||(wc0>=95&&wc0<=99));
 if((cr0||(cu.precipitation>=0.05))&&!hits){hits=1;maxMM=Math.max(maxMM,cu.precipitation||0);}
 }
 if(hits>0)wet.push({s:SPOTS[i],mm:maxMM,hits:hits,total:MODELS3.length,models:byModel});

 /* احتمال الساعات القادمة — أعلى نموذج */
 if(it.hourly){
 var nowH=new Date().getHours(),mx=0,j,kk;
 for(kk=0;kk<MODELS3.length;kk++){

 if(!pp)continue;
 for(j=nowH;j<Math.min(nowH+8,pp.length);j++){var v=pp[j]||0;if(v>mx)mx=v;}
 }
 if(mx>0)soon.push({s:SPOTS[i],p:mx});
 }
 }
 wet.sort(function(a,b){
 if(b.hits!==a.hits)return b.hits-a.hits; /* اتفاق النماذج أولًا */
 return b.mm-a.mm;});
 soon.sort(function(a,b){return b.p-a.p;});
 WATCH={wet:wet,soon:soon,models:MODELS3.length};WATCH_TS=Date.now();WATCH_LOADING=false;
 if(wet.length){

 feedSave();
 }
 if(TAB==='now')renderNow();
 }).catch(function(){WATCH_LOADING=false;});
}

/* المسافة بالكيلومترات — صيغة هافرساين */
function kmBetween(la1,lo1,la2,lo2){
 var R=6371,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;
 var a=Math.sin(dLa/2)*Math.sin(dLa/2)+
 Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
/* ★ أقرب محطة رسمية بالمسافة الفعلية — لا بالحدود الإدارية */
function nearestStation(la,lo){
 var best=null,g;
 for(g in CLIMATE){
 var c=CLIMATE[g];
 var d=kmBetween(la,lo,c.la,c.lo);
 if(!best||d<best.km)best={gov:g,km:d,c:c};
 }
 return best;
}

function inOman(la,lo){return la>=16.4&&la<=26.6&&lo>=51.8&&lo<=60.0;}

 if(normT==null)return null;

 normT:normT,normH:normH,normR:normR,diff:d,yrs:st.c.yrs};

 ⚠️ حُذفت هذه الكتلة سهوًا في تعديل سابق فتوقّف renderNow عندها
 ============================================================ */
function setNafaf(t,src){
 NAFAF_TXT=t;NAFAF_SRC=src||"";
 var e=$("nafafText");if(e)e.innerHTML=t;
 var e2=$("nafafText2");if(e2)e2.innerHTML=t;
}
function doAsk(){
 var el=$("qin");if(!el||!W)return;
 var q=el.value.replace(/^\s+|\s+$/g,"");
 if(!q)return;
 setNafaf(nafafAnswer(q),"");
 el.value="";
}
var QA=[
 {k:'what',q:['وش الجو اليوم؟','ما حالة الطقس؟',"How's the weather?"]},
 {k:'sea',q:['أطلع البحر؟','هل أخرج إلى البحر؟','Go to sea?']},
 {k:'bbq',q:['أشوي بره؟','هل أشوي في الخارج؟','BBQ outside?']},
 {k:'carwash',q:['أغسل سيارتي؟','هل أغسل سيارتي؟','Wash my car?']},
 {k:'walk',q:['الجو زين للمشي؟','مناسب للمشي؟','Good for a walk?']},
 {k:'laundry',q:['أنشر غسيلي؟','هل أنشر الغسيل؟','Hang laundry?']}
];
function answer(k){
 if(!W)return;
 if(k==='what'){
 setNafaf(nafafAnswer('وش الجو'),pick('قريت كل بياناتك','قرأتُ كل البيانات','Read all your data'));
 return;
 }
 var res=evalActs(),i;
 for(i=0;i<res.length;i++){
 if(res[i].a.k===k){
 var src=(k==='sea'&&MARINE&&MARINE.wave_height!=null)
 ?pick('قريت بيانات الموج الحيّة','قرأتُ بيانات الموج','Read live wave data')
 :pick('قريت توقعات الساعات الجاية','قرأتُ التوقعات القادمة','Read the coming hours');
 setNafaf(res[i].note,src);
 return;
 }
 }
 setNafaf(pickLocal(stateOf(W)),"");
}
function buildChips(){
 var box=$("chips");if(!box)return;
 var h="",i,L=LI();
 for(i=0;i<QA.length;i++)h+='<button class="chip" data-k="'+QA[i].k+'">'+QA[i].q[L]+'</button>';
 box.innerHTML=h;
 var b=box.getElementsByTagName("button"),j;
 for(j=0;j<b.length;j++)b[j].onclick=function(){answer(this.getAttribute("data-k"));};
}

/* ============================================================
 البطاقة الدوّارة — تعرض معلومة مختلفة كل ٤ ثوانٍ
 تحل محل «مقابل المعدّل الرسمي» الثابت وتعرّف المستخدم بكل شيء
 ============================================================ */
var ROT_I=0, ROT_TIMER=null, ROT_PAUSED=false;

/* تبني قائمة الشرائح المتاحة الآن — تتخطى الفارغ تلقائيًا */
function rotSlides(){
 var out=[],L=LI();

 /* ١) المعدّل الرسمي */
 var an=(typeof anomalyInfo==='function')?anomalyInfo():null;
 if(an){
 var d=Math.round(an.diff*10)/10, sign=d>0?'+':(d<0?'−':'');
 var col=Math.abs(d)<1.5?'#9fd4f5':(d>=4?'#ff8f8f':(d>0?'#ffd166':'#7fe39a'));
 var mo=(typeof MONTHS_AR!=='undefined')?(L===2?MONTHS_EN[new Date().getMonth()]:MONTHS_AR[new Date().getMonth()]):'';
 out.push({k:'anomaly',
 t:['مقابل المعدّل الرسمي','المعدّل الرسمي','vs official average'][L],
 badge:sign+Math.abs(d)+'°', col:col,
 b:['حرارتك '+tconv(W.temperature_2m)+'° ومعدّل '+mo+' الرسمي '+tconv(an.normT)+'°.',
 'الحالية '+tconv(W.temperature_2m)+'° مقابل معدّل '+mo+' '+tconv(an.normT)+'°.',
 'You are at '+tconv(W.temperature_2m)+'°, the '+mo+' average is '+tconv(an.normT)+'°.'][L],
 s:['المصدر: المركز الوطني للإحصاء · '+an.station,
 'المصدر: المركز الوطني للإحصاء','Source: Oman NCSI · '+an.station][L]});
 }

 /* ٢) موجز نفاف */
 var b=(typeof nafafBrief==='function')?nafafBrief():null;
 if(b&&b.items&&b.items.length){
 var lines='';
 for(var i=0;i<Math.min(3,b.items.length);i++)
 lines+=(i?'<br>':'')+'<span style="color:#e6b45e;font-weight:800">'+
 ((typeof BRIEF_ICONS!=='undefined'?BRIEF_ICONS[b.items[i].e]:'')||'•')+'</span> '+b.items[i].t;
 out.push({k:'brief',t:['موجز نفاف','موجز نفاف','Nafaf brief'][L],
 badge:'', col:'#e6b45e', b:lines, s:'', head:b.head});
 }

 /* ٣) سماء الليلة */
 var a=(typeof astroToday==='function')?astroToday():null;
 if(a)out.push({k:'astro',t:['سماء الليلة','حدث السماء','Tonight\u2019s sky'][L],
 badge:a.r||'', col:'#b9c4f5', b:'<b>'+a.t+'</b><br>'+a.b, s:''});

 /* ٤) في مثل هذا اليوم */
 if(typeof onThisDayCard==='function'){
 var ev=(typeof todayEvents==='function')?todayEvents():null;
 var pick1=ev&&(ev.exact.length?ev.exact[0]:(ev.near.length?ev.near[0]:null));
 if(pick1){
 var ya=(typeof yearsAgo==='function')?yearsAgo(pick1.y):0;
 out.push({k:'onday',t:['في مثل هذا اليوم','في مثل هذا اليوم','On this day'][L],
 badge:ya?('قبل '+ya+' سنة'):'', col:'#9fd4f5',
 b:'<b>'+pick1.t[L]+'</b><br>'+pick1.b[L], s:['المصدر: '+pick1.src[L],'المصدر: '+pick1.src[L],'Source: '+pick1.src[L]][L]});
 } else if(typeof monthEvent==='function'){
 var me=monthEvent();
 if(me)out.push({k:'onday',t:['هذا الشهر','هذا الشهر','This month'][L],
 badge:'', col:'#9fd4f5', b:'<b>'+me.t[L]+'</b><br>'+me.b[L], s:''});
 }
 }

 /* ٥) قصة اليوم */
 var st=(typeof todayStory==='function')?todayStory():null;
 if(st)out.push({k:'story',t:['قصة اليوم','قصة اليوم','Today\u2019s story'][L],
 badge:'', col:'#e6b45e', b:'<b>'+st.t+'</b><br>'+st.b, s:''});

 /* ٦) الدرور والنجوم */
 if(typeof starLine==='function'){
 var sl=starLine();
 if(sl)out.push({k:'star',t:['الدرور والنجوم','المواسم النجمية','Star season'][L],
 badge:'', col:'#e6b45e', b:sl, s:''});
 }

 /* ٧) اتفاق النماذج */
 if(typeof MODEL_NOTE!=='undefined'&&MODEL_NOTE)
 out.push({k:'models',t:['اتفاق النماذج العالمية','اتفاق النماذج','Model agreement'][L],
 badge:'', col:'#9fd4f5', b:MODEL_NOTE, s:'ECMWF · GFS · ICON · UKMO'});

 /* ٨) استقرار السماء */
 if(typeof STAB!=='undefined'&&STAB)
 out.push({k:'stab',t:['استقرار السماء','مؤشر الاستقرار','Sky stability'][L],
 badge:STAB.score+'%', col:STAB.score>=80?'#7fe39a':(STAB.score>=55?'#9fd4f5':(STAB.score>=35?'#ffd166':'#ff8f8f')),
 b:STAB.verdict, s:['محسوب من بياناتك — لا تخمين.','محسوب من البيانات المتاحة.','Computed from live data.'][L]});

 /* ٩) رائحة الجو */
 if(typeof smellLine==='function'){
 var sm=smellLine();
 if(sm)out.push({k:'smell',t:['رائحة الجو','رائحة الأجواء','Scent of the air'][L],
 badge:'', col:'#9fd4f5', b:sm.t[L], s:''});
 }

 /* تصفية حسب اختيار المشغّل من اللوحة */
 if(CFG.rotateSlides&&CFG.rotateSlides.length){
 var keep=out.filter(function(x){return CFG.rotateSlides.indexOf(x.k)>=0;});
 if(keep.length)out=keep;
 }
 return out;
}

function rotCard(){
 var sl=rotSlides();
 if(!sl.length)return '';
 if(ROT_I>=sl.length)ROT_I=0;
 var c=sl[ROT_I];
 var dots='';
 for(var i=0;i<sl.length;i++)dots+='<span class="rt-dot'+(i===ROT_I?' on':'')+'"></span>';
 return '<div class="rotator" id="rotCard">'+
 '<div class="rt-head">'+
 '<span class="rt-t" style="color:'+c.col+'">'+c.t+'</span>'+
 (c.badge?'<span class="rt-badge" style="color:'+c.col+';border-color:'+c.col+'55;background:'+c.col+'1f">'+c.badge+'</span>':'')+
 '</div>'+
 (c.head?'<div class="rt-lead">'+c.head+'</div>':'')+
 '<div class="rt-b" id="rotBody">'+c.b+'</div>'+
 (c.s?'<div class="rt-s">'+c.s+'</div>':'')+
 '<div class="rt-dots">'+dots+'</div>'+
 '</div>';
}

function rotNext(){
 if(ROT_PAUSED)return;
 var sl=rotSlides();
 if(sl.length<2)return;
 ROT_I=(ROT_I+1)%sl.length;
 var el=$("rotCard");
 if(!el){rotStop();return;}
 el.style.opacity='0';
 setTimeout(function(){
 var host=el.parentNode;
 if(host)host.innerHTML=rotCard();
 var ne=$("rotCard");
 if(ne){ne.style.opacity='0';setTimeout(function(){ne.style.opacity='1';},20);}
 rotWire();
 },260);
}
function rotStart(){
 rotStop();
 var sl=rotSlides();
 if(sl.length<2)return;
 ROT_TIMER=setInterval(rotNext,(CFG.rotateSec||4)*1000);
}
function rotStop(){if(ROT_TIMER){clearInterval(ROT_TIMER);ROT_TIMER=null;}}
function rotWire(){
 var el=$("rotCard");if(!el)return;
 /* اللمس يوقف الدوران مؤقتًا وينتقل للتالي */
 el.onclick=function(){
 ROT_PAUSED=false;
 rotNext();
 rotStart();
 };
}
