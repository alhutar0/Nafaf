<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#141c2b" />
<link rel="manifest" id="mf" href="manifest.json" />
<meta name="description" content="نفاف — مشروع ثقافي تعليمي يحفظ معرفة أهل الجزيرة بالسماء: التقويم النجمي والمواسم وعلوم الجو وأرشيف مناخي موثّق بثلاث لغات مع تحليل نماذج جوية مفتوحة." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="نفاف" />
<meta name="description" content="طقسك بين يديك بلسان أهلك" />
<title>نفاف — Nafaf</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
 *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
 html,body{width:100%;min-height:100%}
 /* ★ نظام السمات — ثلاث سمات يختار المستخدم بينها */
 :root{
  --bg1:#141c2b; --bg2:#1b2637; --bg3:#242f43;   /* ليلي هادئ — أزرق مخفّف */
  --card:rgba(255,255,255,.07); --cardBd:rgba(255,255,255,.14);
  --tx:#fff; --tx2:rgba(255,255,255,.72); --tx3:rgba(255,255,255,.5);
  --gold:#e6b45e; --sheet:#12203c; --sheetTx:#fff;
 }
 body.th-mid{        /* رمادي دافئ — محايد ومريح */
  --bg1:#1e2028; --bg2:#282a33; --bg3:#33353f;
  --card:rgba(255,255,255,.06); --cardBd:rgba(255,255,255,.12);
 }
 body.th-light{      /* نهاري فاتح — سماء بيضاء بسحب */
  --bg1:#dceaf7; --bg2:#eaf2fa; --bg3:#f7fafd;
  --card:rgba(255,255,255,.92); --cardBd:rgba(27,44,71,.09);
  --tx:#16233a; --tx2:rgba(22,35,58,.7); --tx3:rgba(22,35,58,.48);
  --gold:#c9942f; --sheet:#fff; --sheetTx:#1b2c47;
 }
 body{font-family:"Segoe UI","Helvetica Neue",Tahoma,Arial,sans-serif;color:var(--tx);
 background:var(--bg2);
 background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 48%,var(--bg3) 100%);
 background-attachment:fixed;padding:12px 12px 26px;transition:background 2.2s cubic-bezier(.4,0,.2,1)}
 #skyScene{position:fixed;top:0;left:0;right:0;height:60%;z-index:0;pointer-events:none;overflow:hidden}
.wrap{position:relative;z-index:1;width:100%;max-width:430px;margin:0 auto}
 button{font-family:inherit;cursor:pointer}

.top{width:100%;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.brandbox{padding-top:2px;order:1;margin-inline-end:auto}
.gearbtn{order:3}
.authBadge{order:2}
.wm-en{font-size:21px;font-weight:800;letter-spacing:2px;vertical-align:middle}
.wm-sep{font-size:19px;color:rgba(255,255,255,.68);margin:0 7px;vertical-align:middle}
.wm-ar{font-size:23px;font-weight:800;vertical-align:middle}
.gearbtn{flex:0 0 auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
 border-radius:12px;width:38px;height:38px;color:#fff;font-size:17px;cursor:pointer}

.locbar{width:100%;background:var(--card);border:1px solid var(--cardBd);
 border-radius:16px;padding:10px 12px;margin-bottom:11px}
.locbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.locname{font-size:16px;font-weight:800;min-width:0;flex:1 1 auto}
.locname small{display:block;font-weight:600;color:rgba(255,255,255,.78);font-size:11px}
.locbtns{flex:0 0 auto;white-space:nowrap}
.lbtn{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
 color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:7px 12px;margin-inline-start:6px}
.lbtn.gold{background:#e6b45e;color:#3a2405;border-color:#e6b45e}

.tabs{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px;font-size:0}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-block;font-size:13px;font-weight:700;color:rgba(255,255,255,.75);
 background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
 border-radius:99px;padding:8px 16px;margin-inline-end:6px}
.tab.on{background:#fff;color:#12203c;border-color:#fff}

 /* البطل */
.hero{text-align:center;padding:20px 12px 18px;border-radius:22px;
 min-height:290px;display:flex;flex-direction:column;justify-content:center;
 box-shadow:0 10px 32px rgba(0,0,0,.28)}
.hero .city{font-size:15px;font-weight:700;color:rgba(255,255,255,.82)}
.hero .city small{font-weight:600;color:rgba(255,255,255,.7);font-size:11px}
.hero .heroIcon svg{width:64px;height:64px;display:block;margin:4px auto 0}
 .hero .heroIconSmall{margin-top:2px}
 .hero .heroIconSmall svg{width:38px!important;height:38px!important;margin:2px auto 0!important}
.hero .big{font-size:96px;font-weight:200;line-height:1;letter-spacing:-5px;
 text-shadow:0 6px 26px rgba(0,0,0,.35)}
.hero .big sup{font-size:34px;font-weight:300;letter-spacing:0}
.hero .desc{font-size:15px;font-weight:700;color:rgba(255,255,255,.9);margin-top:2px}
.hero .hl{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.8);margin-top:3px}
.next{display:inline-block;margin-top:11px;background:rgba(255,255,255,.12);
 border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:8px 16px;
 font-size:12.5px;font-weight:700}
.next b{color:#ffd88a}

.strip6{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;font-size:0;padding:8px 0 10px}
.strip6::-webkit-scrollbar{display:none}
.h6{display:inline-block;text-align:center;width:60px;margin-inline-end:5px;
 background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:15px;padding:9px 0}
.h6 .hh{font-size:11px;font-weight:700;color:rgba(255,255,255,.78)}
.h6 svg{width:24px;height:24px;margin:4px auto;display:block}
.h6 .tt{font-size:14px;font-weight:800}
.h6 .pp{font-size:9.5px;font-weight:700;color:#9fd4f5}

.card{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);
 border-radius:20px;padding:13px 15px;margin-bottom:12px}
.stats{width:100%;font-size:0}
.stat{display:inline-block;width:19.2%;margin-inline-end:1%;text-align:center;
 background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 0}
.stat:last-child{margin-inline-end:0}
.stat .k{font-size:10.5px;color:rgba(255,255,255,.85);font-weight:700}
.stat .v{font-size:14px;font-weight:800;margin-top:3px}
.uvG{color:#7fe39a}.uvY{color:#ffdf6b}.uvO{color:#ffb45e}.uvR{color:#ff8a80}

.nlabel{display:inline-block;background:#e6b45e;color:#3a2405;font-size:13px;font-weight:800;
 padding:3px 16px;border-radius:99px;margin:0 6px -10px;position:relative;z-index:2}
.nafaf{background:#fff;color:#1b2c47;border-radius:18px;padding:18px 16px 15px;margin-bottom:11px}
.nafaf p{font-size:15px;line-height:1.85;font-weight:600}
.srcnote{font-size:10px;color:#8fa3b8;font-weight:700;margin-top:8px}

.askbox{width:100%;margin-bottom:11px}.askbox:after{content:"";display:table;clear:both}
.qin{float:right;width:73%;background:rgba(255,255,255,.95);border:0;border-radius:14px;color:#1b2c47;
 font-family:inherit;font-size:14px;font-weight:600;padding:13px 14px;outline:none}
.qin::placeholder{color:#93a6bb;font-weight:500}
.sendb{float:left;width:24%;border:0;background:#e6b45e;color:#3a2405;font-weight:800;font-size:14px;
 padding:13px 0;border-radius:14px}
.chips{font-size:0;margin-bottom:10px}
.chip{display:inline-block;font-size:12.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.1);
 border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:8px 13px;margin:0 0 7px 7px}
.ask-t{font-size:12px;font-weight:700;color:rgba(255,255,255,.7);margin:0 4px 8px}

.panel{display:none}.panel.on{display:block}
.sec-t{font-size:16px;font-weight:800;margin:4px 4px 2px}
.sec-s{font-size:11px;color:rgba(255,255,255,.78);font-weight:600;margin:0 4px 11px}

.row{position:relative;width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
 border-radius:18px;padding:14px 15px;margin-bottom:9px;overflow:hidden}
.row{display:flex;align-items:flex-start;gap:12px}
.row .ic{flex:0 0 44px;width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.1)}
.row .ic svg{width:24px;height:24px;display:block;margin:10px auto}
.row .tx{flex:1 1 auto;min-width:0}
.row .nm{font-size:14.5px;font-weight:800;line-height:1.4}
.row .sub{font-size:12px;font-weight:600;color:rgba(255,255,255,.8);line-height:1.55;margin-top:3px}
.row .bg{flex:0 0 auto;align-self:center;font-size:11px;font-weight:800;border-radius:99px;padding:5px 13px;border:1px solid;white-space:nowrap}
.bG{color:#7fe39a;background:rgba(127,227,154,.14);border-color:rgba(127,227,154,.45)}
.bO{color:#ffd166;background:rgba(255,209,102,.14);border-color:rgba(255,209,102,.45)}
.bB{color:#ff8f8f;background:rgba(255,143,143,.14);border-color:rgba(255,143,143,.45)}
.row .strip{position:absolute;top:0;bottom:0;inset-inline-start:0;width:4px}
.sG{background:#7fe39a}.sO{background:#ffd166}.sB{background:#ff8f8f}

.smart{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:18px;
 padding:14px 16px;margin-bottom:9px}
.smart .h{font-size:11.5px;font-weight:800;color:#e6b45e;margin-bottom:6px}
.smart .b{font-size:14px;line-height:1.75;font-weight:600}
.sk{background:rgba(255,255,255,.05);border-radius:18px;padding:16px;margin-bottom:9px;
 font-size:12px;color:rgba(255,255,255,.68);text-align:center}

 /* السلسلة */
.streak{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:18px;
 padding:13px 15px;margin-bottom:10px}
.streak{display:flex;align-items:flex-start;gap:12px}
.streak .num{flex:0 0 46px;width:46px;height:46px;border-radius:14px;background:rgba(230,180,94,.18);
 text-align:center;line-height:46px;font-size:19px;font-weight:800;color:#e6b45e}
.streak .tx{flex:1 1 auto;min-width:0}
.streak .t1{font-size:14px;font-weight:800}
.streak .t2{font-size:11.5px;color:rgba(255,255,255,.8);font-weight:500;line-height:1.5;margin-top:2px}

 /* القصة */
.story{border-radius:18px;padding:15px 16px;margin-bottom:9px;
 background:linear-gradient(135deg,rgba(230,180,94,.16),rgba(255,255,255,.05));
 border:1px solid rgba(230,180,94,.3)}
.story .h{font-size:11.5px;font-weight:800;color:#e6b45e;margin-bottom:7px}
.story .t{font-size:15px;font-weight:800;margin-bottom:5px}
.story .b{font-size:13.5px;line-height:1.8;font-weight:500;color:rgba(255,255,255,.85)}

 /* الأرقام القياسية */
.recs{font-size:0}
.rec{display:inline-block;width:49%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
 border-radius:14px;padding:11px 10px;margin:0 0 7px 2%;vertical-align:top}
.rec:nth-child(2n){margin-inline-start:0}
.rec .k{font-size:10.5px;color:rgba(255,255,255,.78);font-weight:700}
.rec .v{font-size:19px;font-weight:800;margin-top:2px}
.rec .d{font-size:9.5px;color:rgba(255,255,255,.68);font-weight:600;margin-top:1px}

.mrow{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
 border-radius:14px;padding:11px 14px;margin-bottom:7px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mrow .mn{font-size:13px;font-weight:800;min-width:0}
.mrow .mn small{display:block;font-size:10px;font-weight:600;color:rgba(255,255,255,.74)}
.mrow .mv{font-size:17px;font-weight:800;direction:ltr;white-space:nowrap}
.mrow .mv small{font-size:11px;color:rgba(255,255,255,.78);font-weight:700}

.hlist{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;font-size:0;padding-bottom:4px}
.hlist::-webkit-scrollbar{display:none}
.hitem{display:inline-block;text-align:center;background:rgba(255,255,255,.07);
 border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 0;width:66px;margin-inline-end:6px}
.hitem .h{font-size:11px;font-weight:700;color:rgba(255,255,255,.78)}
.hitem svg{width:26px;height:26px;margin:5px auto;display:block}
.hitem .t{font-size:14px;font-weight:800}
.hitem .p{font-size:10px;font-weight:700;color:#9fd4f5;margin-top:1px}
.drow{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
 border-radius:14px;padding:10px 13px;margin-bottom:7px}
.drow:after{content:"";display:table;clear:both}
.drow .d{float:right;font-size:13px;font-weight:800;width:34%}
.drow .dc{float:right;width:30%;text-align:center}
.drow .dc svg{width:24px;height:24px;vertical-align:middle}
.drow .dt{float:left;font-size:13px;font-weight:800;direction:ltr}
.drow .dt small{color:rgba(255,255,255,.74)}
.big2{width:100%;font-size:0}
.b2{display:inline-block;width:49%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
 border-radius:16px;padding:14px 8px;text-align:center;vertical-align:top}
.b2:first-child{margin-inline-end:2%}
.b2 .k{font-size:11px;font-weight:700;color:rgba(255,255,255,.78)}
.b2 .v{font-size:25px;font-weight:800;margin-top:4px}
.b2 .u{font-size:11px;font-weight:700;color:rgba(255,255,255,.7)}
.note{font-size:11.5px;color:rgba(255,255,255,.8);font-weight:600;margin-top:8px;line-height:1.6}

.foot{text-align:center;font-size:10.5px;color:rgba(255,255,255,.66);line-height:1.9;margin-top:16px;font-weight:600}
.loading{text-align:center;padding:34px 10px;color:rgba(255,255,255,.74);font-size:13px;font-weight:600}

.ov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(8,14,26,.75);z-index:50}
.ov.on{display:block}
.modal{position:absolute;left:5%;right:5%;top:7%;background:#fff;color:#1b2c47;border-radius:20px;
 padding:18px 16px;max-height:84%;overflow-y:auto}
.m-t{font-size:16px;font-weight:800;margin-bottom:12px}
.m-x{position:absolute;top:12px;left:14px;background:none;border:0;font-size:20px;color:#93a6bb}
.m-sec{font-size:12.5px;font-weight:800;color:#1b2c47;margin:16px 0 4px}
.m-hint{font-size:11px;color:#93a6bb;font-weight:600;margin-bottom:8px;line-height:1.5}
.opt{display:inline-block;font-size:13px;font-weight:700;color:#1b2c47;background:#eef3f8;
 border:1px solid #d8e2ec;border-radius:99px;padding:8px 15px;margin:0 0 7px 7px}
.opt.on{background:#e6b45e;border-color:#e6b45e;color:#3a2405}
.min{width:100%;background:#eef3f8;border:1px solid #d8e2ec;border-radius:12px;color:#1b2c47;
 font-family:inherit;font-size:14px;font-weight:600;padding:12px 13px;outline:none;margin-bottom:9px}
.sres{display:block;width:100%;text-align:start;background:#fff;border:0;border-bottom:1px solid #eaf0f6;
 font-size:14px;font-weight:700;color:#1b2c47;padding:11px 6px}
.sres small{display:block;font-size:11px;font-weight:600;color:#93a6bb}
.cityopt{display:inline-block;width:48%;font-size:13px;font-weight:700;text-align:center;color:#1b2c47;
 background:#eef3f8;border:1px solid #d8e2ec;border-radius:12px;padding:11px 0;margin:0 0 7px 2%}
.cityopt:nth-child(2n){margin-inline-start:0}
.ordrow{background:#eef3f8;border:1px solid #d8e2ec;border-radius:12px;padding:10px 12px;margin-bottom:6px}
.ordrow:after{content:"";display:table;clear:both}
.ordrow .on2{float:right;font-size:13px;font-weight:700;padding-top:4px}
.ordbtn{float:left;background:#fff;border:1px solid #d8e2ec;border-radius:8px;width:30px;height:28px;
 margin-inline-start:5px;font-size:14px;color:#1b2c47}
.danger{width:100%;background:#fff;border:1px solid #f3c9c9;color:#c94040;border-radius:12px;
 padding:12px;font-weight:700;font-size:13px;margin-top:14px}

 /* مشاهد */
.s-sun{position:absolute;top:-24px;left:-24px;width:104px;height:104px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,215,120,.55) 0%,rgba(255,196,74,.22) 48%,rgba(255,210,74,0) 72%)}
.anim .s-sun{animation:sunp 5s ease-in-out infinite}
 @keyframes sunp{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.1);opacity:1}}
.s-moon{position:absolute;top:-14px;left:-10px;width:76px;height:76px;border-radius:50%;
 background:radial-gradient(circle,rgba(200,220,255,.4) 0%,rgba(160,190,255,.14) 55%,rgba(0,0,0,0) 75%)}
.s-star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.6}
.anim .s-star{animation:tw 3s infinite}
 @keyframes tw{0%,100%{opacity:.25}50%{opacity:.95}}
.s-cl{position:absolute;background:rgba(255,255,255,.5);border-radius:99px}
.anim .s-cl{animation:cdr linear infinite}
.s-cl:before,.s-cl:after{content:"";position:absolute;background:inherit;border-radius:50%}
.c1{top:14px;width:72px;height:21px;animation-duration:30s}
.c1:before{width:29px;height:29px;top:-14px;left:12px}.c1:after{width:23px;height:23px;top:-10px;left:35px}
.c2{top:58px;width:54px;height:16px;animation-duration:42s;animation-delay:-18s;opacity:.6}
.c2:before{width:23px;height:23px;top:-11px;left:9px}.c2:after{width:18px;height:18px;top:-8px;left:27px}
.c3{top:34px;width:88px;height:25px;opacity:.42;filter:blur(1px)}
.c3:before{width:36px;height:36px;top:-17px;left:16px}.c3:after{width:28px;height:28px;top:-12px;left:46px}
 @keyframes cdr{from{transform:translateX(-160px)}to{transform:translateX(520px)}}
 @keyframes cdrRev{from{transform:translateX(520px)}to{transform:translateX(-160px)}}
.anim .s-cl.reverse{animation-name:cdrRev}
.s-drop{position:absolute;top:-25%;width:2px;height:20px;border-radius:99px;opacity:0;
 background:linear-gradient(to bottom,rgba(190,225,255,0),rgba(200,232,255,.95) 45%,rgba(190,225,255,.35))}
 .anim .s-drop{opacity:1;animation:rf linear infinite}
 @keyframes rf{0%{transform:translateY(0)}100%{transform:translateY(125vh)}}
 /* وقع القطرة على الأرض */
 .s-splash{position:absolute;bottom:0;width:14px;height:5px;border-radius:50%;
 border:1.4px solid rgba(200,232,255,.75);border-top-color:transparent;opacity:0;
 transform-origin:center bottom}
 .anim .s-splash{animation:splash ease-out infinite}
 @keyframes splash{
 0%{opacity:0;width:2px;height:1px;transform:translateY(2px)}
 22%{opacity:.9;width:9px;height:4px;transform:translateY(0)}
 100%{opacity:0;width:26px;height:9px;transform:translateY(-3px)}}
 /* ضباب رذاذي عند الغزارة */
 .s-mist{position:absolute;left:0;right:0;bottom:0;height:30%;pointer-events:none;
 background:linear-gradient(to top,rgba(190,225,255,.16),rgba(190,225,255,0))}
 .anim .s-mist{animation:mistPulse 3.5s ease-in-out infinite}
 @keyframes mistPulse{0%,100%{opacity:.5}50%{opacity:1}}
 /* ★ البرق — وميض عام من الأعلى */
 .s-flash{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;
 background:linear-gradient(to bottom,rgba(255,255,255,.95),rgba(214,232,255,.45) 35%,rgba(255,255,255,0) 70%);
 opacity:0}
 .anim .s-flash{animation:fl 7s infinite}
 @keyframes fl{
 0%,88%{opacity:0}
 89%{opacity:.55}90%{opacity:.08}
 91%{opacity:.75}92.5%{opacity:0}
 96%{opacity:.42}97%{opacity:0}
 100%{opacity:0}}
 /* شعاع البرق المتفرّع */
 .s-bolt{position:absolute;top:-4%;width:3px;height:46%;opacity:0;pointer-events:none;
 background:linear-gradient(to bottom,rgba(255,255,255,.98),rgba(190,225,255,.85) 55%,rgba(190,225,255,0));
 filter:drop-shadow(0 0 8px rgba(200,232,255,.9));
 transform-origin:top center}
 .s-bolt:before,.s-bolt:after{content:"";position:absolute;background:inherit;border-radius:99px}
 .s-bolt:before{top:32%;left:1px;width:2px;height:34%;transform:rotate(24deg);transform-origin:top}
 .s-bolt:after{top:56%;left:-1px;width:1.6px;height:26%;transform:rotate(-19deg);transform-origin:top}
 .blt1{left:22%;transform:rotate(9deg)}
 .blt2{left:68%;height:38%;transform:rotate(-11deg)}
 .anim .blt1{animation:bolt 7s infinite}
 .anim .blt2{animation:bolt 7s infinite .18s}
 @keyframes bolt{
 0%,88.6%{opacity:0}
 89%{opacity:1}89.8%{opacity:0}
 91%{opacity:.9}91.8%{opacity:0}
 100%{opacity:0}}
.s-dust{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(255,220,160,.7)}
.anim .s-dust{animation:df linear infinite}
 @keyframes df{from{transform:translate(-30px,0)}to{transform:translate(460px,-20px)}}
.s-fog{position:absolute;left:-10%;right:-10%;height:14px;border-radius:99px;background:rgba(255,255,255,.2)}
.anim .s-fog{animation:fg 10s ease-in-out infinite alternate}
 @keyframes fg{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.s-glow{position:absolute;bottom:-30%;left:-20%;right:-20%;height:70%;
 background:radial-gradient(ellipse at 50% 100%,rgba(255,168,88,.5) 0%,rgba(255,120,90,.22) 40%,rgba(255,120,90,0) 72%)}

 /* الرصد المباشر */
 #liveMap{width:100%;height:340px;border-radius:18px;background:#0d1a2e;overflow:hidden}
.leaflet-container{background:#0d1a2e}
.lyr{font-size:0;margin-bottom:9px}
.lbtn2{display:inline-block;font-size:12.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.09);
 border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:8px 14px;margin:0 0 6px 6px}
.lbtn2.on{background:#e6b45e;color:#3a2405;border-color:#e6b45e}
.tlbar{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
 border-radius:16px;padding:10px 13px;margin-top:9px}
.tlbar:after{content:"";display:table;clear:both}
.playb{float:right;width:38px;height:38px;border-radius:12px;border:0;background:#e6b45e;color:#3a2405;
 font-size:15px;font-weight:800;margin-inline-end:10px}
.tlwrap{float:right;width:calc(100% - 48px);padding-top:2px}
.tlt{font-size:12px;font-weight:800;margin-bottom:5px}
.tlt small{font-weight:600;color:rgba(255,255,255,.74);font-size:10.5px}
 input[type=range].tl{width:100%;height:4px;-webkit-appearance:none;appearance:none;
 background:rgba(255,255,255,.2);border-radius:99px;outline:none}
 input[type=range].tl::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
 border-radius:50%;background:#e6b45e;cursor:pointer}
.attr{font-size:9.5px;color:rgba(255,255,255,.68);font-weight:600;margin-top:8px;text-align:center;line-height:1.7}
.attr a{color:rgba(255,255,255,.78)}
.cov{background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.35);color:#ffd166;
 border-radius:14px;padding:11px 13px;font-size:11.5px;font-weight:600;line-height:1.6;margin-top:9px}

 /* موجز نفاف */
.brief{border-radius:20px;padding:16px 17px 14px;margin-bottom:12px;position:relative;overflow:hidden}
.brief.calm{background:linear-gradient(135deg,rgba(127,227,154,.14),rgba(255,255,255,.05));border:1px solid rgba(127,227,154,.3)}
.brief.mid{background:linear-gradient(135deg,rgba(255,209,102,.15),rgba(255,255,255,.05));border:1px solid rgba(255,209,102,.35)}
.brief.hot{background:linear-gradient(135deg,rgba(255,143,143,.16),rgba(255,255,255,.05));border:1px solid rgba(255,143,143,.4)}
.brief .bh{font-size:11px;font-weight:800;letter-spacing:.04em;color:rgba(255,255,255,.72);margin-bottom:7px}
.brief .bdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#e6b45e;margin-inline-end:6px;vertical-align:middle}
.anim .brief .bdot{animation:tw 2.4s infinite}
.brief .bt{font-size:17px;font-weight:800;line-height:1.5;margin-bottom:10px}
.brief .bi{font-size:13px;font-weight:600;line-height:1.75;color:rgba(255,255,255,.9);margin-bottom:4px}
.brief .bic{display:inline-block;width:18px;color:#e6b45e;font-weight:800}

 /* ماذا تغيّر */
.changes{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
 border-radius:18px;padding:13px 15px;margin-bottom:11px}
.ch-h{font-size:11.5px;font-weight:800;color:#9fd4f5;margin-bottom:8px}
.ch-h small{font-weight:600;color:rgba(255,255,255,.68)}
.chg{font-size:13px;font-weight:600;line-height:1.8;color:rgba(255,255,255,.92)}
.ci{display:inline-block;width:20px;font-weight:800;font-size:12px}
.ci.up{color:#ff8f8f}.ci.down{color:#7fe39a}.ci.wind{color:#9fd4f5}.ci.sky{color:#e6b45e}

 /* استقرار السماء */
.stab{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
 border-radius:18px;padding:13px 15px;margin-bottom:11px;cursor:pointer}
.stabRow{display:flex;align-items:flex-start;gap:13px}
.ring{flex:0 0 54px;width:54px;height:54px;border-radius:50%;border:3px solid #9fd4f5;
 text-align:center;line-height:50px}
.ring b{font-size:18px;font-weight:800}.ring small{font-size:10px;opacity:.7}
.stabTx{flex:1 1 auto;min-width:0;padding-top:3px}
.stabTx .s1{font-size:11.5px;font-weight:800;color:rgba(255,255,255,.78)}
.stabTx .s2{font-size:15px;font-weight:800;margin-top:1px}
.stabTx .s3{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.66);margin-top:3px}
.stabWhy{clear:both;margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.1)}
.wrow{font-size:12.5px;font-weight:600;line-height:1.9;color:rgba(255,255,255,.85)}
.wd{display:inline-block;width:34px;font-weight:800;font-size:11.5px}
.wnote{font-size:10.5px;color:rgba(255,255,255,.4);margin-top:7px;font-weight:600}

 /* ===== الأيقونة العائمة ===== */
.fab{position:fixed;bottom:22px;inset-inline-start:18px;z-index:40;width:60px;height:60px;
 border-radius:50%;border:0;background:linear-gradient(145deg,#f2c877,#d99a3d);
 box-shadow:0 10px 26px rgba(0,0,0,.42),0 0 0 0 rgba(230,180,94,.5);
 color:#3a2405;display:flex;align-items:center;justify-content:center;padding:0}
.fab svg{width:28px;height:28px}
.anim .fab{animation:fabPulse 3.2s ease-in-out infinite}
 @keyframes fabPulse{
 0%,100%{box-shadow:0 10px 26px rgba(0,0,0,.42),0 0 0 0 rgba(230,180,94,.45)}
 50%{box-shadow:0 10px 26px rgba(0,0,0,.42),0 0 0 14px rgba(230,180,94,0)}}
.fab:active{transform:scale(.93)}
.fabTip{position:fixed;bottom:34px;inset-inline-start:88px;z-index:39;
 background:rgba(20,32,52,.92);border:1px solid rgba(255,255,255,.16);
 border-radius:99px;padding:7px 14px;font-size:12px;font-weight:700;color:#fff;
 white-space:nowrap;opacity:0;transition:opacity .4s;pointer-events:none}
.fabTip.show{opacity:1}

 /* ===== لوحة الرصد ===== */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#12203c;
 border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));
 box-shadow:0 -14px 40px rgba(0,0,0,.5);transform:translateY(110%);transition:transform .34s cubic-bezier(.2,.9,.3,1);
 max-height:86%;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.sheetBack{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(6,12,22,.6);z-index:55}
.sheetBack.on{display:block}
.grab{width:42px;height:4px;border-radius:99px;background:rgba(255,255,255,.25);margin:0 auto 14px}
.sh-t{font-size:17px;font-weight:800;text-align:center}
.sh-s{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.74);text-align:center;margin:4px 0 15px;line-height:1.6}
.obs{font-size:0;text-align:center}
.ob{display:inline-block;width:31%;margin:0 1% 9px;background:rgba(255,255,255,.07);
 border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:14px 4px 11px;vertical-align:top}
.ob svg{width:30px;height:30px;display:block;margin:0 auto 6px}
.ob .on3{font-size:12px;font-weight:700}
.ob:active{background:rgba(230,180,94,.2);border-color:#e6b45e}
.ob.sel{background:rgba(230,180,94,.22);border-color:#e6b45e}
.verdict{background:#fff;color:#1b2c47;border-radius:18px;padding:16px;margin-top:12px;
 font-size:14px;font-weight:600;line-height:1.85}
.verdict b{color:#a06a12}
.vmatch{border-inline-start:5px solid #4ade80}
.vdiff{border-inline-start:5px solid #e6b45e}
.shbtn{width:100%;border:0;border-radius:15px;padding:14px;font-size:14px;font-weight:800;margin-top:10px}
.shbtn.gold{background:#e6b45e;color:#3a2405}
.shbtn.ghost{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);color:#fff}
.repBox{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
 border-radius:18px;padding:15px;margin-top:14px}
.repBox .rt{font-size:13.5px;font-weight:800;margin-bottom:5px}
.repBox .rs{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.78);line-height:1.7}
.fld{width:100%;background:rgba(255,255,255,.95);border:0;border-radius:12px;color:#1b2c47;
 font-family:inherit;font-size:14px;font-weight:600;padding:12px 13px;outline:none;margin-top:9px}
.fld::placeholder{color:#93a6bb;font-weight:500}
.pill{display:inline-block;font-size:11px;font-weight:800;border-radius:99px;padding:4px 11px;
 background:rgba(127,227,154,.16);color:#7fe39a;border:1px solid rgba(127,227,154,.4);margin-top:8px}
.pill.wait{background:rgba(255,209,102,.16);color:#ffd166;border-color:rgba(255,209,102,.4)}
.charter{font-size:11px;color:rgba(255,255,255,.74);line-height:1.85;font-weight:600;margin-top:10px}
.charter b{color:#ff8f8f}
.installBar{position:fixed;bottom:0;left:0;right:0;z-index:45;background:#16294a;
 border-top:1px solid rgba(255,255,255,.16);padding:12px 14px calc(12px + env(safe-area-inset-bottom));
 transform:translateY(120%);transition:transform .35s;display:flex;align-items:center;gap:8px}
.installBar.on{transform:translateY(0)}
.ib-t{flex:1;font-size:12.5px;font-weight:700;line-height:1.5}
.ib-y{border:0;background:#e6b45e;color:#3a2405;font-weight:800;font-size:13px;padding:10px 16px;border-radius:12px}
.ib-n{border:0;background:transparent;color:rgba(255,255,255,.7);font-weight:700;font-size:12.5px;padding:10px 6px}
.lgd{font-size:10px;font-weight:700;color:rgba(255,255,255,.82);margin-top:9px;text-align:center;line-height:2}
.lg{display:inline-block;width:16px;height:9px;border-radius:2px;margin:0 3px 0 7px;vertical-align:middle}
 /* في مثل هذا اليوم */
.onday{background:linear-gradient(140deg,rgba(159,212,245,.16),rgba(255,255,255,.05));
 border:1px solid rgba(159,212,245,.32);border-radius:18px;padding:15px 16px;margin-bottom:10px}
.od-h{font-size:11px;font-weight:800;color:#9fd4f5;letter-spacing:.03em;margin-bottom:7px}
.od-t{font-size:16px;font-weight:800;margin-bottom:6px;line-height:1.4}
.od-b{font-size:13.5px;line-height:1.85;font-weight:600;color:rgba(255,255,255,.9)}
.od-s{font-size:10px;font-weight:700;color:rgba(255,255,255,.5);margin-top:9px;
 padding-top:8px;border-top:1px solid rgba(255,255,255,.1)}
 /* ===== المستقبل المتحرك ===== */
.timeline{margin:10px 0 4px;padding:14px 15px 12px;border-radius:20px;
 background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.tl-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.tl-when{font-size:15px;font-weight:800;min-width:0}
.tl-when small{font-weight:600;color:rgba(255,255,255,.6);font-size:11px;display:block;margin-top:1px}
.tl-temp{font-size:30px;font-weight:300;line-height:1;letter-spacing:-1px;white-space:nowrap}
.tl-temp sup{font-size:14px;font-weight:400}
.tl-mid{width:100%;text-align:center;margin:2px 0 10px}
.tl-mid svg{width:44px;height:44px;display:inline-block;vertical-align:middle}
.tl-desc{font-size:12.5px;font-weight:700;color:rgba(255,255,255,.88);margin-top:3px}
.tl-slide{position:relative;padding-top:2px}
 input[type=range].tlr{width:100%;height:6px;-webkit-appearance:none;appearance:none;
 background:linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.12));
 border-radius:99px;outline:none;margin:0}
 input[type=range].tlr::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
 border-radius:50%;background:#e6b45e;border:3px solid #12203c;cursor:grab;
 box-shadow:0 2px 8px rgba(0,0,0,.4)}
 input[type=range].tlr::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
 background:#e6b45e;border:3px solid #12203c;cursor:grab}
.tl-marks{width:100%;margin-top:7px;font-size:0}
.tl-mk{display:inline-block;width:25%;text-align:center;font-size:10px;font-weight:700;
 color:rgba(255,255,255,.55)}
.tl-hint{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.5);text-align:center;margin-top:8px}
.tl-live{display:inline-block;font-size:9.5px;font-weight:800;color:#7fe39a;
 background:rgba(127,227,154,.16);border:1px solid rgba(127,227,154,.4);
 border-radius:99px;padding:2px 8px;margin-inline-start:6px;vertical-align:middle}
 /* رائحة الجو */
.smell{background:linear-gradient(135deg,rgba(159,212,245,.13),rgba(255,255,255,.04));
 border:1px solid rgba(159,212,245,.26);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.sm-h{font-size:11.5px;font-weight:800;color:#9fd4f5;margin-bottom:7px;letter-spacing:.02em}
.sm-b{font-size:13.5px;line-height:1.85;font-weight:600;color:rgba(255,255,255,.9)}
 /* ===== نافذة العالم ===== */
.worldGrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:4px}
.wcard{position:relative;height:176px;border-radius:20px;overflow:hidden;
 border:1px solid rgba(255,255,255,.16);background:#12203c;
 box-shadow:0 6px 18px rgba(0,0,0,.24);cursor:pointer;
 -webkit-user-select:none;user-select:none;
 transition:transform .22s cubic-bezier(.34,1.3,.5,1),box-shadow .22s}
.wcard:active{transform:scale(.97)}
.wcard.me{border-color:rgba(230,180,94,.65);box-shadow:0 6px 24px rgba(230,180,94,.2)}
.wcard.open{box-shadow:0 10px 28px rgba(0,0,0,.4)}
.wsky{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden}
 /* الأفق والمعالم */
.wland{position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none}
.wland svg{width:100%;height:100%;display:block}
.wover{position:absolute;left:0;right:0;bottom:0;padding:8px 11px 9px;
 background:linear-gradient(to top,rgba(6,11,22,.92) 30%,rgba(6,11,22,.35) 70%,rgba(6,11,22,0));
 pointer-events:none}
.wname{font-size:13px;font-weight:800;color:#fff;line-height:1.25}
.wname small{display:block;font-size:9px;font-weight:600;color:rgba(255,255,255,.6);margin-top:1px}
.wtemp{position:absolute;top:8px;inset-inline-end:11px;font-size:25px;font-weight:300;
 color:#fff;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.wtemp sup{font-size:11px;font-weight:400}
.wtime{position:absolute;top:10px;inset-inline-start:11px;font-size:9.5px;font-weight:700;
 color:rgba(255,255,255,.82);background:rgba(6,11,22,.45);border-radius:99px;padding:2px 8px}
.wcond{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.78);margin-top:2px}
 /* لوحة التفاصيل عند اللمس */
.wdet{position:absolute;left:0;right:0;bottom:0;top:0;background:rgba(6,11,22,.9);
 padding:12px;opacity:0;pointer-events:none;transition:opacity .25s}
.wcard.open .wdet{opacity:1;pointer-events:auto}
.wdet .dn{font-size:13px;font-weight:800;margin-bottom:8px}
.wdrow{font-size:11px;font-weight:600;color:rgba(255,255,255,.85);line-height:1.95;
 display:flex;justify-content:space-between;gap:6px}
.wdrow b{font-weight:800;color:#fff}
.wdclose{position:absolute;top:7px;inset-inline-end:9px;font-size:15px;color:rgba(255,255,255,.55)}
 /* عناصر السماء */
.wsun{position:absolute;width:40px;height:40px;border-radius:50%;margin:-20px 0 0 -20px;
 background:radial-gradient(circle,rgba(255,235,170,.95) 0%,rgba(255,205,90,.42) 42%,rgba(255,200,80,0) 72%)}
.wmoon{position:absolute;width:28px;height:28px;border-radius:50%;margin:-14px 0 0 -14px;
 background:radial-gradient(circle,rgba(222,234,255,.85) 0%,rgba(180,204,255,.25) 55%,rgba(0,0,0,0) 76%)}
.wstar{position:absolute;width:1.6px;height:1.6px;border-radius:50%;background:#fff}
.anim .wstar{animation:wtw 3.4s infinite}
 @keyframes wtw{0%,100%{opacity:.28}50%{opacity:.9}}
.wcl{position:absolute;background:rgba(255,255,255,.6);border-radius:99px}
.wcl:before,.wcl:after{content:"";position:absolute;background:inherit;border-radius:50%}
.anim .wcl{animation:wdrift linear infinite}
 @keyframes wdrift{from{transform:translateX(-80px)}to{transform:translateX(250px)}}
.wdrop{position:absolute;top:-14%;width:1.4px;height:12px;border-radius:2px;
 background:linear-gradient(rgba(198,228,255,.9),rgba(198,228,255,0))}
.anim .wdrop{animation:wfall linear infinite}
 @keyframes wfall{to{transform:translateY(190px)}}
.wdust{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,222,170,.7)}
.anim .wdust{animation:wdustfly linear infinite}
 @keyframes wdustfly{from{transform:translateX(-24px)}to{transform:translateX(220px)}}
.wfog{position:absolute;left:-8%;right:-8%;height:8px;border-radius:99px;background:rgba(255,255,255,.22)}
.wflash{position:absolute;top:0;left:0;right:0;bottom:0;background:#fff;opacity:0}
.anim .wflash{animation:wfl 7s infinite}
 @keyframes wfl{0%,94%,97%,100%{opacity:0}95%,96%{opacity:.18}}
 /* موجة اللمس */
.wripple{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.6);
 width:12px;height:12px;margin:-6px 0 0 -6px;pointer-events:none;opacity:.9;
 animation:wrip .65s ease-out forwards}
 @keyframes wrip{to{width:130px;height:130px;margin:-65px 0 0 -65px;opacity:0;border-width:1px}}
.wnote{font-size:10.5px;color:rgba(255,255,255,.6);font-weight:600;text-align:center;
 margin-top:2px;line-height:1.7}
.cinFlash{position:fixed;top:0;left:0;right:0;bottom:0;background:#eaf2ff;
 opacity:0;pointer-events:none;z-index:38;mix-blend-mode:screen}
.cinBox{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
 border-radius:14px;padding:12px 13px;margin-top:8px}
.cinWarn{font-size:10.5px;color:#ffd166;font-weight:700;line-height:1.7;margin-top:8px;
 background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.28);
 border-radius:10px;padding:9px 11px}
 /* سماء الليلة */
.astro{background:linear-gradient(140deg,rgba(124,140,220,.18),rgba(255,255,255,.04));
 border:1px solid rgba(150,165,235,.34);border-radius:18px;padding:15px 16px;margin-bottom:10px}
.as-h{font-size:11px;font-weight:800;color:#b9c4f5;margin-bottom:8px;letter-spacing:.02em}

function LI(){return LANG==='dial'?0:(LANG==='fus'?1:2);}
function starInfo(){var now=new Date(),arr=[],y,i;
 for(y=now.getFullYear()-1;y<=now.getFullYear()+1;y++)
 for(i=0;i<SEASONS.length;i++)arr.push({t:new Date(y,SEASONS[i].m-1,SEASONS[i].d),s:SEASONS[i]});
 arr.sort(function(a,b){return a.t-b.t;});
 var cur=arr[0],nxt=arr[1];
 for(i=0;i<arr.length;i++){if(arr[i].t<=now){cur=arr[i];nxt=arr[i+1]||arr[i];}}
 return {s:cur.s,dayIn:Math.floor((now-cur.t)/86400000)+1,next:nxt.s,toNext:Math.ceil((nxt.t-now)/86400000)};}
function starLine(){var i=starInfo(),L=LI(),nm=i.s.nm[L],mn=i.s.mn[L],nx=i.next.nm[L];
 if(i.dayIn<=3)return L===2?(nm+' began '+i.dayIn+' days ago. '+mn):('دخل '+nm+' قبل '+i.dayIn+' أيام. '+mn);
 if(i.toNext<=7)return L===2?('End of '+nm+' — '+nx+' in '+i.toNext+' days.'):('إحنا بآخر أيام '+nm+' و'+nx+' يدخل بعد '+i.toNext+' أيام.');
 return L===2?('Day '+i.dayIn+' of '+nm+'. '+mn):('إحنا باليوم '+i.dayIn+' من '+nm+'. '+mn);}

 [['rain_heavy','storm'],['الوادي يسيل والسما صاحية','سيل الوادي دون مطر فوقك','A dry sky, a flowing wadi'],

 [['dust'],['الغبار اللي عندك… مسافر','الغبار المسافر','Your dust has a passport'],

 [['dust'],['الغبار يعطي أحلى غروب','الغبار والغروب','Dust makes the best sunsets'],

 [['fog'],['الضباب سحابة نزلت لك','كيف يتكوّن الضباب','Fog is a cloud that came down'],

 [['clear','mild'],['أهلنا كانوا يقرون السما','قراءة النجوم','Reading the sky'],

 [['clear','mild','humid'],['نسمة البحر لها ساعة','نسيم البحر والبر','The sea breeze runs on a clock'],

 [['any'],['الموج مرآة الريح','الموج والرياح','Waves mirror the wind'],

 [['season:jawza','season:kulaybayn'],['ظفار تخالف الجميع','خريف ظفار','Dhofar breaks the rules'],

 [['storm','cloudy'],['السحابة تكبر أمام عينك','نمو السحب الركامية','Watch a cloud grow'],

 [['storm'],['عدّ بين البرق والرعد','قياس بُعد العاصفة','Count the seconds'],

 [['any'],['ليش رقمين للحرارة؟','الحرارة المحسوسة','Two temperatures, one day'],

 [['cloudy','any'],['الغيوم ما تحميك من الشمس','الغيوم والأشعة فوق البنفسجية','Clouds are not sunscreen'],

 [['any'],['ليش التوقعات تختلف؟','اختلاف نماذج التنبؤ','Why forecasts disagree'],
 ['كل مركز أرصاد يشغّل نموذجًا رياضيًا بمعادلاته. لما تتفق النماذج التوقع موثوق ولما تختلف معناها الجو نفسه متردّد — ونعرضه لك بتبويب المصادر.','يشغّل كل مركز نموذجًا مستقلًا؛ اتفاقها يرفع الثقة واختلافها يعني حالة غير مستقرة.','Each centre runs its own model. Agreement means confidence.']],
 [['humid'],['ليش النظارة تضبب؟','تضبّب النظارات','Why your glasses fog'],

 [['heat','humid'],['المدينة ما تبرد مثل البر','الجزيرة الحرارية','Cities stay warm'],
 ['الإسمنت والأسفلت يخزنون حرارة النهار ويطلقونها بالليل فتبقى المدينة أحرّ من محيطها بعد المغرب.','تختزن الأسطح الإسمنتية حرارة النهار وتطلقها ليلًا — الجزيرة الحرارية.','Concrete stores the day\'s heat and releases it after dark.']],
 [['any'],['الضغط الجوي… وش يعني؟','ماذا يعني الضغط الجوي؟','What pressure tells you'],
 ['الضغط المرتفع غالبًا هوا هابط وسما صافية والمنخفض هوا صاعد وسحب ومطر محتمل. المهم اتجاهه: نازل ولا طالع.','يرتبط الضغط المرتفع بالصفاء والمنخفض باحتمال المطر؛ والأهم اتجاه تغيّره.','High pressure means clear skies; low means cloud and rain. Watch the trend.']],
 [['any'],['وين إحنا من السنة؟','موقعنا من السنة','Where we are in the year'],

 [['dust'],['كم ريح تلزم لرفع الغبار؟','عتبة إثارة الغبار','How much wind lifts dust'],

function todayStory(){
 var st=W?stateOf(W):'any',sk='season:'+starInfo().s.k,pool=[],i;
 for(i=0;i<STORIES.length;i++){var wn=STORIES[i][0];
 if(wn.indexOf(st)>=0||wn.indexOf(sk)>=0)pool.push(STORIES[i]);}
 if(!pool.length)for(i=0;i<STORIES.length;i++)if(STORIES[i][0].indexOf('any')>=0)pool.push(STORIES[i]);
 if(!pool.length)return null;
 var now=new Date(),day=Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-new Date(2020,0,1))/86400000);
 var s=pool[day%pool.length],L=LI();
 return {t:s[1][L],b:s[2][L]};}

function stateOf(w){var c=w.weather_code,t=w.temperature_2m,f=w.apparent_temperature,rh=w.relative_humidity_2m,wd=w.wind_speed_10m;
 if(c===95||c===96||c===99)return"storm";
 if(c===65||c===82||c===67)return"rain_heavy";
 if(c===63||c===81||c===80)return"rain";
 if(c===51||c===53||c===55||c===56||c===57||c===61||c===66)return"rain_light";
 if(c===45||c===48)return"fog";
 if(c===3)return"cloudy";
 if(wd>=28&&rh<45&&c<=2)return"dust";
 if(f>=42||t>=43)return"heat";
 if(t>=32&&rh>=55)return"humid";
 if(t<=20)return"cool";
 if(c<=2&&t>=17&&t<=33)return"clear";
 return"mild";}

/* ============ السلسلة والأرقام ============ */
function dayKey(d){var x=d||new Date();return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();}

/* ============================================================
 خريطة السنة — سجل الأيام التي فُتح فيها التطبيق
 يُخزَّن كسلسلة أرقام أيام السنة (1-366) مفصولة بفاصلة
 مثال: "2026:5,6,7,12" أي أيام السنة الخامس والسادس...
 ============================================================ */
function dayOfYear(d){
 var x=d||new Date();
 var start=new Date(x.getFullYear(),0,0);
 return Math.floor((x-start)/86400000);
}
function yearMapLoad(){
 var raw=stGet('yearmap')||'';
 var yr=new Date().getFullYear();
 if(raw.indexOf(yr+':')!==0)return {year:yr,days:{}};
 var out={year:yr,days:{}};
 var list=raw.slice(String(yr).length+1).split(',');
 for(var i=0;i<list.length;i++){
 var n=parseInt(list[i],10);
 if(n>0)out.days[n]=1;
 }
 return out;
}
function yearMapMark(){
 var m=yearMapLoad();
 var d=dayOfYear();
 if(m.days[d])return m; /* مسجّل اليوم بالفعل */
 m.days[d]=1;
 var keys=Object.keys(m.days).map(Number).sort(function(a,b){return a-b;});
 stSet('yearmap',m.year+':'+keys.join(','));
 return m;
}
/* أطول سلسلة متصلة داخل الخريطة — لإبرازها بصريًا */
function yearMapStreaks(days){
 var keys=Object.keys(days).map(Number).sort(function(a,b){return a-b;});
 var runs=[],cur=[];
 for(var i=0;i<keys.length;i++){
 if(cur.length&&keys[i]===cur[cur.length-1]+1)cur.push(keys[i]);
 else {if(cur.length)runs.push(cur);cur=[keys[i]];}
 }
 if(cur.length)runs.push(cur);
 /* علّم الأيام التي تنتمي لسلسلة ٧ أيام فأكثر */
 var hot={};
 for(var j=0;j<runs.length;j++){
 if(runs[j].length>=7){for(var k=0;k<runs[j].length;k++)hot[runs[j][k]]=1;}
 }
 return hot;
}

var STREAK={cur:0,longest:0,total:0,msg:null};
function touchStreak(){
 yearMapMark();
 var today=dayKey(),last=stGet('st_last');
 var cur=parseInt(stGet('st_cur')||'0',10),longest=parseInt(stGet('st_long')||'0',10),total=parseInt(stGet('st_total')||'0',10);
 var restarted=false,newRec=false;
 if(last!==today){
 var y=dayKey(new Date(Date.now()-86400000));
 if(last===y)cur+=1;else if(!last)cur=1;else{cur=1;restarted=true;}
 total+=1;
 if(cur>longest){longest=cur;newRec=cur>=3;}
 stSet('st_last',today);stSet('st_cur',String(cur));stSet('st_long',String(longest));stSet('st_total',String(total));}
 STREAK={cur:cur,longest:longest,total:total,msg:null};
 var ms=[3,7,14,30,60,100,200,365];
 if(ms.indexOf(cur)>=0){
 if(cur===3)STREAK.msg=pick('ثلاثة أيام وأنت تطالع جوّك مع نفاف. صارت عادة.','ثلاثة أيام متتالية.','Three days in a row — a habit is forming.');
 else if(cur===7)STREAK.msg=pick('أسبوع كامل! نفاف صار من روتينك اليومي.','أسبوع كامل من المتابعة.','A full week with Nafaf.');
 else if(cur===30)STREAK.msg=pick('شهر كامل مع نفاف. تعرف جوّك أحسن من أغلب الناس.','شهر كامل من المتابعة.','A full month with Nafaf.');
 else if(cur===100)STREAK.msg=pick('مئة يوم! هذا مو متابعة طقس هذي علاقة.','مئة يوم من المتابعة.','100 days — that\'s a relationship.');
 else if(cur===365)STREAK.msg=pick('سنة كاملة مع نفاف. شفت كل المواسم بعينك.','سنة كاملة.','A full year — every season seen.');
 else STREAK.msg=pick(cur+' يومًا متتالية مع نفاف.',cur+' يومًا متتالية.',cur+' days in a row.');}
 else if(restarted&&longest>=5)STREAK.msg=pick('رجعت! نبدأ سلسلة جديدة — أطول واحدة عندك كانت '+longest+' يوم.','أهلًا بعودتك. أطول سلسلة: '+longest+' يومًا.','Welcome back — your longest run was '+longest+' days.');
 else if(newRec)STREAK.msg=pick('رقم جديد لك: '+cur+' يومًا متتالية.','رقم قياسي جديد: '+cur+' يومًا.','New personal best: '+cur+' days.');
}
var RECBROKEN=[];
/* ★ مفتاح السجل يحمل الموقع — وإلا اختلطت أرقام شناص بأرقام لندن
   ⚠️ نقرّب الإحداثيات لدرجة عشرية واحدة (~١١ كم) ليبقى المفتاح ثابتًا
      للمكان نفسه ولا يتشظّى مع كل حركة صغيرة للـGPS */
function locKey(){
 if(!CUR||CUR.lat==null)return 'x';
 return CUR.lat.toFixed(1)+','+CUR.lon.toFixed(1);
}
function rkey(base){return base+'@'+locKey();}
function logRecords(){
 if(!W)return;RECBROKEN=[];
 function chk(base,val,higher,label){
 var key=rkey(base);
 var raw=stGet(key),old=raw?JSON.parse(raw):null;
 var better=!old||(higher?val>old.v:val<old.v);
 if(better){stSet(key,JSON.stringify({v:val,d:dayKey(),c:CUR.n}));if(old)RECBROKEN.push(label);}}
 chk('rec_hot',W.temperature_2m,true,'hot');
 chk('rec_cold',W.temperature_2m,false,'cold');
 chk('rec_wind',W.wind_speed_10m,true,'wind');
 if(MARINE&&MARINE.wave_height!=null)chk('rec_wave',MARINE.wave_height,true,'wave');
 var st=stateOf(W),raining=(st.indexOf('rain')===0||st==='storm'),today=dayKey();
 var kLast=rkey('rec_lastrain'),kDry=rkey('rec_longdry'),kYr=rkey('rec_year'),kRd=rkey('rec_raindays');
 if(raining&&stGet(kLast)!==today){
 var lr=stGet(kLast);
 if(lr){var gap=Math.round((Date.now()-new Date(lr).getTime())/86400000);
 var lg=parseInt(stGet(kDry)||'0',10);if(gap>lg)stSet(kDry,String(gap));}
 stSet(kLast,new Date().toISOString());
 var yr=new Date().getFullYear();
 if(parseInt(stGet(kYr)||'0',10)!==yr){stSet(kYr,String(yr));stSet(kRd,'0');}
 stSet(kRd,String(parseInt(stGet(kRd)||'0',10)+1));}}
function recordLine(){
 if(!RECBROKEN.length||!W)return null;
 if(RECBROKEN.indexOf('hot')>=0)return pick('أحرّ يوم سجّلته معك: '+tconv(W.temperature_2m)+'°. رقم جديد.','أعلى حرارة سجّلتها معك: '+tconv(W.temperature_2m)+'°.','Hottest day logged with you: '+tconv(W.temperature_2m)+'°.');
 if(RECBROKEN.indexOf('cold')>=0)return pick('أبرد يوم سجّلته معك: '+tconv(W.temperature_2m)+'°. نعمة.','أدنى حرارة سجّلتها: '+tconv(W.temperature_2m)+'°.','Coldest day logged: '+tconv(W.temperature_2m)+'°.');
 if(RECBROKEN.indexOf('wind')>=0)return pick('أقوى رياح شفتها معك: '+wconv(W.wind_speed_10m)+' '+wlabel()+'.','أعلى سرعة رياح: '+wconv(W.wind_speed_10m)+' '+wlabel()+'.','Strongest wind logged: '+wconv(W.wind_speed_10m)+' '+wlabel()+'.');
 if(RECBROKEN.indexOf('wave')>=0)return pick('أعلى موج سجّلته: '+MARINE.wave_height.toFixed(1)+' متر.','أعلى موج مسجّل: '+MARINE.wave_height.toFixed(1)+' م.','Biggest wave logged: '+MARINE.wave_height.toFixed(1)+'m.');
 return null;}
function droughtLine(){
 var lr=stGet(rkey('rec_lastrain'));if(!lr)return null;
 var cur=Math.round((Date.now()-new Date(lr).getTime())/86400000);
 var lg=parseInt(stGet(rkey('rec_longdry'))||'0',10),rd=parseInt(stGet(rkey('rec_raindays'))||'0',10);
 if(cur===0)return lg>0?pick('نزل المطر اليوم! انكسر جفاف '+lg+' يوم.','هطل المطر اليوم بعد '+lg+' يومًا.','Rain today — breaking a '+lg+'-day dry spell.')
:pick('نزل المطر اليوم! يوم يستاهل يتسجّل.','هطل المطر اليوم.','It rained today.');
 var s=pick('آخر مطر شفته معي: قبل '+cur+' يوم.','آخر هطول مسجّل: قبل '+cur+' يومًا.','Last rain with me: '+cur+' days ago.');
 if(rd>0)s+=pick(' وأيام المطر هذي السنة: '+rd+'.',' وأيام الهطول هذا العام: '+rd+'.',' Rain days this year: '+rd+'.');
 return s;}

function computeNight(){
 if(!SUNRISE||!SUNSET){IS_NIGHT=false;IS_GOLDEN=false;return;}
 var now=new Date(),sr=new Date(SUNRISE),ss=new Date(SUNSET),Wd=40*60000;
 IS_NIGHT=(now<sr||now>ss);
 IS_GOLDEN=(Math.abs(now-sr)<=Wd)||(Math.abs(now-ss)<=Wd);}
function iconKey(st){var m=META[st]||META.clear||{iN:'moon',iD:'sun'};return IS_NIGHT?m.iN:m.iD;}
function iconForCode(c,night){
 if(c>=95)return"storm";if(c>=80)return"heavy";if(c>=61)return"rain";
 if(c===45||c===48)return"fog";if(c===3)return"cloud";
 if(c<=1)return night?"moon":"sun";return night?"partlyN":"partly";}
function hourIsNight(iso){if(!SUNRISE||!SUNSET)return false;
 var d=new Date(iso),sr=new Date(SUNRISE),ss=new Date(SUNSET);
 var m=d.getHours()*60+d.getMinutes();
 return m<(sr.getHours()*60+sr.getMinutes())||m>(ss.getHours()*60+ss.getMinutes());}

 var temp=W?W.temperature_2m:28;

  var dpr=window.devicePixelRatio||1;

/* ============================================================

   ⚠️ القاعدة: كل وقت يخص الطقس يمر من هنا لا من new Date()
      مباشرة — وإلا ظهر توقيت جهازك بدل توقيت المدينة المختارة.
   ⚠️ Open-Meteo يعيد الأوقات بتوقيت المدينة أصلًا (timezone=auto)
      لذا نقرأ الساعة من النص لا بتحويل كائن Date.
   ============================================================ */
var Clock={
 /* دقائق منتصف الليل بتوقيت المدينة */
 minutes:function(){
  var d=new Date();
  if(typeof TZ_OFF==='undefined'||TZ_OFF==null)return d.getHours()*60+d.getMinutes();
  var utcMs=d.getTime()+d.getTimezoneOffset()*60000;
  var c=new Date(utcMs+TZ_OFF*1000);
  return c.getHours()*60+c.getMinutes();
 },
 hour:function(){return Math.floor(Clock.minutes()/60);},
 minute:function(){return Clock.minutes()%60;},
 /* كائن Date يمثل "الآن" بتوقيت المدينة — للعرض فقط */
 now:function(){
  var d=new Date();
  if(typeof TZ_OFF==='undefined'||TZ_OFF==null)return d;
  return new Date(d.getTime()+d.getTimezoneOffset()*60000+TZ_OFF*1000);
 },
 /* ساعة نص ISO كما تعيده Open-Meteo — بتوقيت المدينة */
 isoHour:function(iso){
  var m=String(iso).match(/T(\d{2}):/);
  return m?parseInt(m[1],10):null;
 },
 isoMinutes:function(iso){
  var m=String(iso).match(/T(\d{2}):(\d{2})/);
  return m?(parseInt(m[1],10)*60+parseInt(m[2],10)):null;
 },
 /* تنسيق HH:MM من ISO بلا أي تحويل منطقة */
 fmt:function(iso){

  return m?m[1]:'';
 },
 /* اليوم بتوقيت المدينة */
 dayKey:function(){
  var c=Clock.now();

   String(c.getDate()).padStart(2,'0');
 },
 /* فهرس الساعة الحالية داخل مصفوفة HOURLY */
 hourIndex:function(){
  if(!HOURLY||!HOURLY.time)return 0;
  var nowM=Clock.minutes();
  for(var i=0;i<HOURLY.time.length;i++){
   var hm=Clock.isoMinutes(HOURLY.time[i]);
   if(hm!=null&&hm>=nowM)return i;
  }
  return 0;
 }
};

/* ★ دقائق منتصف الليل بتوقيت المدينة المختارة لا توقيت جهازك */
function cityMinutes(dt){
 var d=dt||new Date();
 if(TZ_OFF==null)return d.getHours()*60+d.getMinutes();
 var utcMs=d.getTime()+d.getTimezoneOffset()*60000;
 var c=new Date(utcMs+TZ_OFF*1000);
 return c.getHours()*60+c.getMinutes();
}
/* دقائق الشروق أو الغروب كما تعيدها Open-Meteo بتوقيت المدينة */
function sunMinutes(iso){
 if(!iso)return null;
 var m=String(iso).match(/T(\d{2}):(\d{2})/);
 if(!m)return null;
 return parseInt(m[1],10)*60+parseInt(m[2],10);
}
function nightFactor(dt){
 var nowM=cityMinutes(dt);
 var srM=sunMinutes(SUNRISE), ssM=sunMinutes(SUNSET);
 if(srM==null||ssM==null)return (nowM>=19*60||nowM<5*60)?1:0;
 var T=45;
 if(nowM<srM-T)return 1;
 if(nowM<srM+T)return 0.5-((nowM-srM)/(2*T));
 if(nowM<ssM-T)return 0;
 if(nowM<ssM+T)return 0.5+((nowM-ssM)/(2*T));

}
/* شدّة الذهبي: أقصاها عند لحظة الشروق/الغروب بالضبط */
function goldenFactor(dt){
 if(!SUNRISE||!SUNSET)return 0;
 var sr=new Date(SUNRISE),ss=new Date(SUNSET),T=50*60000;
 function at(base){var x=new Date(dt);x.setHours(base.getHours(),base.getMinutes(),0,0);return x;}
 var d1=Math.abs(dt-at(sr)),d2=Math.abs(dt-at(ss)),d=Math.min(d1,d2);
 if(d>T)return 0;
 return 1-(d/T);
}

}

/* ★ عدّاد الحرارة — كان يعدّ من الصفر في كل رسم فيومض الرقم

     • لا يتحرك إطلاقًا إن لم تتغيّر القيمة

var LAST_TEMP=null, TEMP_RAF=null;
function countUp(el,target){
 if(!el)return;
 target=Math.round(target);
 /* ★ نفس القيمة: اكتبها فورًا بلا حركة */
 /* ★ لو أُعيد بناء العنصر (يعرض —) اكتب القيمة فورًا حتى لو لم تتغيّر */
 if(LAST_TEMP===target){el.innerHTML=target+'<sup>°</sup>';return;}
 if(el.innerHTML.indexOf('—')>=0&&LAST_TEMP!=null){
  /* عنصر جديد بقيمة معروفة: اعرضها بلا حركة ثم تابع لو تغيّرت */
  el.innerHTML=LAST_TEMP+'<sup>°</sup>';
 }
 var from=(LAST_TEMP==null)?0:LAST_TEMP;
 LAST_TEMP=target;
 /* فرق ضئيل: انتقال فوري بلا وميض */
 if(Math.abs(target-from)<=1&&from!==0){el.innerHTML=target+'<sup>°</sup>';return;}
 if(TEMP_RAF){cancelAnimationFrame(TEMP_RAF);TEMP_RAF=null;}
 var mo=(typeof applyMotion==='function')?applyMotion():{scenery:true};
 if(!mo.scenery){el.innerHTML=target+'<sup>°</sup>';return;}
 var t0=null,dur=(from===0)?650:420;
 function step(ts){
  if(!t0)t0=ts;
  var p=Math.min((ts-t0)/dur,1),e=1-Math.pow(1-p,3);
  el.innerHTML=Math.round(from+(target-from)*e)+'<sup>°</sup>';
  if(p<1)TEMP_RAF=requestAnimationFrame(step); else TEMP_RAF=null;
 }
 TEMP_RAF=requestAnimationFrame(step);
}

var CHANGES=null;
function dirName(deg){
 if(deg==null)return null;
 var names=[['شمالية','شمالية','N'],['شمالية شرقية','شمالية شرقية','NE'],['شرقية','شرقية','E'],
 ['جنوبية شرقية','جنوبية شرقية','SE'],['جنوبية','جنوبية','S'],['جنوبية غربية','جنوبية غربية','SW'],

 var i=Math.round(((deg%360)/45))%8;
 return names[i][LI()];
}
function snapKey(){return 'snap_'+CUR.n;}
function computeChanges(){
 CHANGES=null;
 if(!W)return;
 var raw=stGet(snapKey());
 var now={t:W.temperature_2m,h:W.relative_humidity_2m,w:W.wind_speed_10m,
 d:W.wind_direction_10m,p:W.pressure_msl,c:stateOf(W),ts:Date.now()};
 stSet(snapKey(),JSON.stringify(now));
 if(!raw)return;
 var old;try{old=JSON.parse(raw);}catch(e){return;}
 var mins=Math.round((now.ts-old.ts)/60000);
 if(mins<25)return; /* لا نروي قصة عن ٥ دقائق */
 if(mins>60*36)return; /* ولا عن يوم ونصف */
 var out=[],dt=Math.round(now.t-old.t),dh=Math.round(now.h-old.h),dw=Math.round(now.w-old.w);
 if(Math.abs(dt)>=2)out.push({i:dt>0?'up':'down',
 t:pick((dt>0?'الحرارة طلعت ':'الحرارة نزلت ')+Math.abs(dt)+'°',
 (dt>0?'ارتفعت الحرارة ':'انخفضت الحرارة ')+Math.abs(dt)+'°',
 (dt>0?'Temperature rose ':'Temperature dropped ')+Math.abs(dt)+'°')});
 if(Math.abs(dh)>=8)out.push({i:dh>0?'up':'down',
 t:pick((dh>0?'الرطوبة زادت ':'الرطوبة نزلت ')+Math.abs(dh)+'٪',
 (dh>0?'ارتفعت الرطوبة ':'انخفضت الرطوبة ')+Math.abs(dh)+'٪',
 (dh>0?'Humidity up ':'Humidity down ')+Math.abs(dh)+'%')});
 if(Math.abs(dw)>=8)out.push({i:'wind',
 t:pick((dw>0?'الرياح اشتدّت ':'الرياح هدت ')+Math.abs(dw)+' '+wlabel(),
 (dw>0?'اشتدت الرياح ':'خفّت الرياح ')+Math.abs(dw)+' '+wlabel(),
 (dw>0?'Wind picked up ':'Wind eased ')+Math.abs(dw)+' '+wlabel())});
 if(old.d!=null&&now.d!=null){
 var dd=Math.abs(((now.d-old.d)+540)%360-180);
 if(dd>=60)out.push({i:'wind',t:pick('الرياح غيّرت اتجاهها — صارت '+dirName(now.d),
 'تغيّر اتجاه الرياح إلى '+dirName(now.d),'Wind shifted to '+dirName(now.d))});
 }
 if(old.p!=null&&now.p!=null){
 var dp=now.p-old.p;
 if(Math.abs(dp)>=2)out.push({i:dp>0?'up':'down',
 t:pick((dp>0?'الضغط طلع ':'الضغط نزل ')+Math.abs(dp).toFixed(0)+' hPa'+(dp<0?' — الجو يتحرّك':' — يميل للاستقرار'),
 (dp>0?'ارتفع الضغط ':'انخفض الضغط ')+Math.abs(dp).toFixed(0)+' hPa',
 (dp>0?'Pressure rose ':'Pressure fell ')+Math.abs(dp).toFixed(0)+' hPa')});
 }
 if(old.c!==now.c)out.push({i:'sky',t:pick('الحالة تغيّرت: من '+META[old.c].t[0]+' إلى '+META[now.c].t[0],

 if(!out.length)return;
 var since;
 if(mins<60)since=pick('من '+mins+' دقيقة','منذ '+mins+' دقيقة',mins+' min ago');
 else {var hrs=Math.round(mins/60);since=pick('من '+hrs+' ساعة','منذ '+hrs+' ساعة',hrs+'h ago');}
 CHANGES={since:since,items:out};

 (٢) استقرار السماء — مؤشر شفّاف لا "ذكاء اصطناعي" مزعوم

var STAB=null;
function computeStability(){
 STAB=null;if(!W)return;
 var score=100,why=[];
 /* أ) اتجاه الضغط — أقوى مؤشر */
 if(PTREND!=null){
 var a=Math.abs(PTREND);
 if(a>=3){score-=32;why.push({d:-32,t:pick('الضغط يتغيّر بسرعة ('+PTREND.toFixed(1)+' hPa/3س)','تغيّر سريع في الضغط','Pressure changing fast')});}
 else if(a>=1.5){score-=18;why.push({d:-18,t:pick('الضغط يتحرّك','تحرّك في الضغط','Pressure moving')});}
 else why.push({d:0,t:pick('الضغط ثابت','الضغط مستقر','Pressure steady')});
 }
 /* ب) اتفاق النماذج العالمية */
 if(MODELS&&MODELS.length>=2){
 var ts=MODELS.map(function(m){return m.t;});
 var sp=Math.max.apply(null,ts)-Math.min.apply(null,ts);
 if(sp>=3){score-=22;why.push({d:-22,t:pick('النماذج مختلفة '+Math.round(sp)+'°','تباين بين النماذج '+Math.round(sp)+'°','Models differ '+Math.round(sp)+'°')});}
 else if(sp>=1.5){score-=10;why.push({d:-10,t:pick('النماذج متقاربة','تقارب بين النماذج','Models close')});}
 else why.push({d:0,t:pick('النماذج متفقة تمامًا','اتفاق تام بين النماذج','Models fully agree')});
 }
 /* ج) تقلّب الحالة خلال ١٢ ساعة */
 if(HOURLY&&HOURLY.weather_code){
 var now=new Date(),si=-1,i;
 si=Clock.hourIndex();  /* ★ بتوقيت المدينة لا الجهاز */
 if(si>=0){var codes={},n=0;
 for(i=si;i<Math.min(si+12,HOURLY.time.length);i++){codes[HOURLY.weather_code[i]]=1;n++;}
 var uniq=Object.keys(codes).length;
 if(uniq>=4){score-=18;why.push({d:-18,t:pick('الحالة تتقلّب بالساعات الجاية','تقلّب متوقع في الحالة','Conditions shifting ahead')});}
 else if(uniq<=2)why.push({d:0,t:pick('الحالة ثابتة بالساعات الجاية','ثبات متوقع','Steady hours ahead')});}
 }
 /* د) تذبذب الرياح */
 if(HOURLY&&HOURLY.wind_speed_10m){
 var now2=new Date(),s2=-1,j;
 for(j=0;j<HOURLY.time.length;j++){if(new Date(HOURLY.time[j])>now2){s2=j;break;}}
 if(s2>=0){var mn=999,mx=0;
 for(j=s2;j<Math.min(s2+8,HOURLY.time.length);j++){var v=HOURLY.wind_speed_10m[j];if(v<mn)mn=v;if(v>mx)mx=v;}
 if(mx-mn>=20){score-=14;why.push({d:-14,t:pick('الرياح متذبذبة','تذبذب في الرياح','Wind fluctuating')});}}
 }
 /* هـ) حالة جوية نشطة الآن */
 var st=stateOf(W);
 if(st==='storm'){score-=20;why.push({d:-20,t:pick('سحب رعدية نشطة','نشاط رعدي','Active thunderclouds')});}
 else if(st==='dust'){score-=12;why.push({d:-12,t:pick('غبار عالق','غبار','Dust aloft')});}
 score=Math.max(5,Math.min(100,Math.round(score)));
 var verdict;
 if(score>=80)verdict=pick('السما مستقرة','الأجواء مستقرة','Sky is settled');
 else if(score>=55)verdict=pick('السما هادية بس فيها حركة','استقرار نسبي','Mostly settled');
 else if(score>=35)verdict=pick('السما متردّدة — ترقّب تغيّر','أجواء غير مستقرة','Unsettled — expect change');
 else verdict=pick('السما تستعد لتغيّر سريع','تغيّر سريع متوقع','Rapid change building');
 STAB={score:score,verdict:verdict,why:why};
}

/* ★ هدف الحرارة للمشي — يتكيّف مع مناخ الموقع */
function walkTarget(){
 if(!HOURLY||!HOURLY.apparent_temperature)return 26;
 var a=HOURLY.apparent_temperature,mn=1e9,mx=-1e9,i;
 for(i=0;i<Math.min(24,a.length);i++){
  if(a[i]==null)continue;
  if(a[i]<mn)mn=a[i]; if(a[i]>mx)mx=a[i];
 }
 if(mn>=1e9)return 26;
 var mid=(mn+mx)/2;
 /* نحصره بين ١٢ و٢٨ — لا نقترح حرًّا ولا صقيعًا كهدف */
 return Math.max(12,Math.min(28,mid));
}
function nafafBrief(){

 var out=[],now=new Date(),si=-1,i;
 si=Clock.hourIndex();  /* ★ بتوقيت المدينة لا الجهاز */

 var w0=W.wind_speed_10m,best=0,bt=null;
 for(i=si;i<lim;i++){var d=HOURLY.wind_speed_10m[i]-w0;if(d>best){best=d;bt=HOURLY.time[i];}}
 if(best>=10&&bt){
 var mins=Math.round((new Date(bt)-now)/60000);
 var when=mins<90?pick('بعد '+mins+' دقيقة','بعد '+mins+' دقيقة','in '+mins+' min')
:pick('حدود '+String(new Date(bt).getHours()).padStart(2,'0')+':00','قرابة '+String(new Date(bt).getHours()).padStart(2,'0')+':00','around '+String(new Date(bt).getHours()).padStart(2,'0')+':00');
 out.push({e:'wind',t:pick('الرياح تشتد '+when+' (+'+Math.round(best)+' '+wlabel()+')',
 'تشتد الرياح '+when,'Wind picks up '+when)});}
 }
 /* الإحساس: ذروة اليوم */
 if(HOURLY.apparent_temperature){
 var mx=-99,mt=null;
 for(i=si;i<lim;i++){if(HOURLY.apparent_temperature[i]>mx){mx=HOURLY.apparent_temperature[i];mt=HOURLY.time[i];}}
 if(mt&&mx>=W.apparent_temperature+2){
 out.push({e:'heat',t:pick('الإحساس بيوصل '+tconv(mx)+'° حدود '+String(new Date(mt).getHours()).padStart(2,'0')+':00',
 'تصل الحرارة المحسوسة '+tconv(mx)+'°','Feels-like peaks at '+tconv(mx)+'°')});}
 }
 /* أفضل وقت للمشي */
 if(HOURLY.apparent_temperature&&SUNSET){
 var ssH=new Date(SUNSET).getHours(),bestScore=1e9,bh=null;
 for(i=si;i<lim;i++){
 var hh=Clock.isoHour(HOURLY.time[i]);
 if(hh<15||hh>23)continue;
 var pr=HOURLY.precipitation_probability?(HOURLY.precipitation_probability[i]||0):0;
 /* ★ الهدف يتبع مناخ الموقع لا رقمًا عالميًا ثابتًا:
    ٢٦° مثالية بالخليج لكنها نادرة بريكيافيك — نأخذ منتصف مدى اليوم
    ونقيّده بنطاق راحة معقول عالميًا */
 var sc=Math.abs(HOURLY.apparent_temperature[i]-walkTarget())+pr*0.25;
 if(sc<bestScore){bestScore=sc;bh=HOURLY.time[i];}}
 if(bh){var d2=new Date(bh);

 var si=starInfo();c.season=si.s.nm[LI()];c.seasonDay=si.dayIn;
 if(DAYS_SINCE_RAIN!=null)c.drySpell=DAYS_SINCE_RAIN;
 /* من الخرائط المولّدة إن حُمّلت */
 if(SM_GRID&&SM_HOURS){

function peakAhead(key,hours){
 if(!HOURLY||!HOURLY[key])return null;
 var now=new Date(),si=-1,i;
 si=Clock.hourIndex();  /* ★ بتوقيت المدينة لا الجهاز */
 if(si<0)return null;
 var mx=-1e9,mt=null;
 for(i=si;i<Math.min(si+(hours||12),HOURLY.time.length);i++){
 var v=HOURLY[key][i];if(v!=null&&v>mx){mx=v;mt=HOURLY.time[i];}}
 return mt?{v:mx,t:mt}:null;
}
/* ★ يقرأ الوقت من نص ISO مباشرة — Open-Meteo يعيده بتوقيت المدينة 
   وتحويله بـnew Date() كان يزيحه لتوقيت جهاز المستخدم */
function hhmm(iso){
 var m=String(iso).match(/T(\d{2}:\d{2})/);
 if(m)return m[1];
 var d=new Date(iso);
 return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function hh00(iso){var d=new Date(iso);return String(d.getHours()).padStart(2,'0')+':00';}
