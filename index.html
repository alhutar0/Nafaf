<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<title>نفاف — Nafaf</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;min-height:100%}
  body{font-family:"Segoe UI","Helvetica Neue",Tahoma,Arial,sans-serif;color:#fff;
    background:#12203c;background:linear-gradient(180deg,#0d1a33 0%,#16294a 45%,#26406b 100%);
    background-attachment:fixed;padding:12px 12px 26px;transition:background 2.2s cubic-bezier(.4,0,.2,1)}
  #skyScene{position:fixed;top:0;left:0;right:0;height:60%;z-index:0;pointer-events:none;overflow:hidden}
  .wrap{position:relative;z-index:1;width:100%;max-width:430px;margin:0 auto}
  button{font-family:inherit;cursor:pointer}

  .top{width:100%;margin-bottom:9px}.top:after{content:"";display:table;clear:both}
  .brandbox{float:right;padding-top:4px}
  .wm-en{font-size:21px;font-weight:800;letter-spacing:2px;vertical-align:middle}
  .wm-sep{font-size:19px;color:rgba(255,255,255,.68);margin:0 7px;vertical-align:middle}
  .wm-ar{font-size:23px;font-weight:800;vertical-align:middle}
  .gearbtn{float:left;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
    border-radius:12px;width:38px;height:38px;color:#fff;font-size:17px}

  .locbar{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    border-radius:16px;padding:10px 12px;margin-bottom:11px}
  .locbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .locname{font-size:16px;font-weight:800;min-width:0;flex:1 1 auto}
  .locname small{display:block;font-weight:600;color:rgba(255,255,255,.78);font-size:11px}
  .locbtns{flex:0 0 auto;white-space:nowrap}
  .lbtn{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
    color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:7px 12px;margin-inline-start:6px}
  .lbtn.gold{background:#e6b45e;color:#3a2405;border-color:#e6b45e}

  .tabs{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px;font-size:0}
  .tabs::-webkit-scrollbar{display:none}
  .tab{display:inline-block;font-size:13px;font-weight:700;color:rgba(255,255,255,.75);
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
    border-radius:99px;padding:8px 16px;margin-inline-end:6px}
  .tab.on{background:#fff;color:#12203c;border-color:#fff}

  /* البطل */
  .hero{text-align:center;padding:14px 6px 4px}
  .hero .city{font-size:15px;font-weight:700;color:rgba(255,255,255,.82)}
  .hero .city small{font-weight:600;color:rgba(255,255,255,.7);font-size:11px}
  .hero .heroIcon svg{width:64px;height:64px;display:block;margin:4px auto 0}
  .hero .big{font-size:96px;font-weight:200;line-height:1;letter-spacing:-5px;
    text-shadow:0 6px 26px rgba(0,0,0,.35)}
  .hero .big sup{font-size:34px;font-weight:300;letter-spacing:0}
  .hero .desc{font-size:15px;font-weight:700;color:rgba(255,255,255,.9);margin-top:2px}
  .hero .hl{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.8);margin-top:3px}
  .next{display:inline-block;margin-top:11px;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:8px 16px;
    font-size:12.5px;font-weight:700}
  .next b{color:#ffd88a}

  .strip6{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;font-size:0;padding:8px 0 10px}
  .strip6::-webkit-scrollbar{display:none}
  .h6{display:inline-block;text-align:center;width:60px;margin-inline-end:5px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:15px;padding:9px 0}
  .h6 .hh{font-size:11px;font-weight:700;color:rgba(255,255,255,.78)}
  .h6 svg{width:24px;height:24px;margin:4px auto;display:block}
  .h6 .tt{font-size:14px;font-weight:800}
  .h6 .pp{font-size:9.5px;font-weight:700;color:#9fd4f5}

  .card{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);
    border-radius:20px;padding:13px 15px;margin-bottom:12px}
  .stats{width:100%;font-size:0}
  .stat{display:inline-block;width:19.2%;margin-inline-end:1%;text-align:center;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 0}
  .stat:last-child{margin-inline-end:0}
  .stat .k{font-size:10.5px;color:rgba(255,255,255,.85);font-weight:700}
  .stat .v{font-size:14px;font-weight:800;margin-top:3px}
  .uvG{color:#7fe39a}.uvY{color:#ffdf6b}.uvO{color:#ffb45e}.uvR{color:#ff8a80}

  .nlabel{display:inline-block;background:#e6b45e;color:#3a2405;font-size:13px;font-weight:800;
    padding:3px 16px;border-radius:99px;margin:0 6px -10px;position:relative;z-index:2}
  .nafaf{background:#fff;color:#1b2c47;border-radius:18px;padding:18px 16px 15px;margin-bottom:11px}
  .nafaf p{font-size:15px;line-height:1.85;font-weight:600}
  .srcnote{font-size:10px;color:#8fa3b8;font-weight:700;margin-top:8px}

  .askbox{width:100%;margin-bottom:11px}.askbox:after{content:"";display:table;clear:both}
  .qin{float:right;width:73%;background:rgba(255,255,255,.95);border:0;border-radius:14px;color:#1b2c47;
    font-family:inherit;font-size:14px;font-weight:600;padding:13px 14px;outline:none}
  .qin::placeholder{color:#93a6bb;font-weight:500}
  .sendb{float:left;width:24%;border:0;background:#e6b45e;color:#3a2405;font-weight:800;font-size:14px;
    padding:13px 0;border-radius:14px}
  .chips{font-size:0;margin-bottom:10px}
  .chip{display:inline-block;font-size:12.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:8px 13px;margin:0 0 7px 7px}
  .ask-t{font-size:12px;font-weight:700;color:rgba(255,255,255,.7);margin:0 4px 8px}

  .panel{display:none}.panel.on{display:block}
  .sec-t{font-size:16px;font-weight:800;margin:4px 4px 2px}
  .sec-s{font-size:11px;color:rgba(255,255,255,.78);font-weight:600;margin:0 4px 11px}

  .row{position:relative;width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
    border-radius:18px;padding:14px 15px;margin-bottom:9px;overflow:hidden}
  .row{display:flex;align-items:flex-start;gap:12px}
  .row .ic{flex:0 0 44px;width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.1)}
  .row .ic svg{width:24px;height:24px;display:block;margin:10px auto}
  .row .tx{flex:1 1 auto;min-width:0}
  .row .nm{font-size:14.5px;font-weight:800;line-height:1.4}
  .row .sub{font-size:12px;font-weight:600;color:rgba(255,255,255,.8);line-height:1.55;margin-top:3px}
  .row .bg{flex:0 0 auto;align-self:center;font-size:11px;font-weight:800;border-radius:99px;padding:5px 13px;border:1px solid;white-space:nowrap}
  .bG{color:#7fe39a;background:rgba(127,227,154,.14);border-color:rgba(127,227,154,.45)}
  .bO{color:#ffd166;background:rgba(255,209,102,.14);border-color:rgba(255,209,102,.45)}
  .bB{color:#ff8f8f;background:rgba(255,143,143,.14);border-color:rgba(255,143,143,.45)}
  .row .strip{position:absolute;top:0;bottom:0;inset-inline-start:0;width:4px}
  .sG{background:#7fe39a}.sO{background:#ffd166}.sB{background:#ff8f8f}

  .smart{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:18px;
    padding:14px 16px;margin-bottom:9px}
  .smart .h{font-size:11.5px;font-weight:800;color:#e6b45e;margin-bottom:6px}
  .smart .b{font-size:14px;line-height:1.75;font-weight:600}
  .sk{background:rgba(255,255,255,.05);border-radius:18px;padding:16px;margin-bottom:9px;
    font-size:12px;color:rgba(255,255,255,.68);text-align:center}

  /* السلسلة */
  .streak{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:18px;
    padding:13px 15px;margin-bottom:10px}
  .streak{display:flex;align-items:flex-start;gap:12px}
  .streak .num{flex:0 0 46px;width:46px;height:46px;border-radius:14px;background:rgba(230,180,94,.18);
    text-align:center;line-height:46px;font-size:19px;font-weight:800;color:#e6b45e}
  .streak .tx{flex:1 1 auto;min-width:0}
  .streak .t1{font-size:14px;font-weight:800}
  .streak .t2{font-size:11.5px;color:rgba(255,255,255,.8);font-weight:500;line-height:1.5;margin-top:2px}

  /* القصة */
  .story{border-radius:18px;padding:15px 16px;margin-bottom:9px;
    background:linear-gradient(135deg,rgba(230,180,94,.16),rgba(255,255,255,.05));
    border:1px solid rgba(230,180,94,.3)}
  .story .h{font-size:11.5px;font-weight:800;color:#e6b45e;margin-bottom:7px}
  .story .t{font-size:15px;font-weight:800;margin-bottom:5px}
  .story .b{font-size:13.5px;line-height:1.8;font-weight:500;color:rgba(255,255,255,.85)}

  /* الأرقام القياسية */
  .recs{font-size:0}
  .rec{display:inline-block;width:49%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
    border-radius:14px;padding:11px 10px;margin:0 0 7px 2%;vertical-align:top}
  .rec:nth-child(2n){margin-inline-start:0}
  .rec .k{font-size:10.5px;color:rgba(255,255,255,.78);font-weight:700}
  .rec .v{font-size:19px;font-weight:800;margin-top:2px}
  .rec .d{font-size:9.5px;color:rgba(255,255,255,.68);font-weight:600;margin-top:1px}

  .mrow{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
    border-radius:14px;padding:11px 14px;margin-bottom:7px}
  .mrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .mrow .mn{font-size:13px;font-weight:800;min-width:0}
  .mrow .mn small{display:block;font-size:10px;font-weight:600;color:rgba(255,255,255,.74)}
  .mrow .mv{font-size:17px;font-weight:800;direction:ltr;white-space:nowrap}
  .mrow .mv small{font-size:11px;color:rgba(255,255,255,.78);font-weight:700}

  .hlist{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;font-size:0;padding-bottom:4px}
  .hlist::-webkit-scrollbar{display:none}
  .hitem{display:inline-block;text-align:center;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 0;width:66px;margin-inline-end:6px}
  .hitem .h{font-size:11px;font-weight:700;color:rgba(255,255,255,.78)}
  .hitem svg{width:26px;height:26px;margin:5px auto;display:block}
  .hitem .t{font-size:14px;font-weight:800}
  .hitem .p{font-size:10px;font-weight:700;color:#9fd4f5;margin-top:1px}
  .drow{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
    border-radius:14px;padding:10px 13px;margin-bottom:7px}
  .drow:after{content:"";display:table;clear:both}
  .drow .d{float:right;font-size:13px;font-weight:800;width:34%}
  .drow .dc{float:right;width:30%;text-align:center}
  .drow .dc svg{width:24px;height:24px;vertical-align:middle}
  .drow .dt{float:left;font-size:13px;font-weight:800;direction:ltr}
  .drow .dt small{color:rgba(255,255,255,.74)}
  .big2{width:100%;font-size:0}
  .b2{display:inline-block;width:49%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
    border-radius:16px;padding:14px 8px;text-align:center;vertical-align:top}
  .b2:first-child{margin-inline-end:2%}
  .b2 .k{font-size:11px;font-weight:700;color:rgba(255,255,255,.78)}
  .b2 .v{font-size:25px;font-weight:800;margin-top:4px}
  .b2 .u{font-size:11px;font-weight:700;color:rgba(255,255,255,.7)}
  .note{font-size:11.5px;color:rgba(255,255,255,.8);font-weight:600;margin-top:8px;line-height:1.6}

  .foot{text-align:center;font-size:10.5px;color:rgba(255,255,255,.66);line-height:1.9;margin-top:16px;font-weight:600}
  .loading{text-align:center;padding:34px 10px;color:rgba(255,255,255,.74);font-size:13px;font-weight:600}

  .ov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(8,14,26,.75);z-index:50}
  .ov.on{display:block}
  .modal{position:absolute;left:5%;right:5%;top:7%;background:#fff;color:#1b2c47;border-radius:20px;
    padding:18px 16px;max-height:84%;overflow-y:auto}
  .m-t{font-size:16px;font-weight:800;margin-bottom:12px}
  .m-x{position:absolute;top:12px;left:14px;background:none;border:0;font-size:20px;color:#93a6bb}
  .m-sec{font-size:12.5px;font-weight:800;color:#1b2c47;margin:16px 0 4px}
  .m-hint{font-size:11px;color:#93a6bb;font-weight:600;margin-bottom:8px;line-height:1.5}
  .opt{display:inline-block;font-size:13px;font-weight:700;color:#1b2c47;background:#eef3f8;
    border:1px solid #d8e2ec;border-radius:99px;padding:8px 15px;margin:0 0 7px 7px}
  .opt.on{background:#e6b45e;border-color:#e6b45e;color:#3a2405}
  .min{width:100%;background:#eef3f8;border:1px solid #d8e2ec;border-radius:12px;color:#1b2c47;
    font-family:inherit;font-size:14px;font-weight:600;padding:12px 13px;outline:none;margin-bottom:9px}
  .sres{display:block;width:100%;text-align:start;background:#fff;border:0;border-bottom:1px solid #eaf0f6;
    font-size:14px;font-weight:700;color:#1b2c47;padding:11px 6px}
  .sres small{display:block;font-size:11px;font-weight:600;color:#93a6bb}
  .cityopt{display:inline-block;width:48%;font-size:13px;font-weight:700;text-align:center;color:#1b2c47;
    background:#eef3f8;border:1px solid #d8e2ec;border-radius:12px;padding:11px 0;margin:0 0 7px 2%}
  .cityopt:nth-child(2n){margin-inline-start:0}
  .ordrow{background:#eef3f8;border:1px solid #d8e2ec;border-radius:12px;padding:10px 12px;margin-bottom:6px}
  .ordrow:after{content:"";display:table;clear:both}
  .ordrow .on2{float:right;font-size:13px;font-weight:700;padding-top:4px}
  .ordbtn{float:left;background:#fff;border:1px solid #d8e2ec;border-radius:8px;width:30px;height:28px;
    margin-inline-start:5px;font-size:14px;color:#1b2c47}
  .danger{width:100%;background:#fff;border:1px solid #f3c9c9;color:#c94040;border-radius:12px;
    padding:12px;font-weight:700;font-size:13px;margin-top:14px}

  /* مشاهد */
  .s-sun{position:absolute;top:-24px;left:-24px;width:104px;height:104px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,215,120,.55) 0%,rgba(255,196,74,.22) 48%,rgba(255,210,74,0) 72%)}
  .anim .s-sun{animation:sunp 5s ease-in-out infinite}
  @keyframes sunp{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.1);opacity:1}}
  .s-moon{position:absolute;top:-14px;left:-10px;width:76px;height:76px;border-radius:50%;
    background:radial-gradient(circle,rgba(200,220,255,.4) 0%,rgba(160,190,255,.14) 55%,rgba(0,0,0,0) 75%)}
  .s-star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.6}
  .anim .s-star{animation:tw 3s infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:.95}}
  .s-cl{position:absolute;background:rgba(255,255,255,.5);border-radius:99px}
  .anim .s-cl{animation:cdr linear infinite}
  .s-cl:before,.s-cl:after{content:"";position:absolute;background:inherit;border-radius:50%}
  .c1{top:14px;width:72px;height:21px;animation-duration:30s}
  .c1:before{width:29px;height:29px;top:-14px;left:12px}.c1:after{width:23px;height:23px;top:-10px;left:35px}
  .c2{top:58px;width:54px;height:16px;animation-duration:42s;animation-delay:-18s;opacity:.6}
  .c2:before{width:23px;height:23px;top:-11px;left:9px}.c2:after{width:18px;height:18px;top:-8px;left:27px}
  .c3{top:34px;width:88px;height:25px;opacity:.42;filter:blur(1px)}
  .c3:before{width:36px;height:36px;top:-17px;left:16px}.c3:after{width:28px;height:28px;top:-12px;left:46px}
  @keyframes cdr{from{transform:translateX(-160px)}to{transform:translateX(520px)}}
  @keyframes cdrRev{from{transform:translateX(520px)}to{transform:translateX(-160px)}}
  .anim .s-cl.reverse{animation-name:cdrRev}
  .s-drop{position:absolute;top:-20%;width:2px;height:20px;border-radius:2px;opacity:0;
    background:linear-gradient(rgba(190,225,255,.9),rgba(190,225,255,0))}
  .anim .s-drop{opacity:1;animation:rf linear infinite}
  @keyframes rf{to{transform:translateY(240px)}}
  .s-splash{position:absolute;width:3px;height:3px;border-radius:50%;
    background:rgba(198,228,255,.7);opacity:0}
  .anim .s-splash{animation:splash 1.1s ease-out infinite}
  @keyframes splash{0%{opacity:0;transform:translateY(0) scale(.4)}
    18%{opacity:.85;transform:translateY(-9px) scale(1)}
    100%{opacity:0;transform:translateY(-16px) scale(.3)}}
  .s-flash{position:absolute;top:0;left:0;right:0;bottom:0;background:#fff;opacity:0}
  .anim .s-flash{animation:fl 6s infinite}
  @keyframes fl{0%,93%,97%,100%{opacity:0}94%,96%{opacity:.24}}

function dayKey(d){var x=d||new Date();return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();}
var STREAK={cur:0,longest:0,total:0,msg:null};
function touchStreak(){
 var today=dayKey(),last=stGet('st_last');
 var cur=parseInt(stGet('st_cur')||'0',10),longest=parseInt(stGet('st_long')||'0',10),total=parseInt(stGet('st_total')||'0',10);
 var restarted=false,newRec=false;
 if(last!==today){
  var y=dayKey(new Date(Date.now()-86400000));
  if(last===y)cur+=1;else if(!last)cur=1;else{cur=1;restarted=true;}
  total+=1;
  if(cur>longest){longest=cur;newRec=cur>=3;}
  stSet('st_last',today);stSet('st_cur',String(cur));stSet('st_long',String(longest));stSet('st_total',String(total));}
 STREAK={cur:cur,longest:longest,total:total,msg:null};
 var ms=[3,7,14,30,60,100,200,365];
 if(ms.indexOf(cur)>=0){
  if(cur===3)STREAK.msg=pick('ثلاثة أيام وأنت تطالع جوّك مع نفاف. صارت عادة.','ثلاثة أيام متتالية.','Three days in a row — a habit is forming.');
  else if(cur===7)STREAK.msg=pick('أسبوع كامل! نفاف صار من روتينك اليومي.','أسبوع كامل من المتابعة.','A full week with Nafaf.');
  else if(cur===30)STREAK.msg=pick('شهر كامل مع نفاف. تعرف جوّك أحسن من أغلب الناس.','شهر كامل من المتابعة.','A full month with Nafaf.');
  else if(cur===100)STREAK.msg=pick('مئة يوم! هذا مو متابعة طقس، هذي علاقة.','مئة يوم من المتابعة.','100 days — that\'s a relationship.');
  else if(cur===365)STREAK.msg=pick('سنة كاملة مع نفاف. شفت كل المواسم بعينك.','سنة كاملة.','A full year — every season seen.');
  else STREAK.msg=pick(cur+' يومًا متتالية مع نفاف.',cur+' يومًا متتالية.',cur+' days in a row.');}
 else if(restarted&&longest>=5)STREAK.msg=pick('رجعت! نبدأ سلسلة جديدة — أطول واحدة عندك كانت '+longest+' يوم.','أهلًا بعودتك. أطول سلسلة: '+longest+' يومًا.','Welcome back — your longest run was '+longest+' days.');
 else if(newRec)STREAK.msg=pick('رقم جديد لك: '+cur+' يومًا متتالية.','رقم قياسي جديد: '+cur+' يومًا.','New personal best: '+cur+' days.');
}
var RECBROKEN=[];
function logRecords(){
 if(!W)return;RECBROKEN=[];
 function chk(key,val,higher,label){
  var raw=stGet(key),old=raw?JSON.parse(raw):null;
  var better=!old||(higher?val>old.v:val<old.v);
  if(better){stSet(key,JSON.stringify({v:val,d:dayKey(),c:CUR.n}));if(old)RECBROKEN.push(label);}}
 chk('rec_hot',W.temperature_2m,true,'hot');
 chk('rec_cold',W.temperature_2m,false,'cold');
 chk('rec_wind',W.wind_speed_10m,true,'wind');
 if(MARINE&&MARINE.wave_height!=null)chk('rec_wave',MARINE.wave_height,true,'wave');
 var st=stateOf(W),raining=(st.indexOf('rain')===0||st==='storm'),today=dayKey();
 if(raining&&stGet('rec_lastrain')!==today){
  var lr=stGet('rec_lastrain');
  if(lr){var gap=Math.round((Date.now()-new Date(lr).getTime())/86400000);
   var lg=parseInt(stGet('rec_longdry')||'0',10);if(gap>lg)stSet('rec_longdry',String(gap));}
  stSet('rec_lastrain',new Date().toISOString());
  var yr=new Date().getFullYear();
  if(parseInt(stGet('rec_year')||'0',10)!==yr){stSet('rec_year',String(yr));stSet('rec_raindays','0');}
  stSet('rec_raindays',String(parseInt(stGet('rec_raindays')||'0',10)+1));}}
function recordLine(){
 if(!RECBROKEN.length||!W)return null;
 if(RECBROKEN.indexOf('hot')>=0)return pick('أحرّ يوم سجّلته معك: '+tconv(W.temperature_2m)+'°. رقم جديد.','أعلى حرارة سجّلتها معك: '+tconv(W.temperature_2m)+'°.','Hottest day logged with you: '+tconv(W.temperature_2m)+'°.');
 if(RECBROKEN.indexOf('cold')>=0)return pick('أبرد يوم سجّلته معك: '+tconv(W.temperature_2m)+'°. نعمة.','أدنى حرارة سجّلتها: '+tconv(W.temperature_2m)+'°.','Coldest day logged: '+tconv(W.temperature_2m)+'°.');
 if(RECBROKEN.indexOf('wind')>=0)return pick('أقوى رياح شفتها معك: '+wconv(W.wind_speed_10m)+' '+wlabel()+'.','أعلى سرعة رياح: '+wconv(W.wind_speed_10m)+' '+wlabel()+'.','Strongest wind logged: '+wconv(W.wind_speed_10m)+' '+wlabel()+'.');
 if(RECBROKEN.indexOf('wave')>=0)return pick('أعلى موج سجّلته: '+MARINE.wave_height.toFixed(1)+' متر.','أعلى موج مسجّل: '+MARINE.wave_height.toFixed(1)+' م.','Biggest wave logged: '+MARINE.wave_height.toFixed(1)+'m.');
 return null;}

 if(!SUNRISE||!SUNSET){IS_NIGHT=false;IS_GOLDEN=false;return;}
 var now=new Date(),sr=new Date(SUNRISE),ss=new Date(SUNSET),Wd=40*60000;
 IS_NIGHT=(now<sr||now>ss);
 IS_GOLDEN=(Math.abs(now-sr)<=Wd)||(Math.abs(now-ss)<=Wd);}

 return m<(sr.getHours()*60+sr.getMinutes())||m>(ss.getHours()*60+ss.getMinutes());}

 var mo=applyMotion();if(!mo.scenery)return'';
 var h="",i;

 if(["clear","mild","cloudy","rain","rain_light","rain_heavy","storm"].indexOf(st)>=0){

   h+='<div class="s-cl c3'+rev+'" style="animation-duration:'+(dur1*0.8).toFixed(1)+'s;animation-delay:-'+(dur1*0.3).toFixed(1)+'s"></div>';
 }
 /* ★ القطرات تتبع شدّة المطر الحقيقية بالملّيمتر */
 if(st==="rain_light"||st==="rain"||st==="rain_heavy"||st==="storm"){
  var mmNow=0;

   var nowH2=new Date().getHours();
   mmNow=HOURLY.precipitation[Math.min(nowH2,HOURLY.precipitation.length-1)]||0;
  }
  if(!mmNow&&DAILY&&DAILY.precipitation_sum)mmNow=(DAILY.precipitation_sum[0]||0)/12;
  /* عدد القطرات: من ٦ (رذاذ) إلى ٥٤ (وابل) */
  var base=st==="rain_light"?8:(st==="rain"?18:(st==="rain_heavy"?32:26));
  var n=Math.round(Math.max(6,Math.min(54,base+mmNow*7)));
  /* السرعة: كل ما زاد المطر أسرع */

  var opa=(0.55+Math.min(0.42,mmNow*0.07)).toFixed(2);

   var jitter=(Math.random()*2-1)*2.2;
   h+='<div class="s-drop" style="left:'+(2+i*(96/n)+jitter).toFixed(1)+'%;'+
     'width:'+wdt+'px;opacity:'+opa+';'+
     'height:'+(16+Math.min(14,mmNow*2.4)).toFixed(0)+'px;'+
     'animation-duration:'+(spd+Math.random()*0.3).toFixed(2)+'s;'+
     'animation-delay:'+(Math.random()*spd*1.6).toFixed(2)+'s"></div>';}

     'bottom:'+(Math.random()*14).toFixed(0)+'%;animation-delay:'+(Math.random()*1.4).toFixed(2)+'s"></div>';}
 }
 if(st==="storm")h+='<div class="s-flash"></div>';
 if(st==="dust")for(i=0;i<10;i++)h+='<div class="s-dust" style="top:'+(15+Math.random()*70)+'%;animation-duration:'+(2.5+Math.random()*3)+'s;animation-delay:'+(Math.random()*3)+'s"></div>';
 if(st==="fog")h+='<div class="s-fog" style="top:26%"></div><div class="s-fog" style="top:54%;animation-delay:-4s"></div><div class="s-fog" style="top:78%;animation-delay:-7s"></div>';

/* منحنى الليل: 0 = نهار كامل · 1 = ليل كامل — بانتقال ناعم عبر ٩٠ دقيقة حول الشروق والغروب */
function nightFactor(dt){
 if(!SUNRISE||!SUNSET)return (dt.getHours()>=19||dt.getHours()<5)?1:0;
 var sr=new Date(SUNRISE),ss=new Date(SUNSET),T=45*60000;   /* نصف نافذة الانتقال */
 function at(base){var x=new Date(dt);x.setHours(base.getHours(),base.getMinutes(),0,0);return x;}
 var srT=at(sr),ssT=at(ss);
 /* ⚠️ getTime() إلزامي — الجمع المباشر مع كائن Date يعطي دمج نصوص لا حسابًا */
 if(dt<srT.getTime()-T)return 1;                           /* قبل الفجر */
 if(dt<srT.getTime()+T)return 0.5-((dt-srT)/(2*T));        /* الشروق: ١ ← ٠ */
 if(dt<ssT.getTime()-T)return 0;                           /* النهار */
 if(dt<ssT.getTime()+T)return 0.5+((dt-ssT)/(2*T));        /* الغروب: ٠ ← ١ */
 return 1;                                                 /* الليل */
}
/* شدّة الذهبي: أقصاها عند لحظة الشروق/الغروب بالضبط */
function goldenFactor(dt){
 if(!SUNRISE||!SUNSET)return 0;
 var sr=new Date(SUNRISE),ss=new Date(SUNSET),T=50*60000;
 function at(base){var x=new Date(dt);x.setHours(base.getHours(),base.getMinutes(),0,0);return x;}
 var d1=Math.abs(dt-at(sr)),d2=Math.abs(dt-at(ss)),d=Math.min(d1,d2);
 if(d>T)return 0;
 return 1-(d/T);
}
/* تدرّج السماء الكامل — مزج نهار/ليل/ذهبي بلا قفزات */
function skyStops(st,dt){
 var m=META[st],n=nightFactor(dt),gf=goldenFactor(dt),out=[],i;
 var gold=["#3a2140","#8c4a3e","#e08a4a"];
 for(i=0;i<3;i++){
  var c=mixHex(m.gD[i],m.gN[i],Math.max(0,Math.min(1,n)));   /* نهار ← ليل */
  if(gf>0)c=mixHex(c,gold[i],gf*0.85);                        /* ثم الذهبي */
  out.push(c);
 }
 return out;
}

var STAB=null;
function computeStability(){
 STAB=null;if(!W)return;
 var score=100,why=[];
 /* أ) اتجاه الضغط — أقوى مؤشر */
 if(PTREND!=null){
  var a=Math.abs(PTREND);
  if(a>=3){score-=32;why.push({d:-32,t:pick('الضغط يتغيّر بسرعة ('+PTREND.toFixed(1)+' hPa/3س)','تغيّر سريع في الضغط','Pressure changing fast')});}
  else if(a>=1.5){score-=18;why.push({d:-18,t:pick('الضغط يتحرّك','تحرّك في الضغط','Pressure moving')});}
  else why.push({d:0,t:pick('الضغط ثابت','الضغط مستقر','Pressure steady')});
 }
 /* ب) اتفاق النماذج العالمية */
 if(MODELS&&MODELS.length>=2){
  var ts=MODELS.map(function(m){return m.t;});
  var sp=Math.max.apply(null,ts)-Math.min.apply(null,ts);
  if(sp>=3){score-=22;why.push({d:-22,t:pick('النماذج مختلفة '+Math.round(sp)+'°','تباين بين النماذج '+Math.round(sp)+'°','Models differ '+Math.round(sp)+'°')});}
  else if(sp>=1.5){score-=10;why.push({d:-10,t:pick('النماذج متقاربة','تقارب بين النماذج','Models close')});}
  else why.push({d:0,t:pick('النماذج متفقة تمامًا','اتفاق تام بين النماذج','Models fully agree')});
 }
 /* ج) تقلّب الحالة خلال ١٢ ساعة */
 if(HOURLY&&HOURLY.weather_code){
  var now=new Date(),si=-1,i;
  for(i=0;i<HOURLY.time.length;i++){if(new Date(HOURLY.time[i])>now){si=i;break;}}
  if(si>=0){var codes={},n=0;
   for(i=si;i<Math.min(si+12,HOURLY.time.length);i++){codes[HOURLY.weather_code[i]]=1;n++;}
   var uniq=Object.keys(codes).length;
   if(uniq>=4){score-=18;why.push({d:-18,t:pick('الحالة تتقلّب بالساعات الجاية','تقلّب متوقع في الحالة','Conditions shifting ahead')});}
   else if(uniq<=2)why.push({d:0,t:pick('الحالة ثابتة بالساعات الجاية','ثبات متوقع','Steady hours ahead')});}
 }
 /* د) تذبذب الرياح */
 if(HOURLY&&HOURLY.wind_speed_10m){
  var now2=new Date(),s2=-1,j;

  if(s2>=0){var mn=999,mx=0;
   for(j=s2;j<Math.min(s2+8,HOURLY.time.length);j++){var v=HOURLY.wind_speed_10m[j];if(v<mn)mn=v;if(v>mx)mx=v;}
   if(mx-mn>=20){score-=14;why.push({d:-14,t:pick('الرياح متذبذبة','تذبذب في الرياح','Wind fluctuating')});}}
 }
 /* هـ) حالة جوية نشطة الآن */

 else if(st==='dust'){score-=12;why.push({d:-12,t:pick('غبار عالق','غبار','Dust aloft')});}
 score=Math.max(5,Math.min(100,Math.round(score)));
 var verdict;
 if(score>=80)verdict=pick('السما مستقرة','الأجواء مستقرة','Sky is settled');

 var col=STAB.score>=80?'#7fe39a':(STAB.score>=55?'#9fd4f5':(STAB.score>=35?'#ffd166':'#ff8f8f'));

  '<div class="s3">'+(STAB_OPEN?pick('إخفاء التفصيل','إخفاء التفصيل','Hide detail'):pick('اضغط لترى مما حُسب','اضغط لعرض التفاصيل',"Tap to see how it is computed"))+'</div></div></div>';
 if(STAB_OPEN){h+='<div class="stabWhy">';

  h+='<div class="wnote">'+pick('مؤشر محسوب من بياناتك — لا تخمين.','مؤشر محسوب من البيانات المتاحة.','Computed from your live data — no guesswork.')+'</div></div>';}
 return h+'</div>';
}

/* ============================================================
   (٣) موجز نفاف — استنتاجات لا أرقام خام
   ============================================================ */
function nafafBrief(){
 if(!W||!HOURLY)return null;
 var out=[],now=new Date(),si=-1,i;
 for(i=0;i<HOURLY.time.length;i++){if(new Date(HOURLY.time[i])>now){si=i;break;}}
 if(si<0)return null;
 var lim=Math.min(si+14,HOURLY.time.length);

 /* الرياح: متى تشتد؟ */
 if(HOURLY.wind_speed_10m){
  var w0=W.wind_speed_10m,best=0,bt=null;
  for(i=si;i<lim;i++){var d=HOURLY.wind_speed_10m[i]-w0;if(d>best){best=d;bt=HOURLY.time[i];}}
  if(best>=10&&bt){
   var mins=Math.round((new Date(bt)-now)/60000);
   var when=mins<90?pick('بعد '+mins+' دقيقة','بعد '+mins+' دقيقة','in '+mins+' min')
     :pick('حدود '+String(new Date(bt).getHours()).padStart(2,'0')+':00','قرابة '+String(new Date(bt).getHours()).padStart(2,'0')+':00','around '+String(new Date(bt).getHours()).padStart(2,'0')+':00');
   out.push({e:'wind',t:pick('الرياح تشتد '+when+' (+'+Math.round(best)+' '+wlabel()+')',
     'تشتد الرياح '+when,'Wind picks up '+when)});}
 }
 /* الإحساس: ذروة اليوم */
 if(HOURLY.apparent_temperature){
  var mx=-99,mt=null;
  for(i=si;i<lim;i++){if(HOURLY.apparent_temperature[i]>mx){mx=HOURLY.apparent_temperature[i];mt=HOURLY.time[i];}}
  if(mt&&mx>=W.apparent_temperature+2){
   out.push({e:'heat',t:pick('الإحساس بيوصل '+tconv(mx)+'° حدود '+String(new Date(mt).getHours()).padStart(2,'0')+':00',
     'تصل الحرارة المحسوسة '+tconv(mx)+'°','Feels-like peaks at '+tconv(mx)+'°')});}
 }
 /* أفضل وقت للمشي */
 if(HOURLY.apparent_temperature&&SUNSET){
  var ssH=new Date(SUNSET).getHours(),bestScore=1e9,bh=null;
  for(i=si;i<lim;i++){
   var hh=new Date(HOURLY.time[i]).getHours();
   if(hh<15||hh>23)continue;
   var pr=HOURLY.precipitation_probability?(HOURLY.precipitation_probability[i]||0):0;
   var sc=Math.abs(HOURLY.apparent_temperature[i]-26)+pr*0.25;
   if(sc<bestScore){bestScore=sc;bh=HOURLY.time[i];}}
  if(bh){var d2=new Date(bh);
   out.push({e:'walk',t:pick('أحسن وقت للمشي حدود '+String(d2.getHours()).padStart(2,'0')+':'+String(d2.getMinutes()).padStart(2,'0'),
     'أنسب وقت للمشي قرابة '+String(d2.getHours()).padStart(2,'0')+':00',
     'Best walk window around '+String(d2.getHours()).padStart(2,'0')+':00')});}
 }
 /* الغروب للتصوير */
 var st=stateOf(W);
 if(SUNSET&&new Date(SUNSET)>now){
  var q=(st==='cloudy'||st==='rain_light'||st==='storm')?'great':(st==='dust'?'odd':'plain');
  var ss2=new Date(SUNSET),sst=String(ss2.getHours()).padStart(2,'0')+':'+String(ss2.getMinutes()).padStart(2,'0');
  out.push({e:'photo',t:q==='great'?pick('الغروب اليوم يستاهل تصوير — الغيوم بتلوّنه ('+sst+')','غروب مميّز للتصوير ('+sst+')','Great sunset for photos ('+sst+')')
   :q==='odd'?pick('الغبار بيعطي الغروب لونًا غريبًا ('+sst+')','غروب بألوان غبارية ('+sst+')','Dusty sunset tones ('+sst+')')
   :pick('غروب صافي بسيط ('+sst+')','غروب صافٍ ('+sst+')','Clear, plain sunset ('+sst+')')});
 }
 /* بصمة نفاف: الموسم النجمي */
 var si2=starInfo();
 out.push({e:'star',t:pick('واليوم اليوم '+si2.dayIn+' من '+si2.s.nm[0]+'.',
   'اليوم هو اليوم '+si2.dayIn+' من موسم '+si2.s.nm[1]+'.',
   'Day '+si2.dayIn+' of '+si2.s.nm[2]+'.')});

 /* العنوان — من شدّة الحالة */
 var severe=(st==='storm'||st==='rain_heavy'||st==='dust'||W.apparent_temperature>=44);
 var notable=(st==='rain'||st==='rain_light'||st==='fog'||(STAB&&STAB.score<45));
 var head,tone;
 if(severe){tone='hot';head=pick('اليوم مو يوم عادي.','اليوم ليس يومًا عاديًا.',"Today isn't an ordinary day.");}
 else if(notable){tone='mid';head=pick('اليوم فيه شي يستاهل الانتباه.','اليوم يستحق الانتباه.','Something worth noticing today.');}
 else {tone='calm';head=pick('اليوم يمشي حاله.','يومٌ هادئ.','A quiet, easy day.');}
 return {head:head,tone:tone,items:out.slice(0,5)};
}
var BRIEF_ICONS={wind:'≋',heat:'◉',walk:'⇢',photo:'◱',star:'✦'};
function briefCard(){
 var b=nafafBrief();if(!b)return '';
 var h='<div class="brief '+b.tone+'"><div class="bh"><span class="bdot"></span>'+
  pick('موجز نفاف','موجز نفاف','Nafaf brief')+'</div><div class="bt">'+b.head+'</div>',i;
 for(i=0;i<b.items.length;i++)
  h+='<div class="bi"><span class="bic">'+(BRIEF_ICONS[b.items[i].e]||'•')+'</span>'+b.items[i].t+'</div>';
 return h+'</div>';
}


/* ============================================================
   دماغ نفاف — يجمع كل طبقات البيانات ويجيب منها
   يقرأ: الطقس الآن · الساعات · الأيام · الضغط واتجاهه · البحر ·
         جودة الهواء · UV · النماذج العالمية · الاستقرار · الموسم النجمي ·
         خرائط الأمطار والرياح والعواصف المولّدة · طبقة الأقمار المعروضة.
   ============================================================ */
function nafafContext(){
 var c={},st=W?stateOf(W):null;
 c.city=CUR.n; c.country=CUR.c;
 if(W){c.temp=Math.round(W.temperature_2m);c.feels=Math.round(W.apparent_temperature);
  c.hum=Math.round(W.relative_humidity_2m);c.wind=Math.round(W.wind_speed_10m);
  c.dir=W.wind_direction_10m;c.state=st;c.stateName=META[st].t[LI()];}
 if(GUSTS!=null)c.gusts=Math.round(GUSTS);
 if(PRESS!=null){c.press=Math.round(PRESS);c.ptrend=PTREND;}
 if(UVv!=null)c.uv=Math.round(UVv);
 if(PMv!=null)c.pm=Math.round(PMv);
 if(MARINE&&MARINE.wave_height!=null){c.wave=MARINE.wave_height;c.sst=MARINE.sea_surface_temperature;}
 if(DAILY&&DAILY.temperature_2m_max){c.hi=Math.round(DAILY.temperature_2m_max[0]);c.lo=Math.round(DAILY.temperature_2m_min[0]);}
 c.rain6=rainNext6();
 c.night=IS_NIGHT;c.golden=IS_GOLDEN;
 if(SUNRISE)c.sunrise=SUNRISE;if(SUNSET)c.sunset=SUNSET;
 if(STAB)c.stability=STAB.score;
 if(MODEL_NOTE)c.models=MODEL_NOTE;
 if(MODELS&&MODELS.length){var t=MODELS.map(function(m){return m.t;});
  c.modelSpread=Math.round(Math.max.apply(null,t)-Math.min.apply(null,t));}
 var si=starInfo();c.season=si.s.nm[LI()];c.seasonDay=si.dayIn;
 if(DAYS_SINCE_RAIN!=null)c.drySpell=DAYS_SINCE_RAIN;
 /* من الخرائط المولّدة إن حُمّلت */
 if(SM_GRID&&SM_HOURS){
  var mx=0,i;for(i=0;i<SM_GRID.length;i++){var r=smRisk(SM_GRID[i].c?SM_GRID[i].c[SM_STEP]:null,
    SM_GRID[i].p?SM_GRID[i].p[SM_STEP]:null);if(r>mx)mx=r;}
  c.stormPeak=mx;}
 if(WM_GRID&&WM_HOURS){
  var mw=0,j;for(j=0;j<WM_GRID.length;j++){var v=WM_GRID[j].s?WM_GRID[j].s[WM_STEP]:0;if(v>mw)mw=v;}
  c.regionWindMax=Math.round(mw);}
 c.satLayer=LKIND;
 return c;
}

/* أقصى قيمة قادمة في الساعات */
function peakAhead(key,hours){
 if(!HOURLY||!HOURLY[key])return null;
 var now=new Date(),si=-1,i;
 for(i=0;i<HOURLY.time.length;i++){if(new Date(HOURLY.time[i])>now){si=i;break;}}
 if(si<0)return null;
 var mx=-1e9,mt=null;
 for(i=si;i<Math.min(si+(hours||12),HOURLY.time.length);i++){
  var v=HOURLY[key][i];if(v!=null&&v>mx){mx=v;mt=HOURLY.time[i];}}
 return mt?{v:mx,t:mt}:null;
}
function hhmm(iso){var d=new Date(iso);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function hh00(iso){var d=new Date(iso);return String(d.getHours()).padStart(2,'0')+':00';}

/* محرّك الإجابة — يفهم النية ويجيب من السياق الكامل */
function nafafAnswer(q){
 var c=nafafContext(),t=(q||'').toLowerCase(),L=LI();
 function A(d,f,e){return L===0?d:(L===1?f:e);}
 if(!W)return A('لحظة، لسا ما وصلتني بياناتك.','لم تصل البيانات بعد.','Data not loaded yet.');

 var has=function(list){for(var i=0;i<list.length;i++)if(t.indexOf(list[i])>=0)return true;return false;};

 /* ===== البحر ===== */
 if(has(['بحر','صيد','موج','قارب','sea','fish','wave','boat'])){
  if(c.wave==null)return A('ما وصلتني بيانات الموج لموقعك — غالبًا داخلي. جرّب مدينة ساحلية.',
   'لا تتوفر بيانات بحرية لهذا الموقع.','No marine data here — try a coastal city.');
  var s1=A('الموج الحين '+c.wave.toFixed(1)+' متر','ارتفاع الموج '+c.wave.toFixed(1)+' م','Waves are '+c.wave.toFixed(1)+'m');
  var s2=c.wave<0.6?A('، البحر رايق ويمدح.','، البحر هادئ.', ' — calm and inviting.')
    :c.wave<1.25?A('، مقبول للعارفين.','، مقبول لذوي الخبرة.',' — moderate, for the experienced.')
    :A('، البحر هايج — خلّها ليوم أهدى.','، البحر هائج — يُفضّل التأجيل.',' — rough. Wait for a calmer day.');
  var extra='';
  if(c.sst!=null)extra+=A(' حرارة الماء '+tconv(c.sst)+'°.',' حرارة سطح البحر '+tconv(c.sst)+'°.',' Sea temp '+tconv(c.sst)+'°.');
  if(c.wind>=25)extra+=A(' والرياح '+wconv(c.wind)+' '+wlabel()+' — ترفع الموج أكثر بعد شوي.',
    ' والرياح '+wconv(c.wind)+' '+wlabel()+'.',' Wind at '+wconv(c.wind)+' '+wlabel()+' may build it further.');
  if(c.stormPeak&&c.stormPeak>=40)extra+=A(' وخريطة العواصف تبيّن نشاطًا بالمنطقة — خذ حذرك.',
    ' وتشير خريطة العواصف إلى نشاط في المنطقة.',' Storm map shows activity in the region.');
  return s1+s2+extra;
 }

 /* ===== أين ينزل المطر الآن ===== */
 if(has(['وين','أين','مناطق','منطقة','ولاية','ولايات','نازل','ينزل','where','which area'])&&
    has(['مطر','امطار','أمطار','هطول','نازل','rain'])){
  if(!WATCH){watchLoad(true);return A('لحظة أمسح المناطق…','جارٍ المسح…','Scanning regions…');}
  if(WATCH.wet.length){
   var o4='',k4,L4=LI();
   for(k4=0;k4<Math.min(5,WATCH.wet.length);k4++){
    var it4=WATCH.wet[k4];
    o4+=(k4?'، ':'')+(L4===2?it4.s.en:it4.s.n)+' '+it4.mm.toFixed(1)+'ملم';}
   return A('نازل مطر الحين على: '+o4+'. (حسب النماذج العالمية لا الرادار)',
     'يهطل المطر حاليًا على: '+o4+'. وفق نماذج التنبؤ.',
     'Rain now over: '+o4+'. (Global models, not radar.)');}
  if(WATCH.soon.length){
   var s4=WATCH.soon[0];
   return A('ما في مطر نازل الحين، بس '+s4.s.n+' احتمالها '+s4.p+'٪ بالساعات الجاية.',
     'لا هطول حاليًا؛ أعلى احتمال في '+s4.s.n+' بنسبة '+s4.p+'٪.',
     'No rain now — highest chance is '+s4.s.en+' at '+s4.p+'%.');}
  return A('ما في أمطار مرصودة بالمنطقة الحين.','لا أمطار في المنطقة حاليًا.','No rain across the region right now.');}

 /* ===== المطر ===== */
 if(has(['مطر','تمطر','امطار','أمطار','هطول','rain','shower'])){
  var pk=peakAhead('precipitation_probability',12);
  var base;
  if(c.rain6>=50)base=A('احتمال المطر عالي — '+c.rain6+'٪ بالساعات الست الجاية.',
   'احتمال الهطول '+c.rain6+'٪ خلال ست ساعات.','High chance — '+c.rain6+'% in the next 6 hours.');
  else if(c.rain6>=20)base=A('فيه احتمال '+c.rain6+'٪ بالساعات الجاية — مو مؤكّد.',
   'احتمال '+c.rain6+'٪ خلال الساعات القادمة.','About '+c.rain6+'% in the coming hours.');
  else base=A('احتمال المطر ضعيف — '+c.rain6+'٪ بس.','احتمال ضعيف: '+c.rain6+'٪.','Low — just '+c.rain6+'%.');
  if(pk&&pk.v>=40)base+=A(' الذروة حدود '+hh00(pk.t)+' ('+Math.round(pk.v)+'٪).',
   ' الذروة قرابة '+hh00(pk.t)+'.',' Peak around '+hh00(pk.t)+'.');
  if(c.drySpell!=null&&c.drySpell>20)base+=A(' وآخر مطر بالمنطقة قبل '+c.drySpell+' يوم.',
   ' آخر هطول قبل '+c.drySpell+' يومًا.',' Last rain was '+c.drySpell+' days ago.');
  if(c.models)base+=' '+c.models;
  return base;
 }

 /* ===== الرياح ===== */
 if(has(['ريح','رياح','هوا','هبوب','wind','gust','breeze'])){
  var w1=A('الرياح '+wconv(c.wind)+' '+wlabel(),'سرعة الرياح '+wconv(c.wind)+' '+wlabel(),'Wind is '+wconv(c.wind)+' '+wlabel());
  if(c.dir!=null)w1+=A(' '+dirName(c.dir),' '+dirName(c.dir),' from '+dirName(c.dir));
  if(c.gusts&&c.gusts>c.wind+8)w1+=A('، والهبّات توصل '+wconv(c.gusts)+'.','، والهبّات '+wconv(c.gusts)+'.',', gusting to '+wconv(c.gusts)+'.');
  var pw=peakAhead('wind_speed_10m',12);
  if(pw&&pw.v>=c.wind+8)w1+=A(' وتشتد حدود '+hh00(pw.t)+' إلى '+wconv(pw.v)+'.',
   ' وتشتد قرابة '+hh00(pw.t)+'.',' Picking up to '+wconv(pw.v)+' by '+hh00(pw.t)+'.');
  if(c.regionWindMax)w1+=A(' وأقوى رياح بالمنطقة على الخريطة '+wconv(c.regionWindMax)+'.',
   ' أقصى رياح إقليمية '+wconv(c.regionWindMax)+'.',' Regional max '+wconv(c.regionWindMax)+'.');
  return w1;
 }

 /* ===== العواصف والبرق ===== */
 if(has(['عاصفة','عواصف','رعد','برق','رعدية','storm','thunder','lightning'])){
  var r='';
  if(c.state==='storm')r=A('عندك نشاط رعدي الحين — السحاب يثوّر.','نشاط رعدي حالي.','Active thunderclouds right now.');
  else if(c.stormPeak&&c.stormPeak>=50)r=A('خريطة العواصف تبيّن نشاطًا قويًا بالمنطقة ('+c.stormPeak+'٪).',
   'يشير مؤشر النشاط الرعدي إلى '+c.stormPeak+'٪.','Storm map shows '+c.stormPeak+'% convective activity nearby.');
  else if(c.stormPeak&&c.stormPeak>=20)r=A('فيه نشاط خفيف بالمنطقة ('+c.stormPeak+'٪).',
   'نشاط رعدي خفيف ('+c.stormPeak+'٪).','Some activity nearby ('+c.stormPeak+'%).');
  else r=A('ما في نشاط رعدي يذكر عندك الحين.','لا نشاط رعدي حاليًا.','No notable convective activity.');
  if(c.ptrend!=null&&c.ptrend<=-1.5)r+=A(' والضغط نازل — الجو يتحرّك.',' الضغط في انخفاض.',' Pressure is falling — things are shifting.');
  if(c.stability!=null)r+=A(' استقرار السما '+c.stability+'٪.',' مؤشر الاستقرار '+c.stability+'٪.',' Sky stability '+c.stability+'%.');
  return r;
 }

 /* ===== الغبار ===== */
 if(has(['غبار','عيار','رؤية','dust','haze','visibility'])){
  if(c.state==='dust')return A('غبار عالق الحين والرياح '+wconv(c.wind)+' '+wlabel()+'. سدّ شبابيكك واسحب غسيلك. جرّب طبقة «كشف الغبار» بالرصد المباشر تشوفه بعينك.',
   'غبار حالي مع رياح '+wconv(c.wind)+'. يُنصح بإغلاق النوافذ.','Dust aloft with '+wconv(c.wind)+' winds. Try the Dust detection layer.');
  if(c.wind>=25)return A('الرياح '+wconv(c.wind)+' — قريبة من عتبة إثارة الغبار. راقبها.',
   'الرياح قريبة من عتبة إثارة الغبار.','Winds near the dust-lifting threshold.');
  var air=c.pm!=null?A(' وجودة الهواء '+(c.pm>75?'سيّئة':c.pm>50?'متوسطة':c.pm>25?'مقبولة':'جيدة')+'.',
   ' جودة الهواء '+(c.pm>50?'متوسطة':'جيدة')+'.',' Air quality is '+(c.pm>50?'fair':'good')+'.'):'';
  return A('ما في غبار يذكر عندك الحين.','لا غبار حاليًا.','No notable dust right now.')+air;
 }

 /* ===== المعدّل الرسمي والشذوذ ===== */
 if(has(['معدل','معدّل','المعدل','طبيعي','عادي','رسمي','محطة','إحصاء','average','normal','official','station'])){
  var an=anomalyInfo();
  if(!an)return A('المعدّلات الرسمية عندي لعُمان بس — موقعك برّه تغطيتها.',
   'المعدّلات الرسمية متاحة لعُمان فقط.','Official normals cover Oman only.');
  var moN=MONTHS_AR[new Date().getMonth()],dd=Math.round(an.diff*10)/10;
  var cmp=Math.abs(dd)<1.5?A('يعني اليوم على معدّله.','أي أنه ضمن المعدّل.','so today is on average.')
   :(dd>0?A('يعني أحرّ بـ'+Math.abs(dd)+' درجة.','أي أعلى بـ'+Math.abs(dd)+' درجة.','so '+Math.abs(dd)+'° warmer.')
        :A('يعني أبرد بـ'+Math.abs(dd)+' درجة.','أي أدنى بـ'+Math.abs(dd)+' درجة.','so '+Math.abs(dd)+'° cooler.'));

/* هل التاريخ اليوم يوافق حدثًا؟ */
function todayEvents(){
 var now=new Date(),m=now.getMonth()+1,d=now.getDate(),i,exact=[],near=[];
 for(i=0;i<ARCHIVE.length;i++){
  var e=ARCHIVE[i];
  if(e.m!==m)continue;
  var end=e.d2||e.d;
  if(d>=e.d&&d<=end)exact.push(e);
  else if(Math.abs(d-e.d)<=3||Math.abs(d-end)<=3)near.push(e);
 }
 return {exact:exact,near:near};
}

/* مقارنة مطر اليوم بمعدّل سنوي معروف — يبني الإحساس بالحجم */
function rainScaleLine(){
 if(!DAILY||!DAILY.precipitation_sum)return null;
 var today=DAILY.precipitation_sum[0];
 if(today==null||today<3)return null;
 var pct=Math.round(today/52*100);   /* معدّل جدة السنوي ٥٢ ملم — مرجع خليجي معروف */
 if(pct<15)return null;
 return pick('نزل عندك اليوم '+today.toFixed(1)+' ملم — هذا '+pct+'٪ من معدّل جدة السنوي كامل (٥٢ ملم).',

}


/* ============================================================
   المستقبل المتحرك — الزمن يتحرك، لا أرقام
   يسحب المستخدم إصبعه فتتغيّر السماء والحرارة والألوان أمامه.
   كل ما يُعرض من بيانات حقيقية للساعة المختارة.
   ============================================================ */
var TL_OFFSET=0;         /* ساعات من الآن */
var TL_MAX=23;
var TL_TOUCHED=false;

/* بيانات الساعة المختارة */
function tlData(off){
 if(!HOURLY||!W)return null;
 if(off<=0)return {temp:W.temperature_2m,code:W.weather_code,wind:W.wind_speed_10m,
   hum:W.relative_humidity_2m,feels:W.apparent_temperature,pr:0,time:new Date(),live:true};
 var now=new Date(),si=-1,i;
 for(i=0;i<HOURLY.time.length;i++){if(new Date(HOURLY.time[i])>now){si=i;break;}}
 if(si<0)return null;
 var idx=Math.min(si+off-1,HOURLY.time.length-1);
 return {temp:HOURLY.temperature_2m[idx],code:HOURLY.weather_code[idx],
   wind:HOURLY.wind_speed_10m?HOURLY.wind_speed_10m[idx]:W.wind_speed_10m,
   hum:W.relative_humidity_2m,
   feels:HOURLY.apparent_temperature?HOURLY.apparent_temperature[idx]:HOURLY.temperature_2m[idx],
   pr:HOURLY.precipitation_probability?(HOURLY.precipitation_probability[idx]||0):0,
   time:new Date(HOURLY.time[idx]),live:false};
}

/* اشتقاق الحالة من كود الساعة (لا من الحالة الحالية) */
function tlState(d){
 if(!d)return 'mild';
 var c=d.code,t=d.temp,f=d.feels,rh=d.hum,wd=d.wind;
 if(c===95||c===96||c===99)return"storm";
 if(c===65||c===82||c===67)return"rain_heavy";
 if(c===63||c===81||c===80)return"rain";
 if(c===51||c===53||c===55||c===56||c===57||c===61||c===66)return"rain_light";
 if(c===45||c===48)return"fog";
 if(c===3)return"cloudy";
 if(wd>=28&&rh<45&&c<=2)return"dust";
 if(f>=42||t>=43)return"heat";
 if(t>=32&&rh>=55)return"humid";
 if(t<=20)return"cool";
 if(c<=2&&t>=17&&t<=33)return"clear";
 return"mild";
}

/* هل الساعة المختارة ليلًا؟ */
function tlIsNight(dt){
 if(!SUNRISE||!SUNSET)return dt.getHours()>=19||dt.getHours()<5;
 var sr=new Date(SUNRISE),ss=new Date(SUNSET);
 var m=dt.getHours()*60+dt.getMinutes();
 return m<(sr.getHours()*60+sr.getMinutes())||m>(ss.getHours()*60+ss.getMinutes());
}
/* هل الساعة المختارة ساعة ذهبية؟ */
function tlIsGolden(dt){
 if(!SUNRISE||!SUNSET)return false;
 var sr=new Date(SUNRISE),ss=new Date(SUNSET),W1=45*60000;
 function sameDayMs(base){var x=new Date(dt);x.setHours(base.getHours(),base.getMinutes(),0,0);return x;}
 return Math.abs(dt-sameDayMs(sr))<=W1||Math.abs(dt-sameDayMs(ss))<=W1;
}

/* مزج لوني ناعم بين تدرّجين */
function mixHex(a,b,t){
 function h2r(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
 var A=h2r(a),B=h2r(b),i,o='#';
 for(i=0;i<3;i++){var v=Math.round(A[i]+(B[i]-A[i])*t).toString(16);o+=v.length<2?'0'+v:v;}
 return o;
}
/* تدرّج السماء للساعة المختارة — مع انتقال ناعم لليل والساعة الذهبية */
function tlGradient(st,dt){return skyStops(st,dt);}

function tlLabel(off,dt){
 if(off<=0)return {a:pick('الآن','الآن','Now'),b:''};
 var hh=String(dt.getHours()).padStart(2,'0')+':00';
 var lbl=off===1?pick('بعد ساعة','بعد ساعة','In 1 hour')
   :off<=6?pick('بعد '+off+' ساعات','بعد '+off+' ساعات','In '+off+' hours')
   :pick('بعد '+off+' ساعة','بعد '+off+' ساعة','In '+off+'h');
 var day=dt.getDate()!==new Date().getDate()?pick(' · بكرة',' · غدًا',' · tomorrow'):'';
 return {a:hh,b:lbl+day};
}

function timelineCard(){
 var d=tlData(TL_OFFSET);
 if(!d)return '';
 var st=tlState(d),m=META[st],L=LI(),lab=tlLabel(TL_OFFSET,d.time);
 var ic=IC[tlIsNight(d.time)?m.iN:m.iD];
 var golden=tlIsGolden(d.time);
 var desc=m.t[L]+(golden?pick(' · الساعة الذهبية',' · الساعة الذهبية',' · golden hour'):'')
   +(d.pr>=30?pick(' · احتمال مطر '+d.pr+'٪',' · احتمال '+d.pr+'٪',' · '+d.pr+'% rain'):'');
 return '<div class="timeline">'+
  '<div class="tl-head">'+
   '<div class="tl-when">'+lab.a+(d.live?'<span class="tl-live">'+pick('مباشر','مباشر','LIVE')+'</span>':'')+
    (lab.b?'<small>'+lab.b+'</small>':'')+'</div>'+
   '<div class="tl-temp">'+tconv(d.temp)+'<sup>°</sup></div>'+
  '</div>'+
  '<div class="tl-mid">'+ic+'<div class="tl-desc">'+desc+'</div></div>'+
  '<div class="tl-slide"><input type="range" class="tlr" id="tlSlider" min="0" max="'+TL_MAX+'" value="'+TL_OFFSET+'" /></div>'+
  '<div class="tl-marks"><span class="tl-mk">'+pick('الآن','الآن','Now')+'</span>'+
   '<span class="tl-mk">+6</span><span class="tl-mk">+12</span><span class="tl-mk">+24</span></div>'+
  (TL_TOUCHED?'':'<div class="tl-hint">'+pick('اسحب لتشوف السما وهي تتغيّر','اسحب لمشاهدة تغيّر السماء','Drag to watch the sky change')+'</div>')+
 '</div>';
}

   رائحة الجو — كل معلومة هنا علمية صحيحة
   البتريكور والجيوسمين وثنائي ميثيل السلفيد كلها مركّبات حقيقية موثّقة.
   ============================================================ */
function smellLine(){
 if(!W)return null;
 var st=stateOf(W),L=LI(),rain6=rainNext6(),hum=W.relative_humidity_2m;
 var dry=(DAYS_SINCE_RAIN!=null&&DAYS_SINCE_RAIN>14);

 /* أثناء المطر أو بعده مباشرة */
 if(st==='rain_light'||st==='rain'||st==='rain_heavy'){
  if(dry)return {i:'rain',t:[
   'ريحة الأرض اللي تشمّها الحين اسمها «بتريكور» — زيوت نباتية ومركّب تفرزه بكتيريا التربة، حبسته الأرض '+DAYS_SINCE_RAIN+' يوم والمطر أطلقه دفعة وحدة. لهذا أول مطر بعد جفاف ريحته أقوى.',
   'رائحة المطر الآن تُسمّى «بتريكور»، مصدرها زيوت نباتية ومركّب الجيوسمين المحبوس في التربة منذ '+DAYS_SINCE_RAIN+' يومًا.',
   'That smell is petrichor — plant oils and geosmin locked in the soil for '+DAYS_SINCE_RAIN+' days, released all at once.']};
  return {i:'rain',t:[
   'ريحة الأرض المبلولة اللي حواليك اسمها «بتريكور» — أنت تشمّ التربة لا الماء. الماء نفسه بلا رائحة.',
   'الرائحة المصاحبة للمطر تُسمّى «بتريكور»؛ مصدرها التربة لا الماء نفسه.',
   'The wet-earth smell is petrichor — you\u2019re smelling the soil, not the water. Water itself has no scent.']};
 }
 /* مطر قادم */
 if(rain6>=45){
  return {i:'soon',t:[
   'قبل المطر بشوي بتشمّ هوا نظيف حاد — سببه الأوزون اللي تنزّله التيارات الهابطة من طبقات الجو العليا. جسمك يعرف إن المطر جاي قبل ما تشوفه.',
   'قبيل المطر تُشمّ رائحة حادة نظيفة سببها الأوزون الذي تحمله التيارات الهابطة من طبقات الجو العليا.',
   'Before rain you often smell a sharp, clean note — ozone carried down by descending air from aloft.']};
 }
 /* رطوبة بحرية عالية */
 if(st==='humid'&&hum>=70){
  return {i:'sea',t:[
   'الرطوبة العالية تحمل معها ريحة البحر — مركّب اسمه ثنائي ميثيل السلفيد تنتجه الطحالب البحرية. كل ما زادت الرطوبة، وصلتك أقوى.',
   'ترفع الرطوبة العالية رائحة البحر، ومصدرها مركّب ثنائي ميثيل السلفيد الذي تنتجه الطحالب البحرية.',
   'High humidity carries the sea smell — dimethyl sulfide, produced by marine algae.']};
 }
 /* غبار */
 if(st==='dust'){
  return {i:'dust',t:[
   'الغبار يحمل ريحة معدنية جافة — ذرّات التربة الدقيقة نفسها اللي تدخل أنفك. لو عندك حساسية، هذي اللحظة اللي تحسّها.',
   'يحمل الغبار رائحة معدنية جافة مصدرها ذرّات التربة الدقيقة العالقة.',
   'Dust brings a dry mineral note — the fine soil particles themselves.']};
 }
 /* حر شديد */
 if(st==='heat'&&W.temperature_2m>=40){
  return {i:'hot',t:[
   'الحر الشديد يطلّع ريحة الأسفلت والقار — الحرارة تبخّر مركّباته الطيّارة. لهذا ريحة الشارع بالظهر غير ريحته بالليل.',
   'ترفع الحرارة الشديدة رائحة الأسفلت بتبخير مركّباته الطيّارة.',
   'Extreme heat lifts the asphalt smell — volatile compounds evaporating from the road.']};
 }
 /* ليل صافٍ بارد */
 if(st==='cool'&&IS_NIGHT){
  return {i:'cool',t:[
   'بالليل البارد الروائح تصير أوضح — الهوا البارد أكثف ويحبس الجزيئات قريبة من الأرض بدل ما ترتفع.',
   'تزداد الروائح وضوحًا ليلًا لأن الهواء البارد الأكثف يحبس الجزيئات قرب سطح الأرض.',
   'Cold nights sharpen scents — denser air holds molecules near the ground.']};
 }
 return null;
}

/* ============================================================
   محرّك الأحداث الفلكية — «شيء لن يتكرر قريبًا»
   كل حساب هنا رياضي دقيق، بلا واجهة برمجية، يعمل أوفلاين.
   ⚠️ لا نخترع ندرة: كل ادعاء «نادر» مبني على دورة فلكية حقيقية.
   ============================================================ */

/* اليوم اليولياني — أساس كل الحسابات الفلكية */
function julianDay(d){
 var y=d.getUTCFullYear(),m=d.getUTCMonth()+1,day=d.getUTCDate();
 var h=d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600;
 if(m<=2){y-=1;m+=12;}
 var A=Math.floor(y/100),B=2-A+Math.floor(A/4);
 return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+day+B-1524.5+h/24;
}

/* طور القمر ونسبة إضاءته — دقة ~١٪ */
var SYNODIC=29.530588853;          /* الشهر الاقتراني */
var ANOMALISTIC=27.554549878;      /* الشهر الأنومالي (دورة القرب والبعد) */
var NEW_MOON_REF=2451550.09766;    /* محاق مرجعي: 6 يناير 2000 */
var PERIGEE_REF=2451534.6698;      /* حضيض مرجعي */

function moonInfo(d){
 var jd=julianDay(d||new Date());
 var age=((jd-NEW_MOON_REF)%SYNODIC+SYNODIC)%SYNODIC;     /* عمر القمر بالأيام */
 var phase=age/SYNODIC;                                    /* ٠=محاق ٠.٥=بدر */
 var illum=(1-Math.cos(2*Math.PI*phase))/2;                /* نسبة الإضاءة */
 /* المسافة التقريبية: تتذبذب بين ٣٥٦٥٠٠ و٤٠٦٧٠٠ كم */
 var anom=((jd-PERIGEE_REF)%ANOMALISTIC+ANOMALISTIC)%ANOMALISTIC;
 var anomAngle=2*Math.PI*anom/ANOMALISTIC;
 var dist=381600-25100*Math.cos(anomAngle);                /* كم — النطاق الفلكي ٣٥٦٥٠٠–٤٠٦٧٠٠ */
 return {age:age,phase:phase,illum:illum,dist:dist,jd:jd};
}
function moonPhaseName(ph){
 var L=LI();
 if(ph<0.02||ph>0.98)return ['محاق','محاق','New moon'][L];
 if(ph<0.23)return ['هلال متزايد','هلال متزايد','Waxing crescent'][L];
 if(ph<0.27)return ['تربيع أول','تربيع أول','First quarter'][L];
 if(ph<0.48)return ['أحدب متزايد','أحدب متزايد','Waxing gibbous'][L];
 if(ph<0.52)return ['بدر','بدر','Full moon'][L];
 if(ph<0.73)return ['أحدب متناقص','أحدب متناقص','Waning gibbous'][L];
 if(ph<0.77)return ['تربيع أخير','تربيع أخير','Last quarter'][L];
 return ['هلال متناقص','هلال متناقص','Waning crescent'][L];
}

];

/* طلوع سهيل — حدث ثقافي خليجي حقيقي */
function suhailEvent(d){
 var m=d.getMonth()+1,day=d.getDate();
 if(m===8&&day>=22&&day<=26)return {
  n:['طلوع سهيل','طلوع سهيل','Canopus rises'],
  b:['نجم سهيل يطلع هذي الأيام — عند أهل الجزيرة إشارة أول كسرة بالحر. وهو ثاني ألمع نجم في السماء بعد الشعرى.',
     'يطلع سهيل في هذه الأيام، وهو عند أهل الجزيرة إيذان بانكسار الحر. ثاني ألمع نجوم السماء.',
     'Canopus rises now — for Arabians, the first sign of breaking heat. It\u2019s the second-brightest star in the sky.'],
  rare:['يتكرر كل سنة، بس معناه عند أهلنا ما يتكرر','سنوي، لكنه من أهم علامات التقويم المحلي','Annual, but culturally the year\u2019s key marker']};
 return null;
}

/* بناء حدث اليوم الفلكي — يختار الأندر */
function astroToday(){
 var now=new Date(),L=LI(),m=now.getMonth()+1,day=now.getDate();
 var mi=moonInfo(now),out=[];

 /* ١) قمر عملاق: بدر + حضيض */
 if(mi.illum>=0.97&&mi.dist<=361000){
  out.push({p:100,icon:'moon',
   t:['قمر عملاق الليلة','قمر عملاق','Supermoon tonight'],
   b:['القمر بدر وهو في أقرب نقطة من الأرض — '+Math.round(mi.dist).toLocaleString('en')+' كم. يظهر أكبر بنحو ١٤٪ وأسطع بـ٣٠٪ من البدر العادي.',
      'بدر في الحضيض على بعد '+Math.round(mi.dist).toLocaleString('en')+' كم — أكبر وأسطع من المعتاد.',
      'A full moon at perigee — '+Math.round(mi.dist).toLocaleString('en')+' km away. Up to 14% bigger and 30% brighter.'][L],
   r:['يحدث ٣–٤ مرات بالسنة فقط','٣–٤ مرات سنويًا','Only 3–4 times a year'][L]});
 }
 /* ٢) بدر عادي */
 else if(mi.illum>=0.98){
  out.push({p:70,icon:'moon',
   t:['بدر الليلة','بدر','Full moon tonight'],
   b:['القمر مكتمل الليلة — ليلة بيضاء بس ما تصلح لمراقبة الشهب، ضوؤه يطمس الخافت منها.',
      'اكتمال القمر الليلة؛ ضوؤه يحجب الشهب الخافتة.',
      'The moon is full — beautiful, but its light washes out faint meteors.'][L],
   r:['كل ٢٩ يوم ونصف','كل ٢٩.٥ يومًا','Every 29.5 days'][L]});
 }
 /* ٣) محاق — أفضل ليالي رصد النجوم */
 else if(mi.illum<=0.04){
  out.push({p:75,icon:'star',
   t:['محاق — أحلك ليالي الشهر','محاق','New moon — the darkest nights'],
   b:['ما في قمر الليلة، وهذي أفضل ليلة بالشهر لرؤية النجوم ودرب التبانة. لو طلعت بعيد عن أضواء المدينة، بتشوف ما ما شفته قبل.',
      'انعدام ضوء القمر يجعلها أفضل ليالي الشهر لرصد النجوم ودرب التبانة.',
      'No moonlight — the best night this month for stars and the Milky Way.'][L],
   r:['ليلتان أو ثلاث في الشهر','ليلتان أو ثلاث شهريًا','Two or three nights a month'][L]});
 }

 /* ٤) زخّات الشهب */
 var i;
 for(i=0;i<METEOR_SHOWERS.length;i++){
  var ms=METEOR_SHOWERS[i];
  if(ms.m!==m)continue;
  var diff=Math.abs(day-ms.d);
  if(diff<=ms.w){
   var atPeak=diff<=1;
   var moonWarn=mi.illum>0.6?['لكن ضوء القمر قوي الليلة ويطمس الخافت منها.','لكن ضوء القمر سيحجب الشهب الخافتة.',' But bright moonlight will wash out the faint ones.'][L]:
     (mi.illum<0.2?['وحظّك حلو: القمر خافت، فالسما مظلمة والرؤية ممتازة.','والقمر خافت، ما يجعل الرؤية ممتازة.',' And luckily the moon is dim — excellent viewing.'][L]:'');
   out.push({p:atPeak?95:60,icon:'meteor',
    t:[(atPeak?'ذروة زخّة ':'قرب ذروة زخّة ')+ms.n[0],(atPeak?'ذروة ':'قرب ذروة ')+ms.n[1],(atPeak?'Peak of the ':'Near peak of the ')+ms.n[2]][L],
    b:[(atPeak?'الليلة ذروتها — ':'ذروتها بعد '+Math.max(1,ms.d-day)+' أيام — ')+'حتى '+ms.rate+' شهاب بالساعة بأحسن الظروف. '+ms.b[0]+' '+moonWarn,
       (atPeak?'الذروة الليلة: ':'قرب الذروة: ')+'حتى '+ms.rate+' شهاب/ساعة. '+ms.b[1]+' '+moonWarn,
       (atPeak?'Peak tonight — ':'Peak in '+Math.max(1,ms.d-day)+' days — ')+'up to '+ms.rate+'/hour. '+ms.b[2]+' '+moonWarn][L],
    r:['مرة واحدة في السنة','سنويًا','Once a year'][L]});
  }
 }

 /* ٥) الانقلابات والاعتدالات */
 for(i=0;i<SUN_EVENTS.length;i++){
  var se=SUN_EVENTS[i];
  if(se.m===m&&Math.abs(day-se.d)<=1){
   out.push({p:85,icon:'sun',t:se.n[L],b:se.b[L],
    r:['مرة واحدة في السنة','سنويًا','Once a year'][L]});
  }
 }

 /* ٦) سهيل */
 var su=suhailEvent(now);
 if(su)out.push({p:90,icon:'star',t:su.n[L],b:su.b[L],r:su.rare[L]});

 /* ٧) الاحتياطي: طور القمر دائمًا متاح */
 if(!out.length){
  out.push({p:10,icon:'moon',
   t:[moonPhaseName(mi.phase),moonPhaseName(mi.phase),moonPhaseName(mi.phase)][L],
   b:['القمر مضيء '+Math.round(mi.illum*100)+'٪ الليلة، وعمره '+Math.round(mi.age)+' يوم من المحاق. المسافة '+Math.round(mi.dist).toLocaleString('en')+' كم.',
      'إضاءة القمر '+Math.round(mi.illum*100)+'٪، وعمره '+Math.round(mi.age)+' يومًا.',
      'The moon is '+Math.round(mi.illum*100)+'% lit, '+Math.round(mi.age)+' days old.'][L],
   r:''});
 }
 out.sort(function(a,b){return b.p-a.p;});
 return out[0];
}

/* ============================================================
   السماء الآن — بثّ مباشر لأحداث سمائك
   ⚠️ كل حدث هنا مرصود فعليًا بمقارنة قراءتين متتاليتين،
      أو محسوب فلكيًا بدقة. لا اختلاق ولا تخمين.

    var cut=Date.now()-6*3600000;
    LIVE_FEED=o.f.filter(function(e){return e.t>cut;}).slice(0,LIVE_MAX);
   }
   if(o&&o.p)LIVE_PREV=o.p;
   if(o&&o.s)LIVE_SEEN=o.s;

}

/* ---------- أحداث فلكية: البثّ لا يصمت أبدًا ---------- */
function feedAstro(){
 if(!SUNRISE||!SUNSET)return;
 var now=new Date(),L=LI(),today=now.toDateString();
 function once(key,fn){
  var k=key+'_'+today;
  if(LIVE_SEEN[k])return;
  if(fn()){LIVE_SEEN[k]=1;}
 }
 var sr=new Date(SUNRISE),ss=new Date(SUNSET);
 function at(base){var x=new Date(now);x.setHours(base.getHours(),base.getMinutes(),0,0);return x;}
 var srT=at(sr),ssT=at(ss);
 var toSet=Math.round((ssT-now)/60000);
 var sinceRise=Math.round((now-srT)/60000);
 var noon=new Date((srT.getTime()+ssT.getTime())/2);
 var sinceNoon=Math.round((now-noon)/60000);

 /* ★ ضمان الامتلاء: حدث دائم يصف موضع الشمس أو القمر الآن */
 (function alwaysOne(){
  if(LIVE_FEED.length>=2)return;                  /* فيه أحداث كافية */
  var L2=LI();
  if(now>=srT&&now<=ssT){
   /* نهار: كم قطعنا منه */
   var prog=(now-srT)/Math.max(1,(ssT-srT));
   var pct=Math.round(prog*100);
   var hrsLeft=Math.floor(toSet/60),minLeft=toSet%60;
   var left=hrsLeft>0?(hrsLeft+pick(' ساعة و',' ساعة و','h ')+minLeft+pick(' دقيقة',' دقيقة','m')):(minLeft+pick(' دقيقة',' دقيقة','m'));
   var where=prog<0.2?['الشمس لسا بأول السما','الشمس في بداية مسارها','The sun is early in its arc'][L2]
     :prog<0.42?['الشمس صاعدة نحو الذروة','الشمس ترتفع نحو الذروة','The sun is climbing'][L2]
     :prog<0.58?['الشمس بأعلى نقطة اليوم','الشمس قرب ذروتها','The sun is at its peak'][L2]
     :prog<0.82?['الشمس نازلة غرب','الشمس تتجه غربًا','The sun is heading west'][L2]
     :['الشمس قربت تغرب','الشمس تقترب من الغروب','The sun is nearing the horizon'][L2];
   feedPush('sun',where+' — '+['قطعنا '+pct+'٪ من النهار، وباقي '+left+' على الغروب.',
     'انقضى '+pct+'٪ من النهار، ويتبقى '+left+' على الغروب.',
     pct+'% of daylight is gone; '+left+' to sunset.'][L2],1);
  } else {
   /* ليل: القمر */
   var mi3=moonInfo(now);
   var toRise=now<srT?Math.round((srT-now)/60000):Math.round((srT.getTime()+86400000-now)/60000);
   var hR=Math.floor(toRise/60);
   feedPush('moon',['الليل عندك — القمر مضيء '+Math.round(mi3.illum*100)+'٪، وباقي '+hR+' ساعات على الشروق.',
     'الليل الآن؛ إضاءة القمر '+Math.round(mi3.illum*100)+'٪ ويتبقى '+hR+' ساعات على الشروق.',
     'Night here — moon '+Math.round(mi3.illum*100)+'% lit, '+hR+'h to sunrise.'][L2],1);
  }
 })();

 /* الشروق */
 once('rise',function(){
  if(sinceRise>=0&&sinceRise<=25){
   feedPush('sun',pick('طلعت الشمس قبل '+sinceRise+' دقيقة.','أشرقت الشمس قبل '+sinceRise+' دقيقة.','Sun rose '+sinceRise+' min ago.'),2);
   return true;}
  return false;});
 /* الزوال */
 once('noon',function(){
  if(sinceNoon>=0&&sinceNoon<=25){
   feedPush('sun',pick('الشمس عبرت أعلى نقطة قبل '+sinceNoon+' دقيقة.',
     'بلغت الشمس ذروتها قبل '+sinceNoon+' دقيقة.','Sun crossed its highest point '+sinceNoon+' min ago.'),2);
   return true;}
  return false;});
 /* ساعتان على الغروب */
 once('pre2',function(){
  if(toSet>=110&&toSet<=125){
   feedPush('sun',pick('بقي ساعتين على الغروب.','ساعتان حتى الغروب.','Two hours to sunset.'),1);
   return true;}
  return false;});
 /* الساعة الذهبية */
 once('golden',function(){
  if(toSet>=35&&toSet<=50){
   feedPush('golden',pick('دخلنا الساعة الذهبية — أحلى ضوء باليوم.',
     'بدأت الساعة الذهبية.','Golden hour has begun — the best light of the day.'),3);
   return true;}
  return false;});
 /* الغروب */
 once('set',function(){
  if(toSet<=0&&toSet>=-25){
   feedPush('moon',pick('غربت الشمس قبل '+Math.abs(toSet)+' دقيقة.','غربت الشمس قبل '+Math.abs(toSet)+' دقيقة.','Sun set '+Math.abs(toSet)+' min ago.'),2);
   return true;}
  return false;});
 /* حدث السماء الليلي */
 /* حدث السماء الليلي — القمر نفسه حدث، فلا يصمت البثّ ليلًا */
 once('sky',function(){
  if(toSet<-40||sinceRise<0){
   var a=astroToday();
   if(a){
    /* الأحداث النادرة بنصّها الكامل، وطور القمر بجملة قصيرة */
    if(a.p>=75)feedPush('star',a.t+'.',3);
    else feedPush('moon',pick('القمر الليلة: '+a.t+'.','القمر الليلة: '+a.t+'.','Tonight\u2019s moon: '+a.t+'.'),1);
    return true;}
  }
  return false;});
 /* طلوع القمر تقريبًا — يتأخر ~٥٠ دقيقة كل ليلة عن سابقتها */
 once('moonrise',function(){
  if(toSet>-30&&toSet<40){
   var mi2=moonInfo(now);
   if(mi2.illum>=0.35){
    feedPush('moon',pick('القمر مضيء '+Math.round(mi2.illum*100)+'٪ الليلة — بيكون واضح بالسما.',
      'إضاءة القمر '+Math.round(mi2.illum*100)+'٪ الليلة.',
      'The moon is '+Math.round(mi2.illum*100)+'% lit tonight.'),1);
    return true;}
  }
  return false;});
}

/* المسافة بالكيلومترات — صيغة هافرساين */
function kmBetween(la1,lo1,la2,lo2){
 var R=6371,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;
 var a=Math.sin(dLa/2)*Math.sin(dLa/2)+
   Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
/* ★ أقرب محطة رسمية بالمسافة الفعلية — لا بالحدود الإدارية */
function nearestStation(la,lo){
 var best=null,g;
 for(g in CLIMATE){
  var c=CLIMATE[g];
  var d=kmBetween(la,lo,c.la,c.lo);
  if(!best||d<best.km)best={gov:g,km:d,c:c};
 }
 return best;
}

 if(normT==null)return null;

 return {gov:st.gov,station:st.c.st,km:Math.round(st.km),src:st.c.src,
   normT:normT,normH:normH,normR:normR,diff:d,yrs:st.c.yrs};
}

 if(!MODELS||!MODELS.length){h+='<div class="loading">'+pick('نجيب النماذج…','جارٍ الجلب…','Loading…')+'</div>';$("srcBody").innerHTML=h;return;}
 h+='<div class="sec-s">'+pick('أعلى حرارة اليوم حسب كل نموذج:','أعلى حرارة اليوم لكل نموذج:',"Today's high per model:")+'</div>';
 for(var i=0;i<MODELS.length;i++){var m=MODELS[i];
  h+='<div class="mrow"><span class="mn">'+m.d.nm+'<small>'+m.d.sub[L]+'</small></span>'+
   '<span class="mv">'+tconv(m.t)+'°'+(m.p!=null?' <small>'+m.p.toFixed(1)+'mm</small>':'')+'</span></div>';}
 if(MODEL_NOTE)h+=smart(pick('خلاصة نفاف','الخلاصة','Summary'),MODEL_NOTE);

function fetchModels(lat,lon){
 var ids=MODEL_DEFS.map(function(m){return m.id;}).join(",");
 fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+
  "&daily=temperature_2m_max,precipitation_sum&forecast_days=2&models="+ids+"&timezone=auto")
 .then(function(r){if(!r.ok)throw 0;return r.json();})
 .then(function(d){var dy=d.daily;if(!dy)throw 0;
  MODELS=[];var i,temps=[],rains=[];
  for(i=0;i<MODEL_DEFS.length;i++){var id=MODEL_DEFS[i].id,tk="temperature_2m_max_"+id,pk="precipitation_sum_"+id;
   var tv=dy[tk]?dy[tk][0]:null,pv=dy[pk]?dy[pk][0]:null,pv2=dy[pk]?dy[pk][1]:null;
   if(tv!=null){temps.push(tv);MODELS.push({d:MODEL_DEFS[i],t:tv,p:pv});}
   if(pv2!=null)rains.push(pv2);}
  if(temps.length>=2){
   var mn=Math.min.apply(null,temps),mx=Math.max.apply(null,temps),spread=Math.round(mx-mn),wet=0,j;
   for(j=0;j<rains.length;j++)if(rains[j]>=1)wet++;
   if(rains.length>=2&&wet>0)MODEL_NOTE=pick(wet+' من '+rains.length+' نماذج عالمية تتوقع مطرًا بكرة عندك.',wet+' من '+rains.length+' نماذج تتوقع هطولًا غدًا.',wet+' of '+rains.length+' global models expect rain tomorrow.');
   else if(spread<=1)MODEL_NOTE=pick('كل النماذج العالمية متفقة على حرارة اليوم — الفرق أقل من درجة. توقّع موثوق.','تتفق النماذج على حرارة اليوم بفارق أقل من درجة.','All models agree — under 1° apart.');
   else MODEL_NOTE=pick('النماذج العالمية مختلفة بـ'+spread+' درجات على حرارة اليوم — التوقّع أقل ثقة.','تتفاوت النماذج بمقدار '+spread+' درجات.','Models differ by '+spread+'° — lower confidence.');}
  computeStability();renderSrc();if(TAB==='now')renderNow();if(TAB==='life')renderLife();})
 .catch(function(){});}

function loadFrames(){
 fetch('https://api.rainviewer.com/public/weather-maps.json')
 .then(function(r){if(!r.ok)throw 0;return r.json();})
 .then(function(d){
  LDATA=d;LHOST=d.host||'https://tilecache.rainviewer.com';
  LFRAMES=[];
  if(LKIND==='radar'){
   if(d.radar&&d.radar.past)LFRAMES=LFRAMES.concat(d.radar.past);
   if(d.radar&&d.radar.nowcast)LFRAMES=LFRAMES.concat(d.radar.nowcast);
  }else{
   if(d.satellite&&d.satellite.infrared)LFRAMES=d.satellite.infrared.slice();
  }
  if(!LFRAMES.length){coverageNote(true);return;}
  LPOS=LKIND==='radar'?Math.max(0,(d.radar&&d.radar.past?d.radar.past.length-1:0)):LFRAMES.length-1;
  var rg=$("tlRange");rg.max=LFRAMES.length-1;rg.value=LPOS;
  rg.oninput=function(){stopAnim();showFrame(parseInt(this.value,10));};
  $("playB").onclick=toggleAnim;
  showFrame(LPOS);
  coverageNote(false);
 }).catch(function(){coverageNote(true);});
}
function coverageNote(fail){

 if(fail){el.innerHTML='<div class="cov">'+pick('تعذّر جلب صور الرصد الآن. جرّب بعد قليل.','تعذّر جلب البيانات.',"Couldn't load imagery right now.")+'</div>';return;}
 if(LKIND==='radar'&&inGulfBox(CUR.lat,CUR.lon)){
  el.innerHTML='<div class="cov">'+pick(
   'صراحة: ما في شبكة رادار مفتوحة فوق الخليج، فالطبقة غالبًا بتطلع فاضية عندك. استخدم «قمر صناعي» — يغطّي منطقتنا كاملة.',
   'لا تتوفر بيانات رادار مفتوحة فوق الخليج؛ استخدم طبقة القمر الصناعي التي تغطي المنطقة.',
   'No open radar network covers the Gulf — this layer will likely be empty here. Use Satellite instead.')+'</div>';
 } else el.innerHTML='';
}
function inGulfBox(la,lo){return la>=16&&la<=30&&lo>=48&&lo<=62;}
function frameUrl(f){
 var col=LKIND==='radar'?'4':'0';           /* لوحة ألوان */
 var opt=LKIND==='radar'?'1_1':'0_0';       /* تنعيم + حدود */
 return LHOST+f.path+'/512/{z}/{x}/{y}/'+col+'/'+opt+'.png';
}
function showFrame(i){
 if(!LFRAMES.length||!LMAP)return;
 i=Math.max(0,Math.min(i,LFRAMES.length-1));LPOS=i;
 var f=LFRAMES[i],key=LKIND+f.path;
 if(!LCACHE[key]){
  LCACHE[key]=L.tileLayer(frameUrl(f),{opacity:0,zIndex:10,tileSize:512,zoomOffset:-1,maxZoom:12,updateWhenIdle:true,keepBuffer:1});
  LCACHE[key].addTo(LMAP);
 }
 if(LLAYER&&LLAYER!==LCACHE[key])LLAYER.setOpacity(0);
 LLAYER=LCACHE[key];LLAYER.setOpacity(LKIND==='radar'?0.75:0.6);
 var rg=$("tlRange");if(rg)rg.value=i;
 var d=new Date(f.time*1000);
 var hhmm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
 var isFuture=(f.time*1000)>Date.now();
 var lbl=isFuture?pick('توقّع قريب','تنبؤ قريب','Nowcast'):pick('رصد','رصد','Observed');
 var el=$("tlTime");
 if(el)el.innerHTML=hhmm+' <small>· '+lbl+' · '+(i+1)+'/'+LFRAMES.length+'</small>';
}
function toggleAnim(){if(LTIMER)stopAnim();else startAnim();}
function startAnim(){
 if(!LFRAMES.length)return;
 $("playB").innerHTML='❚❚';
 LTIMER=setInterval(function(){
  var n=LPOS+1;if(n>=LFRAMES.length)n=0;showFrame(n);},600);
}
function stopAnim(){if(LTIMER){clearInterval(LTIMER);LTIMER=null;}var b=$("playB");if(b)b.innerHTML='▶';}


/* ============================================================
   NASA GIBS — أقمار صناعية عالية الدقة
   بلا مفتاح، بلا تسجيل، والتضمين مسموح صراحةً بسياسة ناسا المفتوحة.
   ⚠️ التحديث: مرة يوميًا تقريبًا (مرور القمر)، لا كل دقائق.
   ============================================================ */
var GIBS_LAYERS={
 nasa:{id:'VIIRS_SNPP_CorrectedReflectance_TrueColor',set:'GoogleMapsCompatible_Level9',fmt:'jpg',max:9,
   nm:['ألوان حقيقية — VIIRS','ألوان حقيقية — VIIRS','True color — VIIRS'],
   desc:['صورة الأرض كما تراها العين. السحب بيضاء والبحر أزرق والصحراء بنية.',
         'صورة بالألوان الطبيعية كما تراها العين.',
         'Earth as the eye sees it — white clouds, blue sea, tan desert.']},
 dust:{id:'MODIS_Terra_CorrectedReflectance_Bands721',set:'GoogleMapsCompatible_Level9',fmt:'jpg',max:9,
   nm:['كشف الغبار — ألوان زائفة','كشف الغبار','Dust detection — false color'],
   desc:['تركيبة ألوان زائفة تُبرز الغبار العالق فوق الصحراء — يظهر ورديًا مائلًا للبني بينما السحب تبقى بيضاء أو سماوية. مفيدة لنا تحديدًا.',
         'تركيبة ألوان زائفة تُظهر الغبار بوضوح فوق المناطق الصحراوية.',
         'False-colour band combo that makes airborne dust stand out over desert — dust reads pinkish-brown while clouds stay white/cyan.']}
};
function gibsDate(off){var d=new Date(Date.now()-(off||0)*86400000);
 return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');}
var GIBS_OFFSET=0;   /* ٠ = اليوم، ١ = أمس … */
function gibsUrl(kind,off){
 var LY=GIBS_LAYERS[kind];
 return 'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/'+LY.id+'/default/'+gibsDate(off)+
        '/'+LY.set+'/{z}/{y}/{x}.'+LY.fmt;
}
var GIBSLAYER=null;
function showGibs(kind){
 if(!LMAP)return;
 clearOverlays();
 var LY=GIBS_LAYERS[kind];
 GIBSLAYER=window.L.tileLayer(gibsUrl(kind,GIBS_OFFSET),{
   opacity:0.92,zIndex:10,maxNativeZoom:LY.max,maxZoom:12,updateWhenIdle:true,keepBuffer:1,
   attribution:'NASA GIBS'
 });
 GIBSLAYER.addTo(LMAP);
 /* لو لم تصل صور اليوم، ارجع ليوم سابق تلقائيًا */
 var tried=0;
 GIBSLAYER.on('tileerror',function(){
   if(tried>=2)return;tried++;GIBS_OFFSET++;
   GIBSLAYER.setUrl(gibsUrl(kind,GIBS_OFFSET));
   updateGibsLabel(kind);
 });
 updateGibsLabel(kind);
}
function updateGibsLabel(kind){
 var LY=GIBS_LAYERS[kind],i=LI();
 var el=$("tlTime");
 if(el){var lbl=GIBS_OFFSET===0?pick('صور اليوم','صور اليوم','Today'):
   (GIBS_OFFSET===1?pick('صور أمس','صور أمس','Yesterday'):pick('قبل '+GIBS_OFFSET+' أيام','قبل '+GIBS_OFFSET+' أيام',GIBS_OFFSET+' days ago'));
  el.innerHTML=LY.nm[i]+' <small>· '+lbl+'</small>';}
 var cv=$("covNote");
 if(cv)cv.innerHTML='<div class="cov">'+LY.desc[i]+'<br><span style="opacity:.75">'+
   pick('تُحدَّث مرة يوميًا مع مرور القمر — دقة عالية لكن ليست لحظية.',
        'تُحدَّث يوميًا مع مرور القمر الصناعي.',
        'Updated once daily on satellite overpass — high detail, not live.')+'</span></div>';
}
function clearOverlays(){
 if(GIBSLAYER){try{LMAP.removeLayer(GIBSLAYER);}catch(e){}GIBSLAYER=null;}
 if(LLAYER){try{LLAYER.setOpacity(0);}catch(e){}}
 var k;for(k in LCACHE){try{LMAP.removeLayer(LCACHE[k]);}catch(e){}}
 LCACHE={};LLAYER=null;
}

function obsVerdict(k){
 if(!W)return '';
 var modelState=stateOf(W),L=LI();
 var fam={clear:['clear','mild'],cloudy:['cloudy'],rain:['rain','rain_light','rain_heavy','storm'],
  dust:['dust'],humid:['humid'],cool:['cool']};
 var match=(fam[k]||[]).indexOf(modelState)>=0;
 var mname=META[modelState].t[L];
 var oname='';for(var i=0;i<OBS_OPTS.length;i++)if(OBS_OPTS[i].k===k)oname=OBS_OPTS[i].nm[L];
 var txt;
 if(match){
  txt=pick('النماذج العالمية متفقة معك — <b>'+mname+'</b> فعلًا. رصدك يثبّت التوقّع.',
   'تتفق النماذج مع رصدك: <b>'+mname+'</b>.',
   'The global models agree with you — <b>'+mname+'</b>. Your report confirms the forecast.');
 } else {
  txt=pick('النماذج تقول <b>'+mname+'</b>، وأنت تقول <b>'+oname+'</b>. رصدك أصدق — الأرض تحت رجليك، والنموذج شبكة بحجم ١١ كم.',
   'تشير النماذج إلى <b>'+mname+'</b> بينما رصدك <b>'+oname+'</b>. الرصد الميداني أدقّ محليًا.',
   'Models say <b>'+mname+'</b>, you say <b>'+oname+'</b>. You win — you\'re standing there; the model is an 11 km grid box.');
 }
 return '<div class="verdict '+(match?'vmatch':'vdiff')+'">'+txt+'</div>';
}

/* ============================================================
   خريطة الأمطار — مولّدة ذاتيًا من Open-Meteo
   نستعلم عن شبكة نقاط تغطي الخليج ونرسمها بأنفسنا.
   البيانات CC-BY 4.0 · الرسم رسمنا · مملوكة لنا بالكامل.
   ⚠️ الدقة ~٥٥ كم (تباعد الشبكة) — أخشن من نماذج المراكز الأصلية.
   ============================================================ */
var RM_GRID=null, RM_HOURS=null, RM_STEP=0, RM_LAYER=null, RM_TIMER=null, RM_LOADING=false;
var RM_BOX={la1:16.0,la2:27.0,lo1:51.5,lo2:60.0,step:0.7};

function rmBuildPoints(){
 var lats=[],lons=[],la,lo;
 for(la=RM_BOX.la1;la<=RM_BOX.la2+0.001;la+=RM_BOX.step)
  for(lo=RM_BOX.lo1;lo<=RM_BOX.lo2+0.001;lo+=RM_BOX.step){
   lats.push(Math.round(la*100)/100);lons.push(Math.round(lo*100)/100);}
 return {lats:lats,lons:lons};
}
function rmColor(mm){
 /* تدرّج مطري مألوف: شفاف → أزرق فاتح → أزرق → أخضر → أصفر → أحمر */
 if(mm<0.1)return null;
 if(mm<0.4) return ['#9fd0f0',0.30];
 if(mm<1.0) return ['#5aa8e0',0.42];
 if(mm<2.5) return ['#2b7fd0',0.52];
 if(mm<5.0) return ['#2fb37a',0.60];
 if(mm<10)  return ['#c9d94a',0.66];
 if(mm<20)  return ['#e8a33a',0.72];
 return ['#d9483a',0.80];
}
function rmLoad(){
 if(RM_LOADING)return;RM_LOADING=true;
 var pts=rmBuildPoints();
 var url="https://api.open-meteo.com/v1/forecast?latitude="+pts.lats.join(",")+
   "&longitude="+pts.lons.join(",")+"&hourly=precipitation&forecast_days=2&models=best_match&timezone=auto";
 rmNote(pick('نبني خريطة الأمطار من '+pts.lats.length+' نقطة…','جارٍ بناء الخريطة…','Building rain map from '+pts.lats.length+' points…'),false);
 fetch(url).then(function(r){if(!r.ok)throw 0;return r.json();})
 .then(function(d){
  var arr=Array.isArray(d)?d:[d],i;
  RM_GRID=[];RM_HOURS=null;
  for(i=0;i<arr.length&&i<pts.lats.length;i++){
   var hh=arr[i]&&arr[i].hourly;if(!hh)continue;
   if(!RM_HOURS)RM_HOURS=hh.time;
   RM_GRID.push({la:pts.lats[i],lo:pts.lons[i],p:hh.precipitation});}
  RM_LOADING=false;
  if(!RM_GRID.length||!RM_HOURS){rmNote(pick('تعذّر بناء الخريطة.','تعذّر البناء.','Could not build the map.'),true);return;}
  /* ابدأ من الساعة الحالية */
  var now=new Date(),si=0;
  for(i=0;i<RM_HOURS.length;i++){if(new Date(RM_HOURS[i])>now){si=Math.max(0,i-1);break;}}
  RM_STEP=si;
  var rg=$("tlRange");if(rg){rg.max=Math.min(RM_HOURS.length-1,si+23);rg.min=si;rg.value=si;
   rg.oninput=function(){rmStop();rmDraw(parseInt(this.value,10));};}
  var pb=$("playB");if(pb)pb.onclick=rmToggle;
  rmDraw(si);
 }).catch(function(){RM_LOADING=false;rmNote(pick('تعذّر جلب بيانات الخريطة.','تعذّر الجلب.','Failed to load map data.'),true);});
}
function rmDraw(step){
 if(!LMAP||!RM_GRID||!RM_HOURS)return;
 step=Math.max(0,Math.min(step,RM_HOURS.length-1));RM_STEP=step;
 if(RM_LAYER){try{LMAP.removeLayer(RM_LAYER);}catch(e){}RM_LAYER=null;}
 var g=window.L.layerGroup(),i,half=RM_BOX.step/2,drawn=0,maxmm=0;
 for(i=0;i<RM_GRID.length;i++){
  var cell=RM_GRID[i],mm=cell.p?cell.p[step]:null;
  if(mm==null)continue;
  if(mm>maxmm)maxmm=mm;
  var c=rmColor(mm);if(!c)continue;
  window.L.rectangle([[cell.la-half,cell.lo-half],[cell.la+half,cell.lo+half]],
   {stroke:false,fillColor:c[0],fillOpacity:c[1],interactive:false}).addTo(g);
  drawn++;
 }
 RM_LAYER=g;g.addTo(LMAP);
 /* الوقت */
 var d=new Date(RM_HOURS[step]),now=new Date();
 var hh=String(d.getHours()).padStart(2,'0')+':00';
 var diff=Math.round((d-now)/3600000);
 var when=diff<=0?pick('الآن','الآن','Now'):pick('بعد '+diff+' ساعة','بعد '+diff+' ساعة','+'+diff+'h');
 var el=$("tlTime");
 if(el)el.innerHTML=hh+' <small>· '+when+' · '+pick('أقصى ','أقصى ','max ')+maxmm.toFixed(1)+'mm</small>';
 if(drawn===0)rmNote(pick('ما في أمطار متوقعة بالخليج في هالساعة — حرّك الشريط للساعات الجاية.',
   'لا أمطار متوقعة في هذه الساعة.','No rain expected this hour — slide forward.'),false);
 else rmNote(pick('خريطة مبنية من بيانات Open-Meteo — دقتها ~٥٥ كم، ترسمها نفاف بنفسها.',
   'خريطة مولّدة من بيانات Open-Meteo بدقة ~٥٥ كم.',
   'Generated by Nafaf from Open-Meteo data · ~55 km resolution.'),false);
}
function rmNote(t,err){var cv=$("covNote");if(cv)cv.innerHTML='<div class="cov">'+t+'</div>';}
function rmToggle(){if(RM_TIMER)rmStop();else rmStart();}
function rmStart(){
 if(!RM_HOURS)return;$("playB").innerHTML='❚❚';
 var rg=$("tlRange"),mn=parseInt(rg.min,10),mx=parseInt(rg.max,10);
 RM_TIMER=setInterval(function(){
  var n=RM_STEP+1;if(n>mx)n=mn;
  rmDraw(n);var r=$("tlRange");if(r)r.value=n;},700);
}
function rmStop(){if(RM_TIMER){clearInterval(RM_TIMER);RM_TIMER=null;}var b=$("playB");if(b)b.innerHTML='▶';}
function rmClear(){rmStop();if(RM_LAYER&&LMAP){try{LMAP.removeLayer(RM_LAYER);}catch(e){}}RM_LAYER=null;}


/* ============================================================
   خرائط نفاف المولّدة ذاتيًا: الرياح · العواصف
   نفس منهج خريطة الأمطار — شبكة نقاط من Open-Meteo نرسمها بأنفسنا.

var WM_GRID=null, WM_HOURS=null, WM_STEP=0, WM_LAYER=null, WM_LOADING=false;

function wmColor(kmh){
 if(kmh<8) return ['#5aa8e0',0.16];
 if(kmh<16)return ['#2fb37a',0.24];
