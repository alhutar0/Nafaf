/* ============================================================
 أرشيف الزلازل — تعليمي صامت
 المصدر: USGS (هيئة المسح الجيولوجي الأمريكية) — مجاني بلا مفتاح
 ⚠️ مبادئ غير قابلة للتفاوض:
 • لا إشعارات إطلاقًا — هذا أرشيف لا نظام إنذار
 • لا تحذيرات ولا توجيهات سلامة
 • رابط دائم للجهة الرسمية المختصة
 ⚠️ تقني: GeoJSON يعطي [lon, lat, depth] لا [lat, lon] — والوقت بالميلي ثانية
 ============================================================ */
var QUAKES=null, QUAKES_LOADING=false, QUAKES_TS=0;

function quakesLoad(force){
 if(QUAKES_LOADING)return;
 if(!force&&QUAKES&&(Date.now()-QUAKES_TS)<15*60000)return;
 QUAKES_LOADING=true;
 /* نطاق الجزيرة العربية وبحر العرب وإيران الجنوبية */
 var start=new Date(Date.now()-30*86400000).toISOString().slice(0,10);
 var url='https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson'+
 '&starttime='+start+'&minmagnitude=3.5'+
 '&minlatitude=14&maxlatitude=34&minlongitude=44&maxlongitude=64'+
 '&orderby=time&limit=40';
 fetch(url).then(function(r){if(!r.ok)throw 0;return r.json();})
 .then(function(d){
 var out=[],i;
 var feats=(d&&d.features)||[];
 for(i=0;i<feats.length;i++){
 var f=feats[i],pr=f.properties,c=f.geometry&&f.geometry.coordinates;
 if(!pr||!c)continue;
 out.push({
 mag:pr.mag, place:pr.place||'', time:pr.time, /* ميلي ثانية */
 lon:c[0], lat:c[1], depth:c[2], /* ★ الترتيب الصحيح */
 tsunami:pr.tsunami||0, url:pr.url||''
 });
 }
 QUAKES=out; QUAKES_TS=Date.now(); QUAKES_LOADING=false;
 if(TAB==='quake')renderQuakes();if(TAB==='gallery')renderGallery();
 }).catch(function(){
 QUAKES_LOADING=false; QUAKES=[];
 if(TAB==='quake')renderQuakes();if(TAB==='gallery')renderGallery();
 });
}

/* المسافة من موقع المستخدم */
function quakeDistance(q){
 if(typeof kmBetween!=='function')return null;
 return Math.round(kmBetween(CUR.lat,CUR.lon,q.lat,q.lon));
}
/* هل يُشعر به عادةً؟ — قاعدة تعليمية مبسّطة لا تنبؤ */
function feltNote(mag,km,depth){
 var L=LI();
 if(km==null)return '';
 /* تقدير تعليمي عام: الشدة تقل مع المسافة والعمق */
 if(mag<4)return ['نادرًا ما يُشعر به إلا قرب مركزه.','نادرًا ما يُشعر به بعيدًا عن مركزه.','Rarely felt beyond the epicentre.'][L];
 if(km>600)return ['بعيد جدًا — لا يُشعر به عادةً على هذي المسافة.','بعيد؛ لا يُشعر به عادةً على هذه المسافة.','Too far to be felt here.'][L];
 if(mag>=5.5&&km<300)return ['قد يُشعر به في المباني العالية على هذي المسافة.','قد يُشعر به في المباني المرتفعة.','May be felt in tall buildings at this distance.'][L];
 if(mag>=5&&km<150)return ['قد يُشعر به خفيفًا.','قد يُشعر به بشكل خفيف.','May be felt lightly.'][L];
 return ['ما يُحسّ به عادةً على هذي المسافة.','غالبًا لا يُشعر به على هذه المسافة.','Generally not felt at this distance.'][L];
}
function magColor(m){
 if(m>=6)return '#d9483a';
 if(m>=5)return '#e8a33a';
 if(m>=4.5)return '#c9d94a';
 return '#9fd4f5';
}
function quakeAgo(t){
 var L=LI(),mins=Math.round((Date.now()-t)/60000);
 if(mins<60)return ['قبل '+mins+' دقيقة','قبل '+mins+' دقيقة',mins+' min ago'][L];
 var h=Math.round(mins/60);
 if(h<24)return ['قبل '+h+' ساعة','قبل '+h+' ساعة',h+'h ago'][L];
 var dd=Math.round(h/24);
 return ['قبل '+dd+' يوم','قبل '+dd+' يومًا',dd+'d ago'][L];
}

function renderQuakes(){
 var b=$("quakeBody");if(!b)return;
 var L=LI();
 var head='<div class="sec-t">'+['أرشيف الزلازل','أرشيف الزلازل','Earthquake archive'][L]+'</div>'+
 '<div class="sec-s">'+['رصد علمي لآخر ٣٠ يومًا في الجزيرة وبحر العرب — للاطلاع والتعلّم',
 'سجل علمي لآخر ٣٠ يومًا في المنطقة — للاطلاع',
 'Scientific record of the past 30 days — for reference'][L]+'</div>';

 if(!QUAKES){b.innerHTML=head+'<div class="loading">'+
 ['نجيب سجل الزلازل…','جارٍ الجلب…','Loading…'][L]+'</div>';quakesLoad();return;}

 if(!QUAKES.length){
 b.innerHTML=head+'<div class="card"><div class="qk-empty">'+
 ['ما في زلازل مسجّلة بقوة ٣.٥ فأعلى في المنطقة خلال آخر ٣٠ يوم.',
 'لا زلازل مسجّلة بقوة ٣.٥ فأعلى خلال ٣٠ يومًا.',
 'No quakes of M3.5+ recorded in the region in 30 days.'][L]+
 '</div></div>'+quakeFooter();
 return;
 }

 var h=head,i;
 for(i=0;i<QUAKES.length;i++){
 var q=QUAKES[i],km=quakeDistance(q),col=magColor(q.mag);
 h+='<div class="qk">'+
 '<div class="qk-row">'+
 '<span class="qk-mag" style="color:'+col+';border-color:'+col+'55;background:'+col+'1a">'+
 q.mag.toFixed(1)+'</span>'+
 '<span class="qk-tx">'+
 '<div class="qk-p">'+q.place+'</div>'+
 '<div class="qk-m">'+quakeAgo(q.time)+
 (km!=null?' · '+['يبعد '+km+' كم عنك','على بُعد '+km+' كم',km+' km away'][L]:'')+
 ' · '+['عمق','عمق','depth'][L]+' '+Math.round(q.depth)+' '+['كم','كم','km'][L]+'</div>'+
 '</span>'+
 '</div>'+
 '<div class="qk-felt">'+feltNote(q.mag,km,q.depth)+'</div>'+
 '</div>';
 }
 b.innerHTML=h+quakeFooter();
}

function quakeFooter(){
 var L=LI();
 return '<div class="qk-foot">'+
 ['<b>هذا أرشيف علمي للاطلاع فقط — ليس نظام إنذار.</b><br>'+
 'المصدر: هيئة المسح الجيولوجي الأمريكية (USGS). للمعلومات الرسمية في السلطنة: '+
 '<a href="https://www.squ.edu.om" target="_blank" rel="noopener">مركز رصد الزلازل — جامعة السلطان قابوس</a>.',
 '<b>أرشيف علمي للاطلاع — ليس نظام إنذار.</b><br>'+
 'المصدر: USGS. الجهة المختصة: مركز رصد الزلازل بجامعة السلطان قابوس.',
 '<b>Scientific archive only — not a warning system.</b><br>'+
 'Source: USGS. For official info: Sultan Qaboos University Seismology Centre.'][L]+
 '</div>';
}


/* ============================================================

 ============================================================ */
var USER=null; /* {email,name} */
var CORR={status:'none',name:''};
var GSI_ID=''; /* معرّف عميل جوجل — يُجلب من الخادم */

function authLoad(){
 if(!PUSH_URL)return;
 fetch(PUSH_URL+'/auth/config').then(function(r){
 if(!r.ok)throw new Error('HTTP '+r.status);
 return r.json();
 }).then(function(c){
 GSI_ID=c.clientId||'';
 if(GSI_ID)loadGSI();
 }).catch(function(){/* صامت عند الإقلاع — يُبلَّغ عند الضغط */});
 /* حدّث حالة المراسل */

}
function corrRefresh(){
 if(!PUSH_URL)return;
 fetch(PUSH_URL+'/correspondent/status',{method:'POST',

 .then(function(r){return r.json();})

/* حمّل مكتبة جوجل عند الحاجة فقط */
function loadGSI(){
 if(document.getElementById('gsiLib'))return;
 var sc=document.createElement('script');
 sc.id='gsiLib';sc.src='https://accounts.google.com/gsi/client';
 sc.async=true;sc.defer=true;
 sc.onload=function(){
 try{
 google.accounts.id.initialize({client_id:GSI_ID,callback:onGoogleCred});
 }catch(e){}
 };
 document.head.appendChild(sc);
}
function onGoogleCred(resp){
 if(!resp||!resp.credential){toast(pick('ما وصل رمز من جوجل.','لم يصل رمز التحقق.','No credential from Google.'),true);return;}
 var st=0;
 fetch(PUSH_URL+'/auth/google',{method:'POST',

var PILL_I=0, PILL_TIMER=null;

function pillArt(kind){
 /* رسم حيّ صغير لكل نوع رصد */
 if(kind==='rain'){
 var d='';
 for(var i=0;i<7;i++)d+='<span class="pd" style="left:'+(8+i*13)+'%;'+
 'animation-duration:'+(0.5+Math.random()*0.3).toFixed(2)+'s;'+
 'animation-delay:'+(Math.random()*0.6).toFixed(2)+'s"></span>';
 return '<span class="pill-art pa-rain">'+d+'</span>';
 }
 if(kind==='dust'){
 var u='';
 for(var j=0;j<8;j++)u+='<span class="pu" style="top:'+(15+Math.random()*65)+'%;'+
 'animation-duration:'+(1.6+Math.random()*1.4).toFixed(1)+'s;'+
 'animation-delay:'+(Math.random()*2).toFixed(1)+'s"></span>';
 return '<span class="pill-art pa-dust">'+u+'</span>';
 }
 if(kind==='humid'){
 var h='';
 for(var k=0;k<4;k++)h+='<span class="ph" style="left:'+(15+k*22)+'%;'+
 'animation-delay:'+(k*0.4).toFixed(1)+'s"></span>';
 return '<span class="pill-art pa-humid">'+h+'</span>';
 }
 if(kind==='clouds')return '<span class="pill-art pa-cloud"><span class="pc"></span><span class="pc pc2"></span></span>';
 if(kind==='clear')return '<span class="pill-art pa-sun"><span class="ps"></span></span>';
 if(kind==='cold')return '<span class="pill-art pa-cold"><span class="pf"></span><span class="pf pf2"></span></span>';
 return '<span class="pill-art"></span>';
}

/* اجمع كل الرصدات في قائمة واحدة */
function pillItems(){
 var out=[],L=LI();
 if(FEED&&FEED.corr)FEED.corr.forEach(function(c){
 out.push({kind:c.kind,wilaya:c.wilaya,name:c.name,corr:true,ts:c.ts,photo:c.photo});
 });
 if(FEED&&FEED.consensus)FEED.consensus.forEach(function(g){
 out.push({kind:g.kind,wilaya:g.wilaya,count:g.count,ts:Date.now()});
 });
 if(FEED&&FEED.solo)FEED.solo.forEach(function(x){
 out.push({kind:x.kind,wilaya:x.wilaya,ts:x.ts,photo:x.photo});
 });
 return out;
}

function pillCard(){
 var items=pillItems();
 if(!items.length)return '';
 if(PILL_I>=items.length)PILL_I=0;
 var it=items[PILL_I],L=LI();
 var kn=(OBS_LABEL[it.kind]||['—','—','—'])[L];
 var dots='';
 for(var i=0;i<Math.min(items.length,6);i++)dots+='<span class="pl-dot'+(i===PILL_I?' on':'')+'"></span>';
 return '<div class="pill k-'+it.kind+'" id="pillCard">'+
 pillArt(it.kind)+
 '<div class="pill-tx">'+
 '<div class="pl-k">'+kn+' — '+it.wilaya+'</div>'+
 '<div class="pl-m">'+
 (it.corr?'<span class="pl-badge">'+pick('مراسل','مراسل','Reporter')+'</span>':'')+
 (it.count?'<span class="pl-cnt">'+it.count+' '+pick('اتفقوا','إجماع','agree')+'</span>':'')+
 (it.name?'<span class="pl-nm">'+it.name+'</span>':'')+
 '<span class="pl-t">'+repAgo(it.ts)+'</span>'+
 '</div>'+
 '</div>'+
 (it.photo?'<img class="pl-img" src="'+it.photo+'" alt="" />':'')+
 (items.length>1?'<div class="pl-dots">'+dots+'</div>':'')+
 '</div>';
}

function pillNext(){
 var items=pillItems();
 if(items.length<2)return;
 PILL_I=(PILL_I+1)%items.length;
 var host=$("pillHost");
 if(!host){pillStop();return;}
 var el=$("pillCard");
 if(el)el.style.opacity='0';
 setTimeout(function(){
 host.innerHTML=pillCard();
 var ne=$("pillCard");
 if(ne){ne.style.opacity='0';setTimeout(function(){ne.style.opacity='1';},20);
 ne.onclick=function(){pillNext();pillStart();};}
 },250);
}
function pillStart(){
 pillStop();
 if(pillItems().length<2)return;
 PILL_TIMER=setInterval(pillNext,5000);
}
function pillStop(){if(PILL_TIMER){clearInterval(PILL_TIMER);PILL_TIMER=null;}}

/* ============================================================
 الرسوم الحيّة لصفحة «يومك» — SVG خفيف يعرض البيانات الحقيقية
 ⚠️ لا مكتبات ثلاثية الأبعاد: تستنزف البطارية وتضاعف حجم التطبيق
 وهذه تعرض الحقيقة (طور القمر الفعلي) لا زخرفة عامة
 ============================================================ */

/* قمر بطوره الحقيقي — الظل يتحرك حسب الحساب الفلكي */
function moonSVG(size){
 var sz=size||46;
 var mi=(typeof moonInfo==='function')?moonInfo(new Date()):{phase:0.5,illum:0.5};
 var ph=mi.phase; /* ٠ محاق · ٠.٥ بدر */
 var r=22;
 /* نصف عرض الظل: يتحرك من +r (محاق) إلى -r (بدر) ثم يعود */
 var k=Math.cos(2*Math.PI*ph); /* ١ عند المحاق · -١ عند البدر */
 var rx=Math.abs(k*r);
 var waxing=(ph<0.5); /* متزايد: الظل على اليسار */
 var shadowX=waxing?(-k*r*0):0;
 /* نبني الظل كقطع ناقص يغطي جزءًا من القرص */
 var sweepOuter=waxing?1:0;
 var sweepInner=(k>0)?(waxing?1:0):(waxing?0:1);
 var d='M 24 2 A '+r+' '+r+' 0 0 '+sweepOuter+' 24 46 A '+rx.toFixed(1)+' '+r+' 0 0 '+sweepInner+' 24 2 Z';
 return '<svg class="mv" viewBox="0 0 48 48" width="'+sz+'" height="'+sz+'">'+
 '<defs><radialGradient id="mg" cx="38%" cy="34%">'+
 '<stop offset="0%" stop-color="#fdfbf3"/><stop offset="70%" stop-color="#e8e3d2"/>'+
 '<stop offset="100%" stop-color="#c9c2ac"/></radialGradient></defs>'+
 '<circle cx="24" cy="24" r="'+r+'" fill="url(#mg)"/>'+
 '<circle cx="17" cy="18" r="3.2" fill="rgba(150,144,126,.35)"/>'+
 '<circle cx="30" cy="27" r="4.4" fill="rgba(150,144,126,.28)"/>'+
 '<circle cx="21" cy="33" r="2.4" fill="rgba(150,144,126,.3)"/>'+
 '<path d="'+d+'" fill="rgba(10,16,32,.88)"/>'+
 '<circle cx="24" cy="24" r="'+r+'" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1"/>'+
 '</svg>';
}

/* بوصلة ضغط بإبرة تتحرك حسب القراءة الحقيقية */
function pressureSVG(){
 if(typeof PRESS==='undefined'||PRESS==null)return '';
 var p=PRESS;
 /* النطاق ٩٨٠–١٠٤٠ يُخرَّط على قوس ٢٧٠ درجة */
 var t=Math.max(0,Math.min(1,(p-980)/60));
 var ang=-135+t*270;
 var rad=ang*Math.PI/180;
 var x=24+Math.sin(rad)*15, y=24-Math.cos(rad)*15;
 var col=p<1005?'#ff8f8f':(p>1018?'#7fe39a':'#9fd4f5');
 return '<svg class="mv" viewBox="0 0 48 48" width="44" height="44">'+
 '<circle cx="24" cy="24" r="19" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>'+
 '<path d="M 13 35 A 19 19 0 1 1 35 35" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3" stroke-linecap="round"/>'+
 '<line x1="24" y1="24" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+col+'" stroke-width="2.4" stroke-linecap="round"/>'+
 '<circle cx="24" cy="24" r="3" fill="'+col+'"/>'+
 '</svg>';
}

/* شمس على قوسها الحقيقي حسب الوقت */
function sunArcSVG(){
 if(!SUNRISE||!SUNSET)return '';
 var now=new Date(),sr=new Date(SUNRISE),ss=new Date(SUNSET);
 function at(b){var x=new Date(now);x.setHours(b.getHours(),b.getMinutes(),0,0);return x;}
 var srT=at(sr),ssT=at(ss);
 var prog=(now-srT)/Math.max(1,(ssT-srT));
 var night=(prog<0||prog>1);
 prog=Math.max(0,Math.min(1,prog));
 var x=6+prog*36, y=38-Math.sin(prog*Math.PI)*26;
 return '<svg class="mv" viewBox="0 0 48 48" width="46" height="46">'+
 '<path d="M 6 38 Q 24 4 42 38" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.5" stroke-dasharray="3 3"/>'+
 '<line x1="4" y1="38" x2="44" y2="38" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/>'+
 (night?'':'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="5.5" fill="#ffd24a"/>'+
 '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="9" fill="rgba(255,210,74,.22)"/>')+
 '</svg>';
}

 else if(h>max){w=Math.round(w*max/h);h=max;}
 var cv=document.createElement('canvas');cv.width=w;cv.height=h;
 var cx=cv.getContext('2d');cx.drawImage(img,0,0,w,h);
 try{cb(cv.toDataURL('image/jpeg',0.72));}catch(x){cb(null);}
 };
 img.onerror=function(){cb(null);};
 img.src=e.target.result;
 };
 rd.onerror=function(){cb(null);};
 rd.readAsDataURL(file);
 }catch(e){cb(null);}
}

/* ============================================================
 خريطة الأمطار — مولّدة ذاتيًا من Open-Meteo
 نستعلم عن شبكة نقاط تغطي الخليج ونرسمها بأنفسنا.
 البيانات CC-BY 4.0 · الرسم رسمنا · مملوكة لنا بالكامل.
 ⚠️ الدقة ~٥٥ كم (تباعد الشبكة) — أخشن من نماذج المراكز الأصلية.

var RM_GRID=null, RM_HOURS=null, RM_STEP=0, RM_LAYER=null, RM_TIMER=null, RM_LOADING=false;
var RM_BOX={la1:16.0,la2:27.0,lo1:51.5,lo2:60.0,step:0.7};

function rmBuildPoints(){
 var lats=[],lons=[],la,lo;
 for(la=RM_BOX.la1;la<=RM_BOX.la2+0.001;la+=RM_BOX.step)
 for(lo=RM_BOX.lo1;lo<=RM_BOX.lo2+0.001;lo+=RM_BOX.step){
 lats.push(Math.round(la*100)/100);lons.push(Math.round(lo*100)/100);}
 return {lats:lats,lons:lons};
}
function rmColor(mm){
 /* تدرّج مطري مألوف: شفاف → أزرق فاتح → أزرق → أخضر → أصفر → أحمر */
 if(mm<0.1)return null;
 if(mm<0.4) return ['#9fd0f0',0.30];
 if(mm<1.0) return ['#5aa8e0',0.42];
 if(mm<2.5) return ['#2b7fd0',0.52];
 if(mm<5.0) return ['#2fb37a',0.60];
 if(mm<10) return ['#c9d94a',0.66];
 if(mm<20) return ['#e8a33a',0.72];
 return ['#d9483a',0.80];
}
function rmLoad(){
 if(RM_LOADING)return;RM_LOADING=true;
 var pts=rmBuildPoints();
 var url="https://api.open-meteo.com/v1/forecast?latitude="+pts.lats.join(",")+
 "&longitude="+pts.lons.join(",")+"&hourly=precipitation&forecast_days=2&models=best_match&timezone=auto";
 rmNote(pick('نبني خريطة الأمطار من '+pts.lats.length+' نقطة…','جارٍ بناء الخريطة…','Building rain map from '+pts.lats.length+' points…'),false);
 fetch(url).then(function(r){if(!r.ok)throw 0;return r.json();})
.then(function(d){
 var arr=Array.isArray(d)?d:[d],i;

/* ---------- العواصف ---------- */
function smRisk(cape,pr){
 /* مؤشر بسيط شفّاف: CAPE (طاقة الحمل) + احتمال الهطول */
 var r=0;
 if(cape!=null){ if(cape>=2500)r+=60; else if(cape>=1500)r+=45; else if(cape>=800)r+=28; else if(cape>=300)r+=12; }
 if(pr!=null){ r+=Math.min(40,pr*0.4); }
 return Math.min(100,Math.round(r));
}
function smColor(r){
 if(r<15)return null;
 if(r<30) return ['#c9d94a',0.30];
 if(r<50) return ['#e8a33a',0.42];
 if(r<70) return ['#e0603a',0.55];
 return ['#b52d8e',0.68];
}

 "&longitude="+pts.lons.join(",")+"&hourly=cape,precipitation_probability&forecast_days=2&models=best_match&timezone=auto")
.then(function(r){if(!r.ok)throw 0;return r.json();})
.then(function(d){
 var arr=Array.isArray(d)?d:[d],i;SM_GRID=[];SM_HOURS=null;
 for(i=0;i<arr.length&&i<pts.lats.length;i++){

 if(!SM_HOURS)SM_HOURS=hh.time;
 SM_GRID.push({la:pts.lats[i],lo:pts.lons[i],c:hh.cape,p:hh.precipitation_probability});}
 SM_LOADING=false;
 if(!SM_GRID.length){rmNote(pick('تعذّر البناء.','تعذّر البناء.','Could not build.'),true);return;}
 var now=new Date(),si=0;
 for(i=0;i<SM_HOURS.length;i++){if(new Date(SM_HOURS[i])>now){si=Math.max(0,i-1);break;}}
 SM_STEP=si;
 var rg=$("tlRange");if(rg){rg.min=si;rg.max=Math.min(SM_HOURS.length-1,si+23);rg.value=si;
 rg.oninput=function(){gStop();smDraw(parseInt(this.value,10));};}

 }).catch(function(){SM_LOADING=false;rmNote(pick('تعذّر جلب بيانات العواصف.','تعذّر الجلب.','Failed to load storm data.'),true);});

function cityLocalTime(offSec){
 var now=new Date();
 return new Date(now.getTime()+now.getTimezoneOffset()*60000+offSec*1000);
}
function cityIsNight(rec){
 var lt=cityLocalTime(rec.off);
 if(!rec.sr||!rec.ss)return lt.getHours()>=19||lt.getHours()<6;
 var sr=new Date(rec.sr),ss=new Date(rec.ss);
 var m=lt.getHours()*60+lt.getMinutes();
 return m<(sr.getHours()*60+sr.getMinutes())||m>(ss.getHours()*60+ss.getMinutes());
}
/* موقع الشمس/القمر على قوس السماء حسب الوقت الفعلي */
function sunArcPos(rec){
 var lt=cityLocalTime(rec.off),mins=lt.getHours()*60+lt.getMinutes();
 var srM=360,ssM=1080;
 if(rec.sr&&rec.ss){var a=new Date(rec.sr),b=new Date(rec.ss);
 srM=a.getHours()*60+a.getMinutes();ssM=b.getHours()*60+b.getMinutes();}
 var night=cityIsNight(rec),prog;
 if(!night)prog=(mins-srM)/Math.max(1,(ssM-srM));
 else { /* قوس الليل من الغروب للشروق */
 var nightLen=(1440-ssM)+srM;
 prog=(mins>=ssM?(mins-ssM):(1440-ssM+mins))/Math.max(1,nightLen);
 }
 prog=Math.max(0,Math.min(1,prog));
 var x=8+prog*84; /* ٪ أفقيًا */
 var y=64-Math.sin(prog*Math.PI)*40; /* ٪ رأسيًا — أعلى نقطة في المنتصف */
 return {x:x,y:y,night:night};
}

/* ============================================================
 الوضع السينمائي — برق وصوت واهتزاز
 ⚠️⚠️ ضوابط أمان إلزامية مكتوبة في الكود لا في النية:
 ١) مطفأ افتراضيًا — لا يعمل إلا بموافقة صريحة من المستخدم.
 ٢) يحترم «تقليل الحركة» على مستوى النظام دائمًا.
 ٣) الوميض: مرة كل ٧ ثوانٍ على الأقل بتدرّج ناعم.
 معيار WCAG يمنع أكثر من ٣ ومضات/ثانية — نحن أبطأ منه ٢١ ضعفًا.
 ٤) الشدّة القصوى ٢٨٪ لا بياض كامل.
 ٥) الصوت مولّد رياضيًا (Web Audio) — لا ملفات لا تراخيص.
 ============================================================ */
var CINEMA=stGet('cinema')==='1';
var CIN_SOUND=stGet('cin_sound')==='1';
var CIN_VIBE=stGet('cin_vibe')==='1';
var cinTimer=null, audioCtx=null, rainNode=null, rainGain=null;

function systemReducedMotion(){
 try{return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}
}
function cinemaAllowed(){
 if(!CINEMA)return false;
 if(systemReducedMotion())return false;
 if(MOTION==='off')return false;
 if(!W)return false;
 var st=stateOf(W);
 return st==='storm'||st==='rain_heavy';
}
function cinemaFlash(){
 if(!cinemaAllowed())return;
 var el=document.getElementById('cinFlash');
 if(!el){el=document.createElement('div');el.id='cinFlash';el.className='cinFlash';document.body.appendChild(el);}
 el.style.transition='opacity.12s ease-out';
 el.style.opacity='0.28';
 setTimeout(function(){el.style.transition='opacity.4s ease-in';el.style.opacity='0';},130);
 var delay=900+Math.random()*2200;
 if(CIN_SOUND)setTimeout(thunderSound,delay);
 if(CIN_VIBE)setTimeout(function(){
 try{if(navigator.vibrate)navigator.vibrate([26,90,42]);}catch(e){}},delay);
}
function cinemaStart(){
 cinemaStop();
 if(!cinemaAllowed())return;
 function loop(){cinemaFlash();cinTimer=setTimeout(loop,7000+Math.random()*7000);}
 cinTimer=setTimeout(loop,2500);
 if(CIN_SOUND)rainSoundStart();
}
function cinemaStop(){
 if(cinTimer){clearTimeout(cinTimer);cinTimer=null;}
 var el=document.getElementById('cinFlash');if(el)el.style.opacity='0';
 rainSoundStop();
}
function ensureAudio(){
 if(audioCtx)return audioCtx;
 try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;audioCtx=new AC();}
 catch(e){return null;}
 return audioCtx;
}
function rainSoundStart(){
 if(!CIN_SOUND||!cinemaAllowed())return;
 var ctx=ensureAudio();if(!ctx)return;
 if(ctx.state==='suspended'){try{ctx.resume();}catch(e){}}
 if(rainNode)return;
 var len=ctx.sampleRate*2,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0),i;
 for(i=0;i<len;i++)d[i]=Math.random()*2-1;
 var src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
 var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;
 var hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=380;
 var g=ctx.createGain();g.gain.value=0;
 src.connect(hp);hp.connect(lp);lp.connect(g);g.connect(ctx.destination);
 src.start();
 g.gain.linearRampToValueAtTime(0.055,ctx.currentTime+1.6);
 rainNode=src;rainGain=g;
}
function rainSoundStop(){
 if(!rainNode)return;
 try{
 if(rainGain&&audioCtx){
 rainGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.7);
 var n=rainNode;setTimeout(function(){try{n.stop();}catch(e){}},800);
 } else rainNode.stop();
 }catch(e){}
 rainNode=null;rainGain=null;
}
function thunderSound(){
 if(!CIN_SOUND||!cinemaAllowed())return;
 var ctx=ensureAudio();if(!ctx)return;
 try{
 var len=ctx.sampleRate*1.8,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0),i;
 for(i=0;i<len;i++){var t=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-t,2.4);}
 var src=ctx.createBufferSource();src.buffer=buf;
 var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=190;
 var g=ctx.createGain();g.gain.value=0.16;
 src.connect(lp);lp.connect(g);g.connect(ctx.destination);
 src.start();
 }catch(e){}
}

 else if(TAB==='now')cinemaStart();
});

function b64ToU8(b64){

 var raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'));
 var out=new Uint8Array(raw.length),i;
 for(i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
 return out;
}
/* اشترك فعليًا */
function pushSubscribe(){
 /* ⚠️ لا نبتلع الأخطاء — نعيد سببها ليُعرض للمستخدم */
 if(!('serviceWorker' in navigator))
 return Promise.resolve({ok:false,why:pick('متصفحك ما يدعم الإشعارات.','المتصفح لا يدعم الإشعارات.','Your browser does not support notifications.')});
 if(!('PushManager' in window))
 return Promise.resolve({ok:false,why:pick('متصفحك ما يدعم الإشعارات الخلفية.','المتصفح لا يدعم Push.','Push not supported here.')});
 if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')
 return Promise.resolve({ok:false,why:pick('الإشعارات تحتاج فتح نفاف من رابط https.','تتطلب الإشعارات https.','Notifications need an https link.')});
 if(!PUSH_URL)
 return Promise.resolve({ok:false,why:pick('خادم الإشعارات غير مربوط.','الخادم غير مربوط.','Push server not linked.')});

 /* ★ اطلب الإذن صراحةً أولًا — أوضح للمستخدم وأثبت عبر المتصفحات */
 return Promise.resolve()
.then(function(){
 if(typeof Notification==='undefined')throw new Error('no-notification-api');
 if(Notification.permission==='granted')return 'granted';
 if(Notification.permission==='denied')throw new Error('denied');
 return Notification.requestPermission();
 })
.then(function(perm){
 if(perm!=='granted')throw new Error('denied');
 /* ★ حارس: serviceWorker.ready ينتظر للأبد إن لم يُسجَّل عامل خدمة.
 نضع مهلة ٨ ثوانٍ فلا يتجمّد الزر بصمت أبدًا. */
 return Promise.race([
 navigator.serviceWorker.ready,
 new Promise(function(_,rej){setTimeout(function(){rej(new Error('sw-timeout'));},8000);})
 ]);
 })
.then(function(reg){
 /* لو فيه اشتراك سابق أعد استخدامه بدل إنشاء جديد */
 return reg.pushManager.getSubscription().then(function(existing){
 if(existing)return existing;
 return fetch(PUSH_URL+'/vapid')
.then(function(r){if(!r.ok)throw new Error('vapid-http');return r.json();})
.then(function(v){
 if(!v.key)throw new Error('vapid-empty');
 return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(v.key)});
 });
 });
 })
.then(function(sub){
 return fetch(PUSH_URL+'/subscribe',{method:'POST',
 headers:{'Content-Type':'application/json'},
 body:JSON.stringify(sub)}).then(function(r){
 if(!r.ok)throw new Error('server-'+r.status);
 return true;
 });
 })
.then(function(){
 PUSH_ON=true;stSet('push_on','1');
 refreshPushUI();
 return {ok:true};
 })
.catch(function(e){
 PUSH_ON=false;stSet('push_on','0');
 refreshPushUI();
 var m=String(e&&e.message||e);
 var why;
 if(m==='denied')why=pick('رفضت إذن الإشعارات. فعّلها من إعدادات المتصفح للموقع.',
 'تم رفض إذن الإشعارات؛ فعّله من إعدادات المتصفح.','Permission denied — enable it in browser site settings.');
 else if(m==='sw-timeout')why=pick('عامل الخدمة ما اشتغل. تأكّد أن ملف sw.js مرفوع بجانب index.html.',
 'لم يعمل عامل الخدمة؛ تأكد من رفع sw.js.','Service worker not active — make sure sw.js is uploaded next to index.html.');
 else if(m.indexOf('vapid')===0)why=pick('تعذّر الاتصال بخادم الإشعارات.','تعذّر الاتصال بالخادم.','Could not reach the push server.');
 else if(m.indexOf('server-')===0)why=pick('الخادم رفض التسجيل ('+m.replace('server-','')+').',
 'رفض الخادم التسجيل.','Server rejected the subscription.');
 else why=pick('ما قدرت أفعّل الإشعارات: '+m,'تعذّر التفعيل: '+m,'Could not enable: '+m);
 return {ok:false,why:why};
 });
}

function pushSync(){

.then(function(r){if(!r.ok)throw 0;return r.json();})
.then(function(d){var ps=d.daily.precipitation_sum,ts=d.daily.time,i;
 for(i=ps.length-1;i>=0;i--){if(ps[i]!=null&&ps[i]>=0.5){DAYS_SINCE_RAIN=Math.round((Date.now()-new Date(ts[i]).getTime())/86400000);break;}}
 if(DAYS_SINCE_RAIN==null)DAYS_SINCE_RAIN=90;
 if(TAB==='life')renderLife();}).catch(function(){});
 var ya=new Date(Date.now()-365*86400000);
 fetch("https://archive-api.open-meteo.com/v1/archive?latitude="+lat+"&longitude="+lon+
 "&start_date="+iso(ya)+"&end_date="+iso(ya)+"&daily=temperature_2m_max&timezone=auto")
.then(function(r){if(!r.ok)throw 0;return r.json();})
.then(function(d){var p=d.daily.temperature_2m_max[0];if(p==null||!W)return;
 var pr=tconv(p),tr=tconv(W.temperature_2m),df=tr-pr;
 YEARAGO=Math.abs(df)<=1?pick('قبل سنة بالضبط كان '+pr+'° — واليوم '+tr+'°. كأن شي ما تغيّر.','قبل عام '+pr+'° واليوم '+tr+'°.','A year ago: '+pr+'°. Today: '+tr+'°.')
:df>0?pick('قبل سنة كان '+pr+'° — اليوم '+tr+'° أحرّ بـ'+df+' درجات.','قبل عام '+pr+'° واليوم '+tr+'° بزيادة '+df+'.','A year ago: '+pr+'°. Today: '+tr+'° — '+df+' hotter.')
:pick('قبل سنة كان '+pr+'° — اليوم '+tr+'° أبرد بـ'+Math.abs(df)+' درجات. نعمة.','قبل عام '+pr+'° واليوم '+tr+'° بانخفاض '+Math.abs(df)+'.','A year ago: '+pr+'°. Today: '+tr+'° — '+Math.abs(df)+' cooler.');
 if(TAB==='life')renderLife();}).catch(function(){});
 fetchModels(lat,lon);
 watchLoad(true);
 newsLoad();
 reportsLoad();
 WORLD=null; /* أعِد جلب سماء العالم مع كل تحديث */
 if(TAB==='world')worldLoad();}



/* ============================================================
 PWA — قابل للتثبيت ويعمل أوفلاين
 المanifest وعامل الخدمة مولّدان في الذاكرة (Blob) ليعمل من ملف واحد.
 ⚠️ التثبيت وعامل الخدمة يحتاجان https:// أو localhost.
 من file:// تعمل الواجهة لكن لا تثبيت — هذا قيد المتصفح.
 ============================================================ */
(function initPWA(){
 /* ★ manifest من ملف حقيقي — blob: غير موثوق للتثبيت */
 try{
 var el=document.getElementById('mf');
 if(el)el.href='manifest.json';
 }catch(e){}

 if(!('serviceWorker' in navigator))return;

 if(location.protocol!=='https:'&&location.hostname!=='localhost')return;

 /* ★ تسجيل عامل الخدمة من ملف حقيقي — blob: ممنوع في كل المتصفحات */
 navigator.serviceWorker.register('sw.js', {scope:'./'})
.then(function(reg){ SW_READY=true; })
.catch(function(err){ SW_ERR=String(err&&err.message||err); });
})();

/* زر التثبيت — يظهر فقط حين يسمح المتصفح */
var DEFERRED=null;
window.addEventListener('beforeinstallprompt',function(e){
 e.preventDefault();DEFERRED=e;showInstall();
});
function showInstall(){
 if(stGet('pwa_dismissed'))return;
 var b=document.getElementById('installBar');
 if(b)b.className='installBar on';
}
window.addEventListener('appinstalled',function(){
 var b=document.getElementById('installBar');if(b)b.className='installBar';
 stSet('pwa_dismissed','1');
});

/* ============ التحديث التلقائي — كل ١٥ دقيقة عند نشاط الصفحة ============ */
var LAST_FETCH=Date.now(), AUTO_MS=15*60*1000;
function maybeRefresh(force){
 if(document.hidden&&!force)return;
 if(!force&&(Date.now()-LAST_FETCH)<AUTO_MS)return;
 if(TL_OFFSET>0)return; /* المستخدم يستكشف المستقبل — لا تقاطعه */
 LAST_FETCH=Date.now();
 fetchAll();
}
setInterval(function(){maybeRefresh(false);},60*1000);
document.addEventListener('visibilitychange',function(){
 if(!document.hidden)maybeRefresh(false); /* عند العودة للتطبيق */
});

/* ============ إقلاع ============ */

/* ═══════ إخفاء شاشة الافتتاح ═══════ */
(function(){
 var reduced=false;
 try{reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
 /* من رآها اليوم لا نعيدها عليه */
 var seenToday=false;
 try{seenToday=(stGet('splash_day')===new Date().toDateString());}catch(e){}
 var wait=(reduced||seenToday)?600:2900;
 setTimeout(function(){
 var el=document.getElementById('splash');
 if(el){
 el.className='splash gone';
 setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},700);
 }
 try{stSet('splash_day',new Date().toDateString());}catch(e){}
 },wait);
})();

(function(){
 if(needsOnboard()){
 setTimeout(function(){
 var w=$("obWrap");
 if(w){w.className='obWrap on';TOUR_I=0;renderOnboard();}
 },3100);
 }
})();
touchStreak();applyAll();pushSync();maybeAskPush();sendHeartbeat();newsLoad();cfgLoad();pingVisit();authLoad();reportsLoad();corrRefresh();

/* ★ الإقلاع: موقعك الجغرافي الحقيقي هو الأصل — لا مدينة افتراضية
 ⚠️ لا نعرض الرستاق ولا أي مدينة من القائمة إلا إن رُفض إذن الموقع تمامًا. */
(function boot(){
 var savedLat=parseFloat(stGet('myLat')||'NaN'),savedLon=parseFloat(stGet('myLon')||'NaN');
 var savedName=stGet('myName'),savedCo=stGet('myCo')||'';
 var hasSaved=(!isNaN(savedLat)&&!isNaN(savedLon)&&savedName);

 /* اعرض آخر موقع حقيقي فورًا (بلا انتظار) ثم حدّثه */
 if(hasSaved){
 CUR={n:savedName,en:savedName,lat:savedLat,lon:savedLon,c:savedCo,cen:savedCo};
 $("locName").innerHTML=cName(CUR)+' <small>'+cCountry(CUR)+'</small>';
 feedLoad();fetchAll();
 } else {
 $("locName").innerHTML=pick('نحدّد موقعك…','جارٍ تحديد موقعك…','Finding your location…');
 }

 if(!navigator.geolocation){
 if(!hasSaved)selectCity(0); /* الجهاز لا يدعم الموقع */
 return;
 }

 /* اطلب الموقع الحقيقي دائمًا — حتى لو عندنا محفوظ (قد يكون المستخدم انتقل) */
 navigator.geolocation.getCurrentPosition(
 function(p){
 /* لو تحرّك أكثر من ٣ كم عن المحفوظ حدّث */
 if(hasSaved){
 var moved=kmBetween(savedLat,savedLon,p.coords.latitude,p.coords.longitude);
 if(moved<3)return; /* نفس المكان — لا تُعد الجلب بلا داعٍ */
 }
 useRealLocation(p.coords.latitude,p.coords.longitude);
 },
 function(err){
 if(hasSaved)return; /* عندنا موقع محفوظ — يكفي */
 /* رُفض الإذن ولا موقع محفوظ: أخبر المستخدم بصراحة ثم اعرض مدينة مؤقتة */
 $("locName").innerHTML='<span style="font-size:13px">'+
 pick('فعّل إذن الموقع','فعّل إذن الموقع','Enable location')+
 '<small>'+pick('نعرض مسقط مؤقتًا','عرض مسقط مؤقتًا','Showing Muscat for now')+'</small></span>';
 var mi=0,i;
 for(i=0;i<CITIES.length;i++)if(CITIES[i].n==='مسقط'){mi=i;break;}
 selectCity(mi);
 },
 {timeout:12000,enableHighAccuracy:true,maximumAge:120000});
})();

/* يحوّل الإحداثيات الحقيقية إلى موقع نشط ويحفظها */
function useRealLocation(lat,lon){
 fetch("https://geocoding-api.open-meteo.com/v1/search?latitude="+lat+"&longitude="+lon+"&count=1&language="+(LANG==='en'?'en':'ar'))
.then(function(r){return r.ok?r.json():null;})
.then(function(d){
 var r0=(d&&d.results||[])[0];
 var nm=r0?r0.name:pick('موقعي','موقعي','My location'),co=r0?(r0.country||''):'';
 stSet('myLat',String(lat));stSet('myLon',String(lon));stSet('myName',nm);stSet('myCo',co);
 selectGlobal(lat,lon,nm,co);})
.catch(function(){
 var nm=pick('موقعي','موقعي','My location');
 stSet('myLat',String(lat));stSet('myLon',String(lon));stSet('myName',nm);stSet('myCo','');
 selectGlobal(lat,lon,nm,'');});}

setInterval(function(){pingVisit();},180000);
setInterval(function(){
 feedAstro();feedSave(); /* الأحداث الفلكية تتحرك دائمًا */
 var prev=IS_NIGHT,prevG=IS_GOLDEN;computeNight();
 if(TAB==='now'&&W&&TL_OFFSET===0){
 if(prev!==IS_NIGHT||prevG!==IS_GOLDEN)renderNow();
 else paintSky(stateOf(W)); /* تحديث ناعم للتدرّج كل دقيقة */
 }},60000);
</script>
